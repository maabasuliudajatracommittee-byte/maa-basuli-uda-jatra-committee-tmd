<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Management - Maa Basuli Uda Jatra Committee</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#222;
}

header{
  background:#7b1e1e;
  color:#fff;
  padding:16px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}

header h1{
  margin:0;
  font-size:21px;
}

header p{
  margin:4px 0 0;
  font-size:13px;
  opacity:.9;
}

.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:7px;
  padding:9px 13px;
  cursor:pointer;
  font-weight:600;
}

.btn-light{
  background:#fff;
  color:#7b1e1e;
}

.btn-primary{
  background:#7b1e1e;
  color:#fff;
}

.btn-success{
  background:#198754;
  color:#fff;
}

.btn-warning{
  background:#f0ad4e;
  color:#fff;
}

.btn-danger{
  background:#dc3545;
  color:#fff;
}

.btn-secondary{
  background:#6c757d;
  color:#fff;
}

.container{
  max-width:1400px;
  margin:22px auto;
  padding:0 16px;
}

.message{
  display:none;
  padding:12px 15px;
  border-radius:8px;
  margin-bottom:15px;
  font-weight:600;
}

.message.success{
  display:block;
  background:#d1e7dd;
  color:#0f5132;
}

.message.error{
  display:block;
  background:#f8d7da;
  color:#842029;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;
  margin-bottom:20px;
}

.stat-card{
  background:#fff;
  border-radius:10px;
  padding:18px;
  box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.stat-card h3{
  margin:0 0 8px;
  font-size:14px;
  color:#666;
}

.stat-card strong{
  font-size:26px;
  color:#7b1e1e;
}

.card{
  background:#fff;
  border-radius:10px;
  padding:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.07);
  margin-bottom:20px;
}

.card h2{
  margin:0 0 16px;
  color:#7b1e1e;
  font-size:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.form-group.full{
  grid-column:1/-1;
}

label{
  font-weight:600;
  font-size:14px;
}

input,
textarea,
select{
  width:100%;
  padding:10px 11px;
  border:1px solid #ccd2da;
  border-radius:7px;
  font-size:14px;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#7b1e1e;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.form-actions{
  margin-top:15px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.toolbar input,
.toolbar select{
  max-width:280px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1100px;
}

th,
td{
  border-bottom:1px solid #e5e7eb;
  padding:11px 9px;
  text-align:left;
  vertical-align:top;
  font-size:13px;
}

th{
  background:#f1f3f5;
  color:#333;
  white-space:nowrap;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}

.badge-new{
  background:#cff4fc;
  color:#055160;
}

.badge-review{
  background:#fff3cd;
  color:#664d03;
}

.badge-replied{
  background:#d1e7dd;
  color:#0f5132;
}

.badge-closed{
  background:#e2e3e5;
  color:#41464b;
}

.badge-published{
  background:#d1e7dd;
  color:#0f5132;
}

.badge-unpublished{
  background:#f8d7da;
  color:#842029;
}

.actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.actions button{
  padding:6px 8px;
  font-size:11px;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:999;
  padding:20px;
  overflow:auto;
}

.modal-box{
  background:#fff;
  max-width:700px;
  margin:40px auto;
  border-radius:10px;
  padding:22px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.modal-header h2{
  margin:0;
  color:#7b1e1e;
}

.close-btn{
  background:#dc3545;
  color:#fff;
}

.loading{
  text-align:center;
  padding:25px;
  color:#666;
}

@media(max-width:700px){
  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  header{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <h1>Contact Management</h1>
    <p>Maa Basuli Uda Jatra Committee</p>
  </div>

  <div class="top-actions">
    <button class="btn-light" onclick="goDashboard()">Dashboard</button>
    <button class="btn-light" onclick="loadMessages()">Refresh</button>
    <button class="btn-light" onclick="logout()">Logout</button>
  </div>
</header>

<div class="container">

  <div id="messageBox" class="message"></div>

  <div class="stats">
    <div class="stat-card">
      <h3>Total Messages</h3>
      <strong id="totalCount">0</strong>
    </div>

    <div class="stat-card">
      <h3>New</h3>
      <strong id="newCount">0</strong>
    </div>

    <div class="stat-card">
      <h3>Under Review</h3>
      <strong id="reviewCount">0</strong>
    </div>

    <div class="stat-card">
      <h3>Replied</h3>
      <strong id="repliedCount">0</strong>
    </div>

    <div class="stat-card">
      <h3>Closed</h3>
      <strong id="closedCount">0</strong>
    </div>

    <div class="stat-card">
      <h3>Published</h3>
      <strong id="publishedCount">0</strong>
    </div>
  </div>

  <div class="card">
    <h2>Add Contact Message</h2>

    <div class="form-grid">

      <div class="form-group">
        <label>Name</label>
        <input type="text" id="name" placeholder="Enter name">
      </div>

      <div class="form-group">
        <label>Mobile</label>
        <input type="text" id="mobile" placeholder="Enter mobile number">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter email">
      </div>

      <div class="form-group">
        <label>Subject</label>
        <input type="text" id="subject" placeholder="Enter subject">
      </div>

      <div class="form-group full">
        <label>Message</label>
        <textarea id="contactMessage" placeholder="Enter message"></textarea>
      </div>

    </div>

    <div class="form-actions">
      <button class="btn-primary" onclick="addMessage()">Save Message</button>
      <button class="btn-secondary" onclick="clearForm()">Clear</button>
    </div>
  </div>

  <div class="card">
    <h2>Contact Messages</h2>

    <div class="toolbar">
      <input
        type="text"
        id="searchBox"
        placeholder="Search name, mobile, email, subject..."
        oninput="renderMessages()"
      >

      <select id="statusFilter" onchange="renderMessages()">
        <option value="">All Status</option>
        <option value="New">New</option>
        <option value="Under Review">Under Review</option>
        <option value="Replied">Replied</option>
        <option value="Closed">Closed</option>
      </select>

      <select id="publishFilter" onchange="renderMessages()">
        <option value="">All Publish Status</option>
        <option value="true">Published</option>
        <option value="false">Unpublished</option>
      </select>
    </div>

    <div id="tableContainer">
      <div class="loading">Loading...</div>
    </div>
  </div>

</div>

<!-- EDIT MODAL -->
<div class="modal" id="editModal">

  <div class="modal-box">

    <div class="modal-header">
      <h2>Edit Contact Message</h2>
      <button class="close-btn" onclick="closeEditModal()">Close</button>
    </div>

    <input type="hidden" id="editId">

    <div class="form-grid">

      <div class="form-group">
        <label>Name</label>
        <input type="text" id="editName">
      </div>

      <div class="form-group">
        <label>Mobile</label>
        <input type="text" id="editMobile">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="editEmail">
      </div>

      <div class="form-group">
        <label>Subject</label>
        <input type="text" id="editSubject">
      </div>

      <div class="form-group">
        <label>Status</label>
        <select id="editStatus">
          <option value="New">New</option>
          <option value="Under Review">Under Review</option>
          <option value="Replied">Replied</option>
          <option value="Closed">Closed</option>
        </select>
      </div>

      <div class="form-group">
        <label>Published</label>
        <select id="editPublished">
          <option value="false">Unpublished</option>
          <option value="true">Published</option>
        </select>
      </div>

      <div class="form-group full">
        <label>Message</label>
        <textarea id="editMessage"></textarea>
      </div>

      <div class="form-group full">
        <label>Admin Reply</label>
        <textarea id="editReply" placeholder="Enter admin reply"></textarea>
      </div>

    </div>

    <div class="form-actions">
      <button class="btn-primary" onclick="updateMessage()">Update Message</button>
      <button class="btn-secondary" onclick="closeEditModal()">Cancel</button>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://ynymqntcawobcfccoekb.supabase.co";
const SUPABASE_KEY = "sb_publishable_VyaVcI_yPlsg0aTfd5ZpU_t--2_Nov";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let messages = [];

function showMessage(text, type="success"){
  const box = document.getElementById("messageBox");

  box.textContent = text;
  box.className = "message " + type;

  setTimeout(() => {
    box.className = "message";
    box.textContent = "";
  }, 4000);
}

async function checkSession(){

  const {
    data,
    error
  } = await supabaseClient.auth.getSession();

  if(error){
    console.error(error);
    window.location.href = "auth.html";
    return false;
  }

  if(!data.session){
    window.location.href = "auth.html";
    return false;
  }

  return true;
}

async function addMessage(){

  const name = document.getElementById("name").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const email = document.getElementById("email").value.trim();
  const subject = document.getElementById("subject").value.trim();
  const message = document.getElementById("contactMessage").value.trim();

  if(!name){
    showMessage("Name is required.", "error");
    return;
  }

  if(!message){
    showMessage("Message is required.", "error");
    return;
  }

  try{

    const {
      data:userData
    } = await supabaseClient.auth.getUser();

    const user = userData.user;

    const payload = {
      name: name,
      mobile: mobile || null,
      email: email || null,
      subject: subject || null,
      message: message,
      status: "New",
      admin_reply: null,
      is_published: false,
      created_by: user ? user.id : null
    };

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/contact_messages",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=representation"
        },

        body:JSON.stringify(payload)
      }
    );

    if(!response.ok){

      const errorText = await response.text();

      console.error(errorText);

      showMessage(
        "Save failed: " + errorText,
        "error"
      );

      return;
    }

    showMessage("Contact message saved successfully.");

    clearForm();

    await loadMessages();

  }catch(error){

    console.error(error);

    showMessage(
      "Something went wrong while saving.",
      "error"
    );
  }
}

function clearForm(){

  document.getElementById("name").value = "";
  document.getElementById("mobile").value = "";
  document.getElementById("email").value = "";
  document.getElementById("subject").value = "";
  document.getElementById("contactMessage").value = "";
}

async function loadMessages(){

  const container = document.getElementById("tableContainer");

  container.innerHTML =
    '<div class="loading">Loading contact messages...</div>';

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/contact_messages?select=*&order=created_at.desc",
      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY
        }
      }
    );

    if(!response.ok){

      const errorText = await response.text();

      console.error(errorText);

      container.innerHTML =
        '<div class="empty">Unable to load contact messages.</div>';

      showMessage(
        "Load failed: " + errorText,
        "error"
      );

      return;
    }

    messages = await response.json();

    updateStats();

    renderMessages();

  }catch(error){

    console.error(error);

    container.innerHTML =
      '<div class="empty">Connection error.</div>';

    showMessage(
      "Connection error while loading messages.",
      "error"
    );
  }
}

function updateStats(){

  document.getElementById("totalCount").textContent =
    messages.length;

  document.getElementById("newCount").textContent =
    messages.filter(x => x.status === "New").length;

  document.getElementById("reviewCount").textContent =
    messages.filter(x => x.status === "Under Review").length;

  document.getElementById("repliedCount").textContent =
    messages.filter(x => x.status === "Replied").length;

  document.getElementById("closedCount").textContent =
    messages.filter(x => x.status === "Closed").length;

  document.getElementById("publishedCount").textContent =
    messages.filter(x => x.is_published === true).length;
}

function renderMessages(){

  const container = document.getElementById("tableContainer");

  const search =
    document.getElementById("searchBox")
      .value
      .trim()
      .toLowerCase();

  const status =
    document.getElementById("statusFilter").value;

  const publish =
    document.getElementById("publishFilter").value;

  let filtered = messages.filter(item => {

    const searchable = (
      (item.name || "") + " " +
      (item.mobile || "") + " " +
      (item.email || "") + " " +
      (item.subject || "") + " " +
      (item.message || "")
    ).toLowerCase();

    const searchMatch =
      !search || searchable.includes(search);

    const statusMatch =
      !status || item.status === status;

    const publishMatch =
      !publish ||
      String(item.is_published) === publish;

    return searchMatch &&
           statusMatch &&
           publishMatch;
  });

  if(filtered.length === 0){

    container.innerHTML =
      '<div class="empty">No contact messages found.</div>';

    return;
  }

  let html = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Mobile</th>
            <th>Email</th>
            <th>Subject</th>
            <th>Message</th>
            <th>Status</th>
            <th>Published</th>
            <th>Admin Reply</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
  `;

  filtered.forEach(item => {

    const date = item.created_at
      ? new Date(item.created_at).toLocaleString("en-IN")
      : "-";

    let statusClass = "badge-new";

    if(item.status === "Under Review"){
      statusClass = "badge-review";
    }

    if(item.status === "Replied"){
      statusClass = "badge-replied";
    }

    if(item.status === "Closed"){
      statusClass = "badge-closed";
    }

    const publishClass =
      item.is_published
        ? "badge-published"
        : "badge-unpublished";

    const publishText =
      item.is_published
        ? "Published"
        : "Unpublished";

    html += `
      <tr>

        <td>${escapeHtml(date)}</td>

        <td>
          <strong>${escapeHtml(item.name || "-")}</strong>
        </td>

        <td>${escapeHtml(item.mobile || "-")}</td>

        <td>${escapeHtml(item.email || "-")}</td>

        <td>${escapeHtml(item.subject || "-")}</td>

        <td>${escapeHtml(item.message || "-")}</td>

        <td>
          <span class="badge ${statusClass}">
            ${escapeHtml(item.status || "-")}
          </span>
        </td>

        <td>
          <span class="badge ${publishClass}">
            ${publishText}
          </span>
        </td>

        <td>
          ${escapeHtml(item.admin_reply || "-")}
        </td>

        <td>
          <div class="actions">

            <button
              class="btn-primary"
              onclick="openEdit('${item.id}')">
              Edit
            </button>

            <button
              class="btn-warning"
              onclick="quickReview('${item.id}')">
              Review
            </button>

            <button
              class="btn-success"
              onclick="quickPublish('${item.id}')">
              ${item.is_published ? "Unpublish" : "Publish"}
            </button>

            <button
              class="btn-danger"
              onclick="deleteMessage('${item.id}')">
              Delete
            </button>

          </div>
        </td>

      </tr>
    `;
  });

  html += `
        </tbody>
      </table>
    </div>
  `;

  container.innerHTML = html;
}

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function openEdit(id){

  const item =
    messages.find(x => x.id === id);

  if(!item){
    showMessage("Message not found.", "error");
    return;
  }

  document.getElementById("editId").value =
    item.id;

  document.getElementById("editName").value =
    item.name || "";

  document.getElementById("editMobile").value =
    item.mobile || "";

  document.getElementById("editEmail").value =
    item.email || "";

  document.getElementById("editSubject").value =
    item.subject || "";

  document.getElementById("editStatus").value =
    item.status || "New";

  document.getElementById("editPublished").value =
    String(item.is_published);

  document.getElementById("editMessage").value =
    item.message || "";

  document.getElementById("editReply").value =
    item.admin_reply || "";

  document.getElementById("editModal").style.display =
    "block";
}

function closeEditModal(){

  document.getElementById("editModal").style.display =
    "none";
}

async function updateMessage(){

  const id =
    document.getElementById("editId").value;

  const name =
    document.getElementById("editName").value.trim();

  const mobile =
    document.getElementById("editMobile").value.trim();

  const email =
    document.getElementById("editEmail").value.trim();

  const subject =
    document.getElementById("editSubject").value.trim();

  const status =
    document.getElementById("editStatus").value;

  const isPublished =
    document.getElementById("editPublished").value === "true";

  const message =
    document.getElementById("editMessage").value.trim();

  const adminReply =
    document.getElementById("editReply").value.trim();

  if(!name){
    showMessage("Name is required.", "error");
    return;
  }

  if(!message){
    showMessage("Message is required.", "error");
    return;
  }

  try{

    const payload = {
      name:name,
      mobile:mobile || null,
      email:email || null,
      subject:subject || null,
      status:status,
      admin_reply:adminReply || null,
      is_published:isPublished,
      message:message,
      updated_at:new Date().toISOString()
    };

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/contact_messages?id=eq." +
      encodeURIComponent(id),
      {
        method:"PATCH",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=representation"
        },

        body:JSON.stringify(payload)
      }
    );

    if(!response.ok){

      const errorText =
        await response.text();

      console.error(errorText);

      showMessage(
        "Update failed: " + errorText,
        "error"
      );

      return;
    }

    closeEditModal();

    showMessage(
      "Contact message updated successfully."
    );

    await loadMessages();

  }catch(error){

    console.error(error);

    showMessage(
      "Something went wrong while updating.",
      "error"
    );
  }
}

async function quickReview(id){

  await updateStatus(
    id,
    "Under Review"
  );
}

async function updateStatus(id,status){

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/contact_messages?id=eq." +
      encodeURIComponent(id),
      {
        method:"PATCH",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=representation"
        },

        body:JSON.stringify({
          status:status,
          updated_at:new Date().toISOString()
        })
      }
    );

    if(!response.ok){

      const errorText =
        await response.text();

      showMessage(
        "Status update failed: " + errorText,
        "error"
      );

      return;
    }

    showMessage(
      "Status updated successfully."
    );

    await loadMessages();

  }catch(error){

    console.error(error);

    showMessage(
      "Status update error.",
      "error"
    );
  }
}

async function quickPublish(id){

  const item =
    messages.find(x => x.id === id);

  if(!item){
    return;
  }

  const newValue =
    !item.is_published;

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/contact_messages?id=eq." +
      encodeURIComponent(id),
      {
        method:"PATCH",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=representation"
        },

        body:JSON.stringify({
          is_published:newValue,
          updated_at:new Date().toISOString()
        })
      }
    );

    if(!response.ok){

      const errorText =
        await response.text();

      showMessage(
        "Publish update failed: " + errorText,
        "error"
      );

      return;
    }

    showMessage(
      newValue
        ? "Message published successfully."
        : "Message unpublished successfully."
    );

    await loadMessages();

  }catch(error){

    console.error(error);

    showMessage(
      "Publish update error.",
      "error"
    );
  }
}

async function deleteMessage(id){

  const item =
    messages.find(x => x.id === id);

  if(!item){
    return;
  }

  const confirmed =
    confirm(
      "Are you sure you want to delete this contact message?"
    );

  if(!confirmed){
    return;
  }

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/contact_messages?id=eq." +
      encodeURIComponent(id),
      {
        method:"DELETE",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY
        }
      }
    );

    if(!response.ok){

      const errorText =
        await response.text();

      showMessage(
        "Delete failed: " + errorText,
        "error"
      );

      return;
    }

    showMessage(
      "Contact message deleted successfully."
    );

    await loadMessages();

  }catch(error){

    console.error(error);

    showMessage(
      "Delete error.",
      "error"
    );
  }
}
