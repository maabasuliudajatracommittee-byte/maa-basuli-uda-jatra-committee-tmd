<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Maa Basuli Uda Jatra Committee</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#4b0710,#7b1e2b,#f7f7f7);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:460px;background:#fff;border-radius:22px;box-shadow:0 18px 55px rgba(0,0,0,.25);overflow:hidden}
.top{background:#7b1e2b;color:#fff;text-align:center;padding:26px 20px 22px}
.logo{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#fff;padding:4px;margin-bottom:10px}
h1{margin:0;font-size:24px}.subtitle{margin:7px 0 0;font-size:14px;opacity:.92}
.form{padding:28px 24px 26px}
label{display:block;margin:0 0 7px;font-weight:700;color:#4b0710}
input{width:100%;padding:13px 14px;border:1px solid #d8c8cb;border-radius:11px;font-size:16px;margin-bottom:17px;outline:none}
input:focus{border-color:#7b1e2b;box-shadow:0 0 0 3px rgba(123,30,43,.10)}
button{width:100%;border:0;border-radius:11px;padding:14px;background:#7b1e2b;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.message{display:none;margin-bottom:17px;padding:12px 13px;border-radius:10px;font-size:14px;line-height:1.45}
.message.success,.message.error,.message.info{display:block}
.message.success{background:#eaf7ee;color:#176b35}.message.error{background:#fff0f0;color:#a51d2d}.message.info{background:#f1f4f8;color:#34495e}
.note{margin-top:18px;text-align:center;color:#666;font-size:13px}
.back{display:block;text-align:center;margin-top:15px;color:#7b1e2b;font-weight:700;text-decoration:none}
.footer{text-align:center;padding:14px;background:#fafafa;color:#777;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <img id="logo" class="logo" alt="Maa Basuli">
    <h1>Reset Password</h1>
    <div class="subtitle">Maa Basuli Uda Jatra Committee, Thakurmunda</div>
  </div>
  <div class="form">
    <div id="message" class="message"></div>
    <div id="resetForm">
      <label for="newPassword">New Password</label>
      <input id="newPassword" type="password" minlength="6" placeholder="Enter new password" autocomplete="new-password">
      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" type="password" minlength="6" placeholder="Confirm new password" autocomplete="new-password">
      <button id="resetBtn" onclick="resetPassword()">Change Password</button>
    </div>
    <div class="note">Password must be at least 6 characters.</div>
    <a class="back" href="auth.html">← Back to Login</a>
  </div>
  <div class="footer">© Maa Basuli Uda Jatra Committee</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ynymqntcawobcfccoekb.supabase.co";
const SUPABASE_KEY="sb_publishable_VyaVcI_yPlsg0aTfd5ZpUQ_t--2_Nov";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function showMessage(text,type){
  const el=document.getElementById("message");
  el.textContent=text;
  el.className="message "+type;
}

async function loadBranding(){
  try{
    const {data}=await supabaseClient.from("website_settings")
      .select("logo_url,logo,site_logo_url,maa_basuli_url,maa_basuli_photo_url,maa_basuli_photo")
      .limit(1).maybeSingle();
    if(data){
      const logoUrl=data.logo_url||data.logo||data.site_logo_url||data.maa_basuli_url||data.maa_basuli_photo_url||data.maa_basuli_photo;
      if(logoUrl) document.getElementById("logo").src=logoUrl;
      else document.getElementById("logo").style.display="none";
    }
  }catch(e){document.getElementById("logo").style.display="none";}
}

async function resetPassword(){
  const newPassword=document.getElementById("newPassword").value;
  const confirmPassword=document.getElementById("confirmPassword").value;
  const btn=document.getElementById("resetBtn");

  if(!newPassword||!confirmPassword){showMessage("New Password ebam Confirm Password fill karantu.","error");return;}
  if(newPassword.length<6){showMessage("Password minimum 6 characters heba darkar.","error");return;}
  if(newPassword!==confirmPassword){showMessage("Password ebam Confirm Password same nuhe.","error");return;}

  btn.disabled=true;
  showMessage("Password change heuchhi...","info");

  const {error}=await supabaseClient.auth.updateUser({password:newPassword});
  if(error){
    console.error(error);
    showMessage("Password reset failed: "+error.message,"error");
    btn.disabled=false;
    return;
  }

  showMessage("✅ Password successfully changed. Ebe Login kari paribe.","success");
  document.getElementById("newPassword").value="";
  document.getElementById("confirmPassword").value="";
  setTimeout(()=>{window.location.href="auth.html";},2000);
}

async function checkRecoverySession(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(session){showMessage("New Password set karantu.","info");return;}

  const hash=window.location.hash||"";
  const search=window.location.search||"";
  if(hash.includes("access_token=")||search.includes("code=")){
    showMessage("Reset link verify heuchhi...","info");
    return;
  }

  showMessage("Reset link invalid ba expire heithiba sambhabana achhi. Login page ru nua Forgot Password link request karantu.","error");
  document.getElementById("resetForm").style.display="none";
}

supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(event==="PASSWORD_RECOVERY"&&session){
    document.getElementById("resetForm").style.display="block";
    showMessage("New Password set karantu.","info");
  }
});

loadBranding();
checkRecoverySession();
</script>
</body>
</html>
