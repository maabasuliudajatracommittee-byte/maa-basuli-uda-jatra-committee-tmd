<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | Maa Basuli Uda Jatra Committee</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff7e6;
      padding:20px;
    }

    .box{
      width:100%;
      max-width:460px;
      background:white;
      padding:30px;
      border-radius:16px;
      box-shadow:0 8px 30px rgba(0,0,0,.12);
    }

    .header{
      text-align:center;
      margin-bottom:25px;
    }

    .header h1{
      color:#9a3412;
      font-size:22px;
      margin-bottom:8px;
    }

    .header p{
      color:#64748b;
      font-size:13px;
    }

    h2{
      text-align:center;
      color:#7c2d12;
      margin-bottom:20px;
    }

    label{
      display:block;
      margin-bottom:7px;
      font-weight:bold;
      font-size:14px;
    }

    input{
      width:100%;
      padding:12px;
      border:1px solid #cbd5e1;
      border-radius:8px;
      margin-bottom:15px;
      font-size:15px;
    }

    button{
      width:100%;
      padding:13px;
      border:0;
      border-radius:8px;
      background:#9a3412;
      color:white;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
    }

    button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .message{
      margin-top:15px;
      padding:12px;
      border-radius:8px;
      display:none;
      font-size:14px;
      line-height:1.5;
    }

    .success{
      display:block;
      background:#dcfce7;
      color:#166534;
    }

    .error{
      display:block;
      background:#fee2e2;
      color:#991b1b;
    }

    .back{
      text-align:center;
      margin-top:20px;
    }

    .back a{
      color:#9a3412;
      text-decoration:none;
      font-weight:bold;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="header">
    <h1>ମା' ବାସୁଳୀ ଉଡ଼ା ଯାତ୍ରା କମିଟି</h1>
    <p>Maa Basuli Uda Jatra Committee, Thakurmunda</p>
  </div>

  <h2>Reset Password</h2>

  <form id="resetForm">

    <label for="password">
      New Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Enter new password"
      minlength="6"
      required
    >

    <label for="confirmPassword">
      Confirm New Password
    </label>

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm new password"
      minlength="6"
      required
    >

    <button type="submit" id="resetButton">
      Update Password
    </button>

  </form>

  <div id="message" class="message"></div>

  <div class="back">
    <a href="auth.html">
      ← Back to Login
    </a>
  </div>

</div>


<script>

const SUPABASE_URL =
  "https://ynymqntcawobcfccoekb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_VyaVcI_yPlsg0aTfd5ZpUQ_t--2_Nov";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const form =
  document.getElementById("resetForm");

const button =
  document.getElementById("resetButton");

const message =
  document.getElementById("message");


function showMessage(text, type){

  message.textContent = text;

  message.className =
    "message " + type;

}


/* Check recovery session */

async function checkRecoverySession(){

  const {
    data: {
      session
    }
  } = await supabaseClient.auth.getSession();


  if(!session){

    showMessage(
      "This password reset link is invalid or has expired. Please request a new password reset link.",
      "error"
    );

    button.disabled = true;

    return false;
  }

  return true;

}


checkRecoverySession();


/* Password update */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;


    if(password.length < 6){

      showMessage(
        "Password must contain at least 6 characters.",
        "error"
      );

      return;
    }


    if(password !== confirmPassword){

      showMessage(
        "Passwords do not match.",
        "error"
      );

      return;
    }


    button.disabled = true;

    button.textContent =
      "Updating...";


    const {
      error
    } = await supabaseClient.auth.updateUser({
      password: password
    });


    if(error){

      showMessage(
        "Password update failed: " +
        error.message,
        "error"
      );

      button.disabled = false;

      button.textContent =
        "Update Password";

      return;
    }


    showMessage(
      "Password updated successfully. You can now login with your new password.",
      "success"
    );


    form.reset();

    button.textContent =
      "Password Updated";

    button.disabled = true;


    setTimeout(() => {

      window.location.href =
        "auth.html";

    }, 2500);

  }
);

</script>

</body>
</html>
