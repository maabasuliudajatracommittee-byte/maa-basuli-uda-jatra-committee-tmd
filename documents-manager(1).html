<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents Management - Maa Basuli Uda Jatra Committee</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#222;
}
header{
    background:#7b1e1e;
    color:#fff;
    padding:16px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}
header h1{margin:0;font-size:21px}
header small{opacity:.9}

.top-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}
button{
    border:0;
    padding:10px 15px;
    border-radius:7px;
    cursor:pointer;
    font-weight:600;
}
.btn-light{background:#fff;color:#7b1e1e}
.btn-primary{background:#7b1e1e;color:#fff}
.btn-success{background:#198754;color:#fff}
.btn-warning{background:#f0ad4e;color:#fff}
.btn-danger{background:#dc3545;color:#fff}
.btn-secondary{background:#6c757d;color:#fff}

.container{
    max-width:1250px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
    color:#7b1e1e;
    font-size:20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}
.stat{
    background:#fff;
    padding:18px;
    border-radius:10px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}
.stat h3{
    margin:0 0 8px;
    font-size:14px;
    color:#666;
}
.stat strong{
    font-size:27px;
    color:#7b1e1e;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
}
.form-group.full{
    grid-column:1/-1;
}
label{
    font-weight:600;
    margin-bottom:6px;
}
input,select,textarea{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:14px;
}
textarea{
    min-height:90px;
    resize:vertical;
}

.form-actions{
    margin-top:18px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.table-wrap{
    overflow-x:auto;
}
table{
    width:100%;
    border-collapse:collapse;
    min-width:1000px;
}
th,td{
    padding:11px;
    border-bottom:1px solid #eee;
    text-align:left;
    vertical-align:middle;
}
th{
    background:#f3f3f3;
    color:#555;
}
tr:hover{background:#fafafa}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
}
.badge-green{background:#d1e7dd;color:#0f5132}
.badge-red{background:#f8d7da;color:#842029}
.badge-yellow{background:#fff3cd;color:#664d03}
.badge-blue{background:#cfe2ff;color:#084298}

.actions{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}
.actions button{
    padding:7px 10px;
    font-size:12px;
}

.search-row{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:10px;
}

.hidden{display:none!important}

.message{
    padding:12px;
    border-radius:7px;
    margin-bottom:15px;
    display:none;
}
.success{
    background:#d1e7dd;
    color:#0f5132;
}
.error{
    background:#f8d7da;
    color:#842029;
}

#loading{
    text-align:center;
    padding:20px;
    color:#777;
}

@media(max-width:800px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .form-grid{grid-template-columns:1fr}
    .search-row{grid-template-columns:1fr}
}

@media(max-width:500px){
    .stats{grid-template-columns:1fr}
    header h1{font-size:17px}
}
</style>
</head>

<body>

<header>
    <div>
        <h1>📄 Documents Management</h1>
        <small>Maa Basuli Uda Jatra Committee</small>
    </div>

    <div class="top-actions">
        <button class="btn-light" onclick="goDashboard()">Dashboard</button>
        <button class="btn-light" onclick="loadDocuments()">Refresh</button>
        <button class="btn-danger" onclick="logout()">Logout</button>
    </div>
</header>

<div class="container">

    <div id="message" class="message"></div>

    <div class="stats">
        <div class="stat">
            <h3>Total Documents</h3>
            <strong id="totalCount">0</strong>
        </div>

        <div class="stat">
            <h3>Published</h3>
            <strong id="publishedCount">0</strong>
        </div>

        <div class="stat">
            <h3>Active</h3>
            <strong id="activeCount">0</strong>
        </div>

        <div class="stat">
            <h3>Inactive</h3>
            <strong id="inactiveCount">0</strong>
        </div>
    </div>

    <!-- ADD / EDIT -->
    <div class="card">
        <h2 id="formTitle">➕ Add Document</h2>

        <div class="form-grid">

            <div class="form-group">
                <label>Document Title *</label>
                <input type="text" id="title" placeholder="Enter document title">
            </div>

            <div class="form-group">
                <label>Document Type</label>
                <select id="documentType">
                    <option value="">Select Type</option>
                    <option value="Notice">Notice</option>
                    <option value="Permission Letter">Permission Letter</option>
                    <option value="Invitation">Invitation</option>
                    <option value="RTI">RTI</option>
                    <option value="Report">Report</option>
                    <option value="Certificate">Certificate</option>
                    <option value="Letter">Letter</option>
                    <option value="Office Order">Office Order</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Financial Year</label>
                <input type="text" id="financialYear" placeholder="2026-27">
            </div>

            <div class="form-group">
                <label>Display Order</label>
                <input type="number" id="displayOrder" value="0">
            </div>

            <div class="form-group full">
                <label>Description</label>
                <textarea id="description" placeholder="Enter document description"></textarea>
            </div>

            <div class="form-group full">
                <label>Document URL</label>
                <input type="url" id="documentUrl" placeholder="https://...">
            </div>

            <div class="form-group">
                <label>Active Status</label>
                <select id="isActive">
                    <option value="true">Active</option>
                    <option value="false">Inactive</option>
                </select>
            </div>

            <div class="form-group">
                <label>Publish Status</label>
                <select id="isPublished">
                    <option value="false">Hidden</option>
                    <option value="true">Published</option>
                </select>
            </div>

        </div>

        <div class="form-actions">
            <button class="btn-primary" onclick="saveDocument()">Save Document</button>
            <button class="btn-secondary hidden" id="cancelBtn" onclick="resetForm()">Cancel Edit</button>
        </div>
    </div>

    <!-- SEARCH -->
    <div class="card">
        <h2>📋 Documents List</h2>

        <div class="search-row">
            <input
                type="text"
                id="searchInput"
                placeholder="Search title, description, type..."
                oninput="renderDocuments()"
            >

            <select id="filterPublished" onchange="renderDocuments()">
                <option value="">All Publish Status</option>
                <option value="true">Published</option>
                <option value="false">Hidden</option>
            </select>

            <select id="filterActive" onchange="renderDocuments()">
                <option value="">All Active Status</option>
                <option value="true">Active</option>
                <option value="false">Inactive</option>
            </select>
        </div>

        <div id="loading">Loading documents...</div>

        <div class="table-wrap">
            <table id="documentsTable" class="hidden">
                <thead>
                    <tr>
                        <th>Sl.</th>
                        <th>Title</th>
                        <th>Type</th>
                        <th>Financial Year</th>
                        <th>Order</th>
                        <th>Active</th>
                        <th>Published</th>
                        <th>Document</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="documentsBody"></tbody>
            </table>
        </div>
    </div>

</div>


<script>
/* Shared Supabase session compatibility */
function getSupabaseAccessToken(){
    const direct = localStorage.getItem("supabase_access_token");
    if(direct) return direct;

    const projectRef = "ynymqntcawobcfccoekb";
    const authKey = "sb-" + projectRef + "-auth-token";

    try{
        const raw = localStorage.getItem(authKey);
        if(raw){
            const parsed = JSON.parse(raw);
            return parsed?.access_token ||
                   parsed?.currentSession?.access_token ||
                   parsed?.session?.access_token ||
                   null;
        }
    }catch(e){}

    return null;
}

function clearLegacyAuth(){
    localStorage.removeItem("supabase_access_token");
    localStorage.removeItem("supabase_refresh_token");
}
</script>
<script>
const SUPABASE_URL = "https://ynymqntcawobcfccoekb.supabase.co";
const SUPABASE_KEY = "sb_publishable_VyaVcI_yPlsg0aTfd5ZpUQ_t--2_Nov";

let currentUser = null;
let documents = [];
let editingId = null;

const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json"
};

async function getSessionUser(){
    const token = getSupabaseAccessToken();

    if(!token){
        location.href = "auth.html";
        return null;
    }

    const res = await fetch(
        SUPABASE_URL + "/auth/v1/user",
        {
            headers:{
                "apikey":SUPABASE_KEY,
                "Authorization":"Bearer " + token
            }
        }
    );

    if(!res.ok){
        clearLegacyAuth();
        location.href = "auth.html";
        return null;
    }

    return await res.json();
}

function apiHeaders(){
    const token = getSupabaseAccessToken();

    return {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json"
    };
}

function showMessage(text,type="success"){
    const box=document.getElementById("message");

    box.textContent=text;
    box.className="message " + type;
    box.style.display="block";

    setTimeout(()=>{
        box.style.display="none";
    },4000);
}

function goDashboard(){
    location.href="super-admin.html";
}

async function logout(){
    const token=getSupabaseAccessToken();

    try{
        if(token){
            await fetch(
                SUPABASE_URL + "/auth/v1/logout",
                {
                    method:"POST",
                    headers:apiHeaders()
                }
            );
        }
    }catch(e){}

    clearLegacyAuth();
    localStorage.removeItem("supabase_refresh_token");

    location.href="auth.html";
}

async function loadDocuments(){

    document.getElementById("loading").classList.remove("hidden");
    document.getElementById("documentsTable").classList.add("hidden");

    const res=await fetch(
        SUPABASE_URL +
        "/rest/v1/documents?select=*&order=display_order.asc,created_at.desc",
        {
            headers:apiHeaders()
        }
    );

    if(!res.ok){
        const err=await res.text();
        console.error(err);

        document.getElementById("loading").textContent=
            "Unable to load documents.";

        showMessage("Documents load failed.","error");
        return;
    }

    documents=await res.json();

    updateStats();
    renderDocuments();

    document.getElementById("loading").classList.add("hidden");
    document.getElementById("documentsTable").classList.remove("hidden");
}

function updateStats(){

    document.getElementById("totalCount").textContent=documents.length;

    document.getElementById("publishedCount").textContent=
        documents.filter(x=>x.is_published===true).length;

    document.getElementById("activeCount").textContent=
        documents.filter(x=>x.is_active===true).length;

    document.getElementById("inactiveCount").textContent=
        documents.filter(x=>x.is_active===false).length;
}

function renderDocuments(){

    const search=
        document.getElementById("searchInput").value
        .trim()
        .toLowerCase();

    const publishedFilter=
        document.getElementById("filterPublished").value;

    const activeFilter=
        document.getElementById("filterActive").value;

    let filtered=documents.filter(doc=>{

        const text=(
            (doc.title||"") + " " +
            (doc.description||"") + " " +
            (doc.document_type||"") + " " +
            (doc.financial_year||"")
        ).toLowerCase();

        if(search && !text.includes(search)){
            return false;
        }

        if(
            publishedFilter!=="" &&
            String(doc.is_published)!==publishedFilter
        ){
            return false;
        }

        if(
            activeFilter!=="" &&
            String(doc.is_active)!==activeFilter
        ){
            return false;
        }

        return true;
    });

    const body=document.getElementById("documentsBody");

    body.innerHTML="";

    if(filtered.length===0){
        body.innerHTML=`
            <tr>
                <td colspan="9" style="text-align:center;padding:25px">
                    No documents found.
                </td>
            </tr>
        `;
        return;
    }

    filtered.forEach((doc,index)=>{

        const tr=document.createElement("tr");

        tr.innerHTML=`
            <td>${index+1}</td>

            <td>
                <strong>${escapeHtml(doc.title||"")}</strong>
                ${
                    doc.description
                    ? `<br><small>${escapeHtml(doc.description)}</small>`
                    : ""
                }
            </td>

            <td>${escapeHtml(doc.document_type||"-")}</td>

            <td>${escapeHtml(doc.financial_year||"-")}</td>

            <td>${doc.display_order ?? 0}</td>

            <td>
                ${
                    doc.is_active
                    ? '<span class="badge badge-green">Active</span>'
                    : '<span class="badge badge-red">Inactive</span>'
                }
            </td>

            <td>
                ${
                    doc.is_published
                    ? '<span class="badge badge-blue">Published</span>'
                    : '<span class="badge badge-yellow">Hidden</span>'
                }
            </td>

            <td>
                ${
                    doc.document_url
                    ? `<a href="${escapeAttribute(doc.document_url)}"
                           target="_blank"
                           rel="noopener"
                           class="btn-secondary"
                           style="display:inline-block;padding:7px 10px;border-radius:6px;color:white;text-decoration:none">
                           View
                       </a>`
                    : "-"
                }
            </td>

            <td>
                <div class="actions">

                    <button
                        class="btn-primary"
                        onclick="editDocument('${doc.id}')">
                        Edit
                    </button>

                    <button
                        class="${doc.is_published?'btn-warning':'btn-success'}"
                        onclick="togglePublish('${doc.id}',${!doc.is_published})">
                        ${doc.is_published?'Hide':'Publish'}
                    </button>

                    <button
                        class="${doc.is_active?'btn-warning':'btn-success'}"
                        onclick="toggleActive('${doc.id}',${!doc.is_active})">
                        ${doc.is_active?'Deactivate':'Activate'}
                    </button>

                    <button
                        class="btn-danger"
                        onclick="deleteDocument('${doc.id}')">
                        Delete
                    </button>

                </div>
            </td>
        `;

        body.appendChild(tr);
    });
}

function escapeHtml(value){
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function escapeAttribute(value){
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll('"',"&quot;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");
}

function resetForm(){

    editingId=null;

    document.getElementById("formTitle").textContent="➕ Add Document";

    document.getElementById("title").value="";
    document.getElementById("documentType").value="";
    document.getElementById("financialYear").value="";
    document.getElementById("displayOrder").value="0";
    document.getElementById("description").value="";
    document.getElementById("documentUrl").value="";
    document.getElementById("isActive").value="true";
    document.getElementById("isPublished").value="false";

    document.getElementById("cancelBtn").classList.add("hidden");
}

function editDocument(id){

    const doc=documents.find(x=>x.id===id);

    if(!doc)return;

    editingId=id;

    document.getElementById("formTitle").textContent="✏️ Edit Document";

    document.getElementById("title").value=doc.title||"";
    document.getElementById("documentType").value=doc.document_type||"";
    document.getElementById("financialYear").value=doc.financial_year||"";
    document.getElementById("displayOrder").value=doc.display_order ?? 0;
    document.getElementById("description").value=doc.description||"";
    document.getElementById("documentUrl").value=doc.document_url||"";
    document.getElementById("isActive").value=String(doc.is_active);
    document.getElementById("isPublished").value=String(doc.is_published);

    document.getElementById("cancelBtn").classList.remove("hidden");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

async function saveDocument(){

    const title=document.getElementById("title").value.trim();

    if(!title){
        showMessage("Document Title is required.","error");
        return;
    }

    const payload={
        title:title,
        description:document.getElementById("description").value.trim() || null,
        document_type:document.getElementById("documentType").value || null,
        document_url:document.getElementById("documentUrl").value.trim() || null,
        financial_year:document.getElementById("financialYear").value.trim() || null,
        display_order:Number(document.getElementById("displayOrder").value)||0,
        is_active:document.getElementById("isActive").value==="true",
        is_published:document.getElementById("isPublished").value==="true"
    };

    let url=SUPABASE_URL+"/rest/v1/documents";
    let method="POST";

    if(editingId){
        url += "?id=eq."+encodeURIComponent(editingId);
        method="PATCH";
    }else{
        payload.created_by=currentUser.id;
    }

    const res=await fetch(url,{
        method:method,
        headers:{
            ...apiHeaders(),
            "Prefer": editingId
                ? "return=representation"
                : "return=representation"
        },
        body:JSON.stringify(payload)
    });

    if(!res.ok){
        const err=await res.text();
        console.error(err);

        showMessage(
            "Document save failed: " + err,
            "error"
        );
        return;
    }

    showMessage(
        editingId
        ? "Document updated successfully."
        : "Document added successfully."
    );

    resetForm();
    await loadDocuments();
}

async function togglePublish(id,value){

    const res=await fetch(
        SUPABASE_URL+
        "/rest/v1/documents?id=eq."+encodeURIComponent(id),
        {
            method:"PATCH",
            headers:{
                ...apiHeaders(),
                "Prefer":"return=minimal"
            },
            body:JSON.stringify({
                is_published:value
            })
        }
    );

    if(!res.ok){
        showMessage("Publish status update failed.","error");
        return;
    }

    showMessage(
        value
        ? "Document published."
        : "Document hidden."
    );

    await loadDocuments();
}

async function toggleActive(id,value){

    const res=await fetch(
        SUPABASE_URL+
        "/rest/v1/documents?id=eq."+encodeURIComponent(id),
        {
            method:"PATCH",
            headers:{
                ...apiHeaders(),
                "Prefer":"return=minimal"
            },
            body:JSON.stringify({
                is_active:value
            })
        }
    );

    if(!res.ok){
        showMessage("Active status update failed.","error");
        return;
    }

    showMessage(
        value
        ? "Document activated."
        : "Document deactivated."
    );

    await loadDocuments();
}

async function deleteDocument(id){

    const doc=documents.find(x=>x.id===id);

    if(!doc)return;

    if(!confirm(
        `Delete "${doc.title}" permanently?`
    )){
        return;
    }

    const res=await fetch(
        SUPABASE_URL+
        "/rest/v1/documents?id=eq."+encodeURIComponent(id),
        {
            method:"DELETE",
            headers:{
                ...apiHeaders(),
                "Prefer":"return=minimal"
            }
        }
    );

    if(!res.ok){
        const err=await res.text();
        console.error(err);

        showMessage(
            "Delete failed: " + err,
            "error"
        );
        return;
    }

    showMessage("Document deleted successfully.");

    await loadDocuments();
}

async function init(){

    currentUser=await getSessionUser();

    if(!currentUser)return;

    await loadDocuments();
}

init();
</script>

</body>
</html>
