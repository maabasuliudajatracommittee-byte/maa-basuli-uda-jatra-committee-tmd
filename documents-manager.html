<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents Management - Maa Basuli Uda Jatra Committee</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#222;
}

header{
  background:#6d28d9;
  color:#fff;
  padding:18px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

header h1{
  margin:0;
  font-size:21px;
}

header p{
  margin:5px 0 0;
  font-size:13px;
  opacity:.9;
}

.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:600;
}

.btn-white{
  background:#fff;
  color:#4c1d95;
}

.btn-red{
  background:#dc2626;
  color:#fff;
}

.btn-purple{
  background:#6d28d9;
  color:#fff;
}

.container{
  max-width:1200px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.stat{
  padding:18px;
  border-radius:12px;
  background:#f3e8ff;
}

.stat b{
  display:block;
  font-size:28px;
  color:#6d28d9;
  margin-top:5px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.full{
  grid-column:1/-1;
}

label{
  font-weight:600;
  font-size:14px;
  display:block;
  margin-bottom:6px;
}

input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:14px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th,td{
  padding:11px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
  font-size:13px;
  vertical-align:top;
}

th{
  background:#f3f4f6;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
}

.active{
  background:#dcfce7;
  color:#166534;
}

.inactive{
  background:#fee2e2;
  color:#991b1b;
}

.published{
  background:#dbeafe;
  color:#1d4ed8;
}

.hidden-badge{
  background:#f3f4f6;
  color:#4b5563;
}

.message{
  display:none;
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.hidden{
  display:none!important;
}

.small{
  font-size:12px;
  color:#6b7280;
}

.link{
  color:#2563eb;
  text-decoration:none;
}

@media(max-width:750px){
  .stats,
  .form-grid{
    grid-template-columns:1fr;
  }

  header{
    align-items:flex-start;
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <h1>📄 Documents Management</h1>
    <p>Maa Basuli Uda Jatra Committee — Super Admin</p>
  </div>

  <div class="top-actions">
    <button class="btn-white" onclick="goDashboard()">Dashboard</button>
    <button class="btn-red" onclick="logout()">Logout</button>
  </div>
</header>


<div class="container">

  <div id="message" class="message"></div>


  <!-- STATISTICS -->
  <div class="card">

    <div class="stats">

      <div class="stat">
        Total Documents
        <b id="totalCount">0</b>
      </div>

      <div class="stat">
        Published
        <b id="publishedCount">0</b>
      </div>

      <div class="stat">
        Active
        <b id="activeCount">0</b>
      </div>

    </div>

  </div>


  <!-- DOCUMENT FORM -->
  <div class="card">

    <h2 id="formTitle">➕ Add Document</h2>

    <div class="form-grid">

      <div>
        <label>Document Title *</label>
        <input
          id="title"
          type="text"
          placeholder="Document title">
      </div>


      <div>
        <label>Document Type</label>

        <select id="documentType">

          <option value="">Select type</option>
          <option>Notice</option>
          <option>Permission Letter</option>
          <option>Invitation</option>
          <option>RTI</option>
          <option>Report</option>
          <option>Meeting Document</option>
          <option>Other</option>

        </select>
      </div>


      <div>
        <label>Financial Year</label>

        <input
          id="financialYear"
          type="text"
          placeholder="2026-27">
      </div>


      <div>
        <label>Display Order</label>

        <input
          id="displayOrder"
          type="number"
          value="0">
      </div>


      <div class="full">

        <label>Document URL</label>

        <input
          id="documentUrl"
          type="url"
          placeholder="https://...">

      </div>


      <div class="full">

        <label>Description</label>

        <textarea
          id="description"
          placeholder="Short description"></textarea>

      </div>


      <div>

        <label>
          <input
            id="isActive"
            type="checkbox"
            checked
            style="width:auto;margin-right:6px">

          Active
        </label>

      </div>


      <div>

        <label>
          <input
            id="isPublished"
            type="checkbox"
            style="width:auto;margin-right:6px">

          Published
        </label>

      </div>

    </div>


    <div class="actions">

      <button
        class="btn-purple"
        onclick="saveDocument()">

        Save Document

      </button>


      <button
        id="cancelBtn"
        class="btn-white hidden"
        onclick="resetForm()">

        Cancel Edit

      </button>

    </div>

  </div>


  <!-- DOCUMENT LIST -->
  <div class="card">

    <div
      style="
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:15px">

      <h2 style="margin:0">
        Document List
      </h2>


      <input
        id="searchInput"
        style="max-width:350px"
        placeholder="Search documents..."
        oninput="renderDocuments()">

    </div>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>#</th>
            <th>Title</th>
            <th>Type</th>
            <th>Financial Year</th>
            <th>Order</th>
            <th>Status</th>
            <th>URL</th>
            <th>Actions</th>

          </tr>

        </thead>


        <tbody id="documentsBody">

          <tr>
            <td colspan="8">
              Loading...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://ynymqntcawobcfccoekb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VyaVcI_yPlsg0aTfd5ZpU_t--2_Nov";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let currentUser = null;
let documents = [];
let editingId = null;


/* API HEADERS */

function apiHeaders(extra = {}){

  return {

    "apikey": SUPABASE_KEY,

    "Authorization":
      "Bearer " + SUPABASE_KEY,

    "Content-Type":
      "application/json",

    ...extra

  };

}


/* MESSAGE */

function showMessage(
  text,
  type = "success"
){

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message " + type;

  box.style.display = "block";


  setTimeout(
    () => {
      box.style.display = "none";
    },
    4000
  );

}


/* DASHBOARD */

function goDashboard(){

  window.location.href =
    "super-admin.html";

}


/* LOGOUT */

async function logout(){

  try{

    await supabaseClient.auth.signOut();

  }catch(e){}

  localStorage.removeItem(
    "supabase_access_token"
  );

  localStorage.removeItem(
    "supabase_refresh_token"
  );

  window.location.href =
    "auth.html";

}


/* AUTH CHECK */

async function checkAuth(){

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();


  if(
    error ||
    !data.session
  ){

    window.location.href =
      "auth.html";

    return false;

  }


  currentUser =
    data.session.user;

  return true;

}


/* LOAD DOCUMENTS */

async function loadDocuments(){

  const body =
    document.getElementById(
      "documentsBody"
    );


  body.innerHTML =
    '<tr><td colspan="8">Loading...</td></tr>';


  try{

    const res =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/documents?select=*&order=display_order.asc,created_at.desc",

        {
          headers:
            apiHeaders()
        }

      );


    if(!res.ok){

      throw new Error(
        await res.text()
      );

    }


    documents =
      await res.json();


    updateStats();

    renderDocuments();


  }catch(err){

    console.error(err);

    body.innerHTML =
      '<tr><td colspan="8">Unable to load documents.</td></tr>';


    showMessage(
      "Documents load failed: " +
      err.message,
      "error"
    );

  }

}


/* STATISTICS */

function updateStats(){

  document.getElementById(
    "totalCount"
  ).textContent =
    documents.length;


  document.getElementById(
    "publishedCount"
  ).textContent =
    documents.filter(
      x => x.is_published === true
    ).length;


  document.getElementById(
    "activeCount"
  ).textContent =
    documents.filter(
      x => x.is_active === true
    ).length;

}


/* ESCAPE HTML */

function esc(value){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


/* RENDER */

function renderDocuments(){

  const body =
    document.getElementById(
      "documentsBody"
    );


  const search =
    document.getElementById(
      "searchInput"
    ).value
     .trim()
     .toLowerCase();


  const filtered =
    documents.filter(
      doc => {

        const text = [

          doc.title,
          doc.description,
          doc.document_type,
          doc.financial_year

        ]
        .join(" ")
        .toLowerCase();


        return (
          !search ||
          text.includes(search)
        );

      }
    );


  body.innerHTML = "";


  if(filtered.length === 0){

    body.innerHTML =
      '<tr><td colspan="8">No documents found.</td></tr>';

    return;

  }


  filtered.forEach(
    (doc,index) => {

      const tr =
        document.createElement(
          "tr"
        );


      tr.innerHTML = `

        <td>
          ${index + 1}
        </td>


        <td>

          <b>
            ${esc(doc.title)}
          </b>

          <br>

          <span class="small">
            ${esc(
              doc.description || ""
            )}
          </span>

        </td>


        <td>
          ${esc(
            doc.document_type || "-"
          )}
        </td>


        <td>
          ${esc(
            doc.financial_year || "-"
          )}
        </td>


        <td>
          ${doc.display_order ?? 0}
        </td>


        <td>

          ${
            doc.is_active

            ? '<span class="badge active">Active</span>'

            : '<span class="badge inactive">Inactive</span>'
          }

          <br>

          ${
            doc.is_published

            ? '<span class="badge published">Published</span>'

            : '<span class="badge hidden-badge">Hidden</span>'
          }

        </td>


        <td>

          ${
            doc.document_url

            ? `<a
                class="link"
                href="${esc(doc.document_url)}"
                target="_blank"
                rel="noopener">
                View
               </a>`

            : "-"
          }

        </td>


        <td>

          <div class="actions">

            <button
              onclick="editDocument('${doc.id}')">
              Edit
            </button>


            <button
              onclick="togglePublish(
                '${doc.id}',
                ${!doc.is_published}
              )">

              ${
                doc.is_published
                ? "Hide"
                : "Publish"
              }

            </button>


            <button
              onclick="toggleActive(
                '${doc.id}',
                ${!doc.is_active}
              )">

              ${
                doc.is_active
                ? "Deactivate"
                : "Activate"
              }

            </button>


            <button
              class="btn-red"
              onclick="deleteDocument('${doc.id}')">

              Delete

            </button>

          </div>

        </td>

      `;


      body.appendChild(tr);

    }
  );

}


/* RESET FORM */

function resetForm(){

  editingId = null;


  document.getElementById(
    "formTitle"
  ).textContent =
    "➕ Add Document";


  document.getElementById(
    "title"
  ).value = "";


  document.getElementById(
    "documentType"
  ).value = "";


  document.getElementById(
    "financialYear"
  ).value = "";


  document.getElementById(
    "documentUrl"
  ).value = "";


  document.getElementById(
    "displayOrder"
  ).value = "0";


  document.getElementById(
    "description"
  ).value = "";


  document.getElementById(
    "isActive"
  ).checked = true;


  document.getElementById(
    "isPublished"
  ).checked = false;


  document.getElementById(
    "cancelBtn"
  ).classList.add(
    "hidden"
  );

}


/* EDIT */

function editDocument(id){

  const doc =
    documents.find(
      x => x.id === id
    );


  if(!doc) return;


  editingId = id;


  document.getElementById(
    "formTitle"
  ).textContent =
    "✏️ Edit Document";


  document.getElementById(
    "title"
  ).value =
    doc.title || "";


  document.getElementById(
    "documentType"
  ).value =
    doc.document_type || "";


  document.getElementById(
    "financialYear"
  ).value =
    doc.financial_year || "";


  document.getElementById(
    "documentUrl"
  ).value =
    doc.document_url || "";


  document.getElementById(
    "displayOrder"
  ).value =
    doc.display_order ?? 0;


  document.getElementById(
    "description"
  ).value =
    doc.description || "";


  document.getElementById(
    "isActive"
  ).checked =
    !!doc.is_active;


  document.getElementById(
    "isPublished"
  ).checked =
    !!doc.is_published;


  document.getElementById(
    "cancelBtn"
  ).classList.remove(
    "hidden"
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* SAVE */

async function saveDocument(){

  const title =
    document.getElementById(
      "title"
    ).value.trim();


  if(!title){

    showMessage(
      "Document Title is required.",
      "error"
    );

    return;

  }


  const payload = {

    title,

    description:
      document.getElementById(
        "description"
      ).value.trim() || null,


    document_type:
      document.getElementById(
        "documentType"
      ).value || null,


    document_url:
      document.getElementById(
        "documentUrl"
      ).value.trim() || null,


    financial_year:
      document.getElementById(
        "financialYear"
      ).value.trim() || null,


    display_order:
      Number(
        document.getElementById(
          "displayOrder"
        ).value
      ) || 0,


    is_active:
      document.getElementById(
        "isActive"
      ).checked,


    is_published:
      document.getElementById(
        "isPublished"
      ).checked

  };


  try{

    let res;


    if(editingId){

      res =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/documents?id=eq." +
          encodeURIComponent(
            editingId
          ),

          {

            method:"PATCH",

            headers:
              apiHeaders({
                "Prefer":
                  "return=minimal"
              }),

            body:
              JSON.stringify(
                payload
              )

          }

        );

    }else{

      payload.created_by =
        currentUser.id;


      res =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/documents",

          {

            method:"POST",

            headers:
              apiHeaders({
                "Prefer":
                  "return=minimal"
              }),

            body:
              JSON.stringify(
                payload
              )

          }

        );

    }


    if(!res.ok){

      throw new Error(
        await res.text()
      );

    }


    showMessage(
      editingId
      ? "Document updated successfully."
      : "Document added successfully."
    );


    resetForm();

    await loadDocuments();


  }catch(err){

    console.error(err);

    showMessage(
      "Document save failed: " +
      err.message,
      "error"
    );

  }

}


/* PUBLISH / HIDE */

async function togglePublish(
  id,
  value
){

  try{

    const res =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/documents?id=eq." +
        encodeURIComponent(id),

        {

          method:"PATCH",

          headers:
            apiHeaders({
              "Prefer":
                "return=minimal"
            }),

          body:
            JSON.stringify({
              is_published:value
            })

        }

      );


    if(!res.ok){

      throw new Error(
        await res.text()
      );

    }


    showMessage(
      value
      ? "Document published."
      : "Document hidden."
    );


    await loadDocuments();


  }catch(err){

    showMessage(
      "Publish status update failed: " +
      err.message,
      "error"
    );

  }

}


/* ACTIVE / INACTIVE */

async function toggleActive(
  id,
  value
){

  try{

    const res =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/documents?id=eq." +
        encodeURIComponent(id),

        {

          method:"PATCH",

          headers:
            apiHeaders({
              "Prefer":
                "return=minimal"
            }),

          body:
            JSON.stringify({
              is_active:value
            })

        }

      );


    if(!res.ok){

      throw new Error(
        await res.text()
      );

    }


    showMessage(
      value
      ? "Document activated."
      : "Document deactivated."
    );


    await loadDocuments();


  }catch(err){

    showMessage(
      "Active status update failed: " +
      err.message,
      "error"
    );

  }

}


/* DELETE */

async function deleteDocument(
  id
){

  const doc =
    documents.find(
      x => x.id === id
    );


  if(!doc) return;


  if(
    !confirm(
      'Delete "' +
      (doc.title ||
       "this document") +
      '"?'
    )
  ){

    return;

  }


  try{

    const res =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/documents?id=eq." +
        encodeURIComponent(id),

        {

          method:"DELETE",

          headers:
            apiHeaders({
              "Prefer":
                "return=minimal"
            })

        }

      );


    if(!res.ok){

      throw new Error(
        await res.text()
      );

    }


    showMessage(
      "Document deleted."
    );


    if(editingId === id){

      resetForm();

    }


    await loadDocuments();


  }catch(err){

    showMessage(
      "Document delete failed: " +
      err.message,
      "error"
    );

  }

}


/* START */

(async function(){

  const ok =
    await checkAuth();


  if(ok){

    await loadDocuments();

  }

})();

</script>

</body>
</html>
