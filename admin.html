<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard | Maa Basuli Uda Jatra Committee</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #7b1e00, #a63d00);
      color: white;
      padding: 22px 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .brand p {
      font-size: 14px;
      opacity: 0.9;
    }

    .logout-btn {
      background: white;
      color: #7b1e00;
      border: none;
      padding: 11px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .logout-btn:hover {
      background: #ffe9dd;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .welcome {
      background: white;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
      border-left: 5px solid #a63d00;
    }

    .welcome h2 {
      color: #7b1e00;
      margin-bottom: 8px;
      font-size: 25px;
    }

    .welcome p {
      color: #666;
      line-height: 1.6;
    }

    .role-badge {
      display: inline-block;
      margin-top: 12px;
      padding: 7px 13px;
      border-radius: 20px;
      background: #fff1e8;
      color: #8a2d00;
      font-size: 13px;
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .stat-number {
      font-size: 30px;
      font-weight: bold;
      color: #7b1e00;
      margin-bottom: 5px;
    }

    .stat-label {
      color: #666;
      font-size: 14px;
    }

    .section-title {
      font-size: 24px;
      color: #7b1e00;
      margin-bottom: 18px;
    }

    .management-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .management-card {
      background: white;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
      transition: 0.2s;
    }

    .management-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 22px rgba(0,0,0,0.10);
    }

    .management-card h3 {
      color: #7b1e00;
      margin-bottom: 12px;
      font-size: 20px;
    }

    .management-card p {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      min-height: 68px;
      margin-bottom: 18px;
    }

    .manage-btn {
      display: inline-block;
      text-decoration: none;
      border: none;
      background: #7b1e00;
      color: white;
      padding: 11px 17px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .manage-btn:hover {
      background: #a63d00;
    }

    .disabled-btn {
      background: #9da3aa;
      cursor: not-allowed;
    }

    .disabled-btn:hover {
      background: #9da3aa;
    }

    .super-admin-note {
      background: #fff8ed;
      border: 1px solid #f1d2a3;
      color: #754c16;
      padding: 12px 15px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 13px;
    }

    footer {
      margin-top: 45px;
      background: #21120d;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    footer p {
      margin: 5px 0;
      font-size: 13px;
      opacity: 0.85;
    }

    .loading {
      text-align: center;
      padding: 50px;
      color: #777;
      font-size: 16px;
    }

    .error-box {
      max-width: 700px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.10);
      text-align: center;
    }

    .error-box h2 {
      color: #b00020;
      margin-bottom: 10px;
    }

    .error-box p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    @media (max-width: 900px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .management-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .management-grid {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 0 14px;
      }

      .brand h1 {
        font-size: 20px;
      }

      .welcome h2 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <div id="app">

    <div class="loading">
      Checking Admin Access...
    </div>

  </div>


  <script>

    /* =========================================================
       SUPABASE CONFIG
    ========================================================= */

    const SUPABASE_URL =
      "https://ynymqntcawobcfccoekb.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_VyaVcI_yPlsg0aTfd5ZpUQ_t--2_Nov";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================================
       GLOBAL
    ========================================================= */

    let currentUser = null;
    let currentRole = null;


    /* =========================================================
       HTML ESCAPE
    ========================================================= */

    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =========================================================
       INITIALIZE
    ========================================================= */

    async function initializeAdmin() {

      try {

        const {
          data: {
            session
          },
          error: sessionError
        } = await supabaseClient.auth.getSession();


        if (sessionError) {
          throw sessionError;
        }


        if (!session || !session.user) {

          window.location.href = "auth.html";
          return;
        }


        currentUser = session.user;


        /* ---------------------------------------------
           GET ROLE
        --------------------------------------------- */

        const {
          data: roleData,
          error: roleError
        } = await supabaseClient
          .from("user_roles")
          .select("role")
          .eq("user_id", currentUser.id)
          .maybeSingle();


        if (roleError) {
          throw roleError;
        }


        currentRole = roleData?.role || "member";


        /* ---------------------------------------------
           MEMBER
        --------------------------------------------- */

        if (currentRole === "member") {

          window.location.href = "profile.html";
          return;
        }


        /* ---------------------------------------------
           SUPER ADMIN
        --------------------------------------------- */

        if (currentRole === "super_admin") {

          window.location.href = "super-admin.html";
          return;
        }


        /* ---------------------------------------------
           ADMIN
        --------------------------------------------- */

        if (currentRole !== "admin") {

          await supabaseClient.auth.signOut();

          showError(
            "Access Denied",
            "Apana nka account ku Admin Dashboard access nahin."
          );

          return;
        }


        /* ---------------------------------------------
           LOAD DASHBOARD
        --------------------------------------------- */

        await renderDashboard();

      } catch (error) {

        console.error(error);

        showError(
          "Dashboard Error",
          error.message || "Dashboard load heiparilani."
        );
      }
    }


    /* =========================================================
       RENDER DASHBOARD
    ========================================================= */

    async function renderDashboard() {

      const userEmail =
        currentUser?.email || "Admin";


      document.getElementById("app").innerHTML = `

        <header>

          <div class="header-inner">

            <div class="brand">

              <h1>
                Maa Basuli Uda Jatra Committee
              </h1>

              <p>
                Thakurmunda, Mayurbhanj, Odisha
              </p>

            </div>

            <button
              class="logout-btn"
              onclick="logoutAdmin()"
            >
              Logout
            </button>

          </div>

        </header>


        <main class="container">


          <!-- WELCOME -->

          <section class="welcome">

            <h2>
              Welcome, Admin
            </h2>

            <p>
              Committee administration panel.
              Etharu website ra Notices, Events ebam Gallery management kariparibe.
            </p>

            <div class="role-badge">
              ADMIN
            </div>

            <div style="
              margin-top:10px;
              font-size:13px;
              color:#777;
            ">
              Login: ${escapeHtml(userEmail)}
            </div>

          </section>


          <!-- STATS -->

          <section class="stats">

            <div class="stat-card">

              <div
                class="stat-number"
                id="noticeCount"
              >
                0
              </div>

              <div class="stat-label">
                Published Notices
              </div>

            </div>


            <div class="stat-card">

              <div
                class="stat-number"
                id="eventCount"
              >
                0
              </div>

              <div class="stat-label">
                Published Events
              </div>

            </div>


            <div class="stat-card">

              <div
                class="stat-number"
                id="galleryCount"
              >
                0
              </div>

              <div class="stat-label">
                Gallery Albums
              </div>

            </div>


            <div class="stat-card">

              <div
                class="stat-number"
                id="complaintCount"
              >
                0
              </div>

              <div class="stat-label">
                Complaints
              </div>

            </div>

          </section>


          <!-- MANAGEMENT -->

          <section>

            <h2 class="section-title">
              Management
            </h2>


            <div class="management-grid">


              <!-- NOTICES -->

              <div class="management-card">

                <h3>
                  📢 Notices
                </h3>

                <p>
                  Official notices create, edit,
                  publish, unpublish and delete karantu.
                </p>

                <a
                  href="notice-manager.html"
                  class="manage-btn"
                >
                  Manage Notices
                </a>

              </div>


              <!-- EVENTS -->

              <div class="management-card">

                <h3>
                  🗓️ Events & Programmes
                </h3>

                <p>
                  Jatra, cultural programme,
                  meeting ebam committee events manage karantu.
                </p>

                <a
                  href="event-manager.html"
                  class="manage-btn"
                >
                  Manage Events
                </a>

              </div>


              <!-- GALLERY -->

              <div class="management-card">

                <h3>
                  🖼️ Gallery
                </h3>

                <p>
                  Jatra, temple, cultural programme
                  ebam committee photos manage karantu.
                </p>

                <a
                  href="gallery-manager.html"
                  class="manage-btn"
                >
                  Manage Gallery
                </a>

              </div>


              <!-- COMPLAINTS -->

              <div class="management-card">

                <h3>
                  📝 Complaints
                </h3>

                <p>
                  Public complaint submissions check
                  ebam manage karantu.
                </p>

                <button
                  class="manage-btn"
                  onclick="comingSoon('Complaint Management')"
                >
                  Manage Complaints
                </button>

              </div>


              <!-- MEMBERS -->

              <div class="management-card">

                <h3>
                  👥 Members
                </h3>

                <p>
                  Member approval, designation,
                  active/inactive status Super Admin manage karibe.
                </p>

                <button
                  class="manage-btn disabled-btn"
                  onclick="superAdminOnly()"
                >
                  Super Admin Only
                </button>

                <div class="super-admin-note">
                  Member management pain Super Admin Dashboard use karantu.
                </div>

              </div>


              <!-- FUND -->

              <div class="management-card">

                <h3>
                  💰 Fund & Finance
                </h3>

                <p>
                  Fund collection, expenses, savings
                  ebam donation management.
                </p>

                <button
                  class="manage-btn disabled-btn"
                  onclick="superAdminOnly()"
                >
                  Super Admin Only
                </button>

                <div class="super-admin-note">
                  Fund & Finance management pain Super Admin access required.
                </div>

              </div>


            </div>

          </section>


        </main>


        <footer>

          <p>
            © ${new Date().getFullYear()}
            Maa Basuli Uda Jatra Committee, Thakurmunda
          </p>

          <p>
            Official Committee Administration System
          </p>

        </footer>

      `;


      /* ---------------------------------------------
         LOAD STATISTICS
      --------------------------------------------- */

      await loadDashboardStats();

    }


    /* =========================================================
       LOAD DASHBOARD STATS
    ========================================================= */

    async function loadDashboardStats() {

      /* ---------------------------------------------
         NOTICE COUNT
      --------------------------------------------- */

      try {

        const {
          count,
          error
        } = await supabaseClient
          .from("notices")
          .select("*", {
            count: "exact",
            head: true
          })
          .eq("is_published", true);


        if (!error) {

          document.getElementById("noticeCount").textContent =
            count || 0;

        }

      } catch (error) {

        console.error("Notice count error:", error);

      }


      /* ---------------------------------------------
         EVENT COUNT
      --------------------------------------------- */

      try {

        const {
          count,
          error
        } = await supabaseClient
          .from("events")
          .select("*", {
            count: "exact",
            head: true
          })
          .eq("is_published", true);


        if (!error) {

          document.getElementById("eventCount").textContent =
            count || 0;

        }

      } catch (error) {

        console.error("Event count error:", error);

      }


      /* ---------------------------------------------
         GALLERY ALBUM COUNT
      --------------------------------------------- */

      try {

        const {
          count,
          error
        } = await supabaseClient
          .from("gallery_albums")
          .select("*", {
            count: "exact",
            head: true
          })
          .eq("is_published", true);


        if (!error) {

          document.getElementById("galleryCount").textContent =
            count || 0;

        }

      } catch (error) {

        console.error("Gallery count error:", error);

      }


      /* ---------------------------------------------
         COMPLAINT COUNT
         Currently 0 until complaint table is created.
      --------------------------------------------- */

      document.getElementById("complaintCount").textContent = "0";

    }


    /* =========================================================
       SUPER ADMIN ONLY
    ========================================================= */

    function superAdminOnly() {

      alert(
        "Members ebam Fund & Finance management kebala Super Admin manage kariparibe."
      );

    }


    /* =========================================================
       COMING SOON
    ========================================================= */

    function comingSoon(sectionName) {

      alert(
        sectionName +
        " system next step re connect heba."
      );

    }


    /* =========================================================
       LOGOUT
    ========================================================= */

    async function logoutAdmin() {

      try {

        const {
          error
        } = await supabaseClient.auth.signOut();


        if (error) {
          throw error;
        }


        window.location.href = "auth.html";

      } catch (error) {

        console.error(error);

        alert(
          "Logout failed: " +
          (error.message || "Unknown error")
        );

      }

    }


    /* =========================================================
       ERROR SCREEN
    ========================================================= */

    function showError(title, message) {

      document.getElementById("app").innerHTML = `

        <div class="error-box">

          <h2>
            ${escapeHtml(title)}
          </h2>

          <p>
            ${escapeHtml(message)}
          </p>

          <a
            href="auth.html"
            class="manage-btn"
          >
            Go to Login
          </a>

        </div>

      `;

    }


    /* =========================================================
       SESSION LISTENER
    ========================================================= */

    supabaseClient.auth.onAuthStateChange(
      (event, session) => {

        if (event === "SIGNED_OUT") {

          window.location.href = "auth.html";

        }

      }
    );


    /* =========================================================
       START
    ========================================================= */

    initializeAdmin();

  </script>

</body>
</html>
