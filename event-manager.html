<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Manager | Maa Basuli Uda Jatra Committee</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#f4f6fa;
      color:#222;
    }

    header{
      background:linear-gradient(135deg,#8b2d0b,#c65b08);
      color:#fff;
      padding:28px 6%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      flex-wrap:wrap;
    }

    header h1{
      margin:0 0 6px;
      font-size:28px;
    }

    header p{
      margin:0;
      opacity:.9;
    }

    .header-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    button,
    .btn{
      border:0;
      border-radius:8px;
      padding:11px 17px;
      font-weight:700;
      cursor:pointer;
      text-decoration:none;
      display:inline-block;
    }

    .btn-primary{
      background:#9b370e;
      color:white;
    }

    .btn-light{
      background:white;
      color:#7c2d0a;
    }

    .btn-danger{
      background:#dc2626;
      color:white;
    }

    .btn-success{
      background:#15803d;
      color:white;
    }

    .btn-gray{
      background:#64748b;
      color:white;
    }

    main{
      width:92%;
      max-width:1250px;
      margin:35px auto;
    }

    .message{
      display:none;
      padding:14px 18px;
      border-radius:9px;
      margin-bottom:20px;
      font-weight:600;
    }

    .message.error{
      display:block;
      background:#fee2e2;
      color:#991b1b;
    }

    .message.success{
      display:block;
      background:#dcfce7;
      color:#166534;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      margin-bottom:22px;
      flex-wrap:wrap;
    }

    .topbar h2{
      margin:0;
      color:#8b2d0b;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
      margin-bottom:25px;
    }

    .stat{
      background:white;
      border-radius:14px;
      padding:22px;
      box-shadow:0 4px 18px rgba(0,0,0,.06);
    }

    .stat strong{
      display:block;
      font-size:30px;
      color:#9b370e;
      margin-bottom:6px;
    }

    .filters{
      background:white;
      padding:18px;
      border-radius:14px;
      display:grid;
      grid-template-columns:1fr 220px 220px;
      gap:12px;
      margin-bottom:22px;
      box-shadow:0 4px 18px rgba(0,0,0,.06);
    }

    input,
    select,
    textarea{
      width:100%;
      padding:12px 13px;
      border:1px solid #d5d9df;
      border-radius:8px;
      font-size:15px;
      background:#fff;
    }

    textarea{
      min-height:120px;
      resize:vertical;
    }

    .events{
      display:grid;
      gap:16px;
    }

    .event-card{
      background:white;
      border-radius:14px;
      padding:20px;
      box-shadow:0 4px 18px rgba(0,0,0,.06);
    }

    .event-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:15px;
      flex-wrap:wrap;
    }

    .event-title{
      margin:0 0 8px;
      color:#8b2d0b;
      font-size:21px;
    }

    .badge{
      display:inline-block;
      padding:5px 9px;
      border-radius:20px;
      font-size:12px;
      font-weight:700;
      margin-right:6px;
    }

    .badge-type{
      background:#ffedd5;
      color:#9a3412;
    }

    .badge-published{
      background:#dcfce7;
      color:#166534;
    }

    .badge-unpublished{
      background:#fee2e2;
      color:#991b1b;
    }

    .event-info{
      color:#555;
      line-height:1.7;
      margin-top:10px;
    }

    .event-description{
      margin-top:12px;
      color:#444;
      line-height:1.6;
      white-space:pre-wrap;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:16px;
    }

    .empty{
      background:white;
      padding:45px;
      border-radius:14px;
      text-align:center;
      color:#666;
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.6);
      z-index:9999;
      padding:20px;
      overflow:auto;
    }

    .modal-box{
      background:white;
      max-width:700px;
      margin:30px auto;
      border-radius:15px;
      padding:25px;
    }

    .modal-box h2{
      margin-top:0;
      color:#8b2d0b;
    }

    .form-group{
      margin-bottom:15px;
    }

    .form-group label{
      display:block;
      margin-bottom:7px;
      font-weight:700;
    }

    .modal-actions{
      display:flex;
      justify-content:flex-end;
      gap:10px;
      margin-top:20px;
      flex-wrap:wrap;
    }

    .loading{
      background:white;
      padding:40px;
      text-align:center;
      border-radius:14px;
      color:#666;
    }

    @media(max-width:800px){
      .stats{
        grid-template-columns:1fr;
      }

      .filters{
        grid-template-columns:1fr;
      }

      header{
        padding:22px 5%;
      }

      header h1{
        font-size:23px;
      }

      main{
        width:94%;
      }
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>Event Manager</h1>
    <p>Maa Basuli Uda Jatra Committee</p>
  </div>

  <div class="header-actions">
    <a class="btn btn-light" href="#" onclick="goBackDashboard(); return false;">← Back to Dashboard</a>
    <button class="btn btn-light" onclick="logout()">Logout</button>
  </div>
</header>

<main>

  <div id="message" class="message"></div>

  <div class="topbar">
    <h2>Manage Events & Programmes</h2>
    <button class="btn btn-primary" onclick="openAddModal()">+ Add New Event</button>
  </div>

  <section class="stats">
    <div class="stat">
      <strong id="totalCount">0</strong>
      Total Events
    </div>

    <div class="stat">
      <strong id="publishedCount">0</strong>
      Published
    </div>

    <div class="stat">
      <strong id="unpublishedCount">0</strong>
      Unpublished
    </div>
  </section>

  <section class="filters">
    <input
      id="searchInput"
      type="text"
      placeholder="Search event..."
      oninput="renderEvents()"
    >

    <select id="typeFilter" onchange="renderEvents()">
      <option value="">All Types</option>
      <option value="Jatra">Jatra</option>
      <option value="Programme">Programme</option>
      <option value="Cultural">Cultural</option>
      <option value="Meeting">Meeting</option>
      <option value="Committee">Committee</option>
      <option value="Other">Other</option>
    </select>

    <select id="statusFilter" onchange="renderEvents()">
      <option value="">All Status</option>
      <option value="published">Published</option>
      <option value="unpublished">Unpublished</option>
    </select>
  </section>

  <section id="eventsList" class="events">
    <div class="loading">Loading events...</div>
  </section>

</main>

<!-- ADD / EDIT MODAL -->
<div id="eventModal" class="modal">
  <div class="modal-box">

    <h2 id="modalTitle">Add New Event</h2>

    <form id="eventForm">

      <div class="form-group">
        <label>Event / Programme Title *</label>
        <input id="title" required>
      </div>

      <div class="form-group">
        <label>Event Date *</label>
        <input id="eventDate" type="date" required>
      </div>

      <div class="form-group">
        <label>Event Type *</label>
        <select id="eventType" required>
          <option value="Jatra">Jatra</option>
          <option value="Programme">Programme</option>
          <option value="Cultural">Cultural</option>
          <option value="Meeting">Meeting</option>
          <option value="Committee">Committee</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Location</label>
        <input id="location" placeholder="Example: Maa Basuli Temple Ground">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="description" placeholder="Event details..."></textarea>
      </div>

      <div class="form-group">
        <label>
          <input
            id="isPublished"
            type="checkbox"
            checked
            style="width:auto;margin-right:7px;"
          >
          Publish this event on public website
        </label>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-gray" onclick="closeModal()">
          Cancel
        </button>

        <button type="submit" class="btn btn-primary">
          Save Event
        </button>
      </div>

    </form>

  </div>
</div>

<script>
/* =========================================================
   SUPABASE CONFIG
   IMPORTANT:
   Use the SAME publishable key that is working in auth.html.
   ========================================================= */

const SUPABASE_URL = "https://ynymqntcawobcfccoekb.supabase.co";

const SUPABASE_KEY = "sb_publishable_VyaVcI_yPlsg0aTfd5ZpUQ_t--2_Nov";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let events = [];
let editingId = null;


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text, type = "error"){
  const box = document.getElementById("message");
  box.textContent = text;
  box.className = "message " + type;

  setTimeout(() => {
    box.className = "message";
  }, 5000);
}


/* =========================================================
   AUTH + ROLE CHECK
   ========================================================= */

async function checkAdmin(){

  try{

    const {
      data: { session },
      error: sessionError
    } = await supabaseClient.auth.getSession();

    if(sessionError){
      throw sessionError;
    }

    if(!session){
      window.location.href = "auth.html";
      return;
    }

    currentUser = session.user;

    const { data: roleData, error: roleError } =
      await supabaseClient
        .from("user_roles")
        .select("role")
        .eq("user_id", currentUser.id)
        .maybeSingle();

    if(roleError){
      throw roleError;
    }

    if(!roleData){
      throw new Error("User role not found.");
    }

    if(
      roleData.role !== "admin" &&
      roleData.role !== "super_admin"
    ){
      window.location.href = "profile.html";
      return;
    }

    await loadEvents();

  }catch(error){

    console.error("Role check error:", error);

    document.getElementById("message").className =
      "message error";

    document.getElementById("message").innerHTML =
      "<strong>Role check failed</strong><br>" +
      escapeHtml(error.message || "Unknown error");

  }
}


/* =========================================================
   LOAD EVENTS
   ========================================================= */

async function loadEvents(){

  document.getElementById("eventsList").innerHTML =
    '<div class="loading">Loading events...</div>';

  const { data, error } = await supabaseClient
    .from("events")
    .select("*")
    .order("event_date", { ascending:false });

  if(error){
    console.error(error);
    throw error;
  }

  events = data || [];

  updateStats();
  renderEvents();
}


/* =========================================================
   STATS
   ========================================================= */

function updateStats(){

  const total = events.length;

  const published =
    events.filter(e => e.is_published === true).length;

  const unpublished =
    events.filter(e => e.is_published === false).length;

  document.getElementById("totalCount").textContent = total;
  document.getElementById("publishedCount").textContent = published;
  document.getElementById("unpublishedCount").textContent = unpublished;
}


/* =========================================================
   RENDER
   ========================================================= */

function renderEvents(){

  const list = document.getElementById("eventsList");

  const search =
    document.getElementById("searchInput").value
      .trim()
      .toLowerCase();

  const type =
    document.getElementById("typeFilter").value;

  const status =
    document.getElementById("statusFilter").value;

  const filtered = events.filter(event => {

    const searchable =
      [
        event.title,
        event.description,
        event.location,
        event.event_type
      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

    const searchMatch =
      !search || searchable.includes(search);

    const typeMatch =
      !type || event.event_type === type;

    const statusMatch =
      !status ||
      (
        status === "published"
        && event.is_published === true
      ) ||
      (
        status === "unpublished"
        && event.is_published === false
      );

    return searchMatch && typeMatch && statusMatch;
  });

  if(filtered.length === 0){

    list.innerHTML = `
      <div class="empty">
        <h3>No events found</h3>
        <p>Add a new event using the button above.</p>
      </div>
    `;

    return;
  }

  list.innerHTML = filtered.map(event => {

    const date =
      event.event_date
        ? new Date(event.event_date + "T00:00:00")
            .toLocaleDateString("en-IN",{
              day:"2-digit",
              month:"long",
              year:"numeric"
            })
        : "-";

    return `
      <div class="event-card">

        <div class="event-head">

          <div>
            <h3 class="event-title">
              ${escapeHtml(event.title)}
            </h3>

            <span class="badge badge-type">
              ${escapeHtml(event.event_type || "Other")}
            </span>

            ${
              event.is_published
              ? `<span class="badge badge-published">Published</span>`
              : `<span class="badge badge-unpublished">Unpublished</span>`
            }
          </div>

        </div>

        <div class="event-info">
          📅 <strong>Date:</strong> ${date}
          ${
            event.location
            ? `<br>📍 <strong>Location:</strong> ${escapeHtml(event.location)}`
            : ""
          }
        </div>

        ${
          event.description
          ? `<div class="event-description">
              ${escapeHtml(event.description)}
             </div>`
          : ""
        }

        <div class="actions">

          <button
            class="btn btn-primary"
            onclick="editEvent('${event.id}')">
            Edit
          </button>

          <button
            class="btn ${
              event.is_published
              ? "btn-gray"
              : "btn-success"
            }"
            onclick="togglePublish('${event.id}', ${event.is_published})">
            ${
              event.is_published
              ? "Unpublish"
              : "Publish"
            }
          </button>

          <button
            class="btn btn-danger"
            onclick="deleteEvent('${event.id}')">
            Delete
          </button>

        </div>

      </div>
    `;

  }).join("");
}


/* =========================================================
   ADD MODAL
   ========================================================= */

function openAddModal(){

  editingId = null;

  document.getElementById("modalTitle").textContent =
    "Add New Event";

  document.getElementById("eventForm").reset();

  document.getElementById("isPublished").checked = true;

  document.getElementById("eventModal").style.display = "block";
}


/* =========================================================
   EDIT
   ========================================================= */

function editEvent(id){

  const event = events.find(e => e.id === id);

  if(!event) return;

  editingId = id;

  document.getElementById("modalTitle").textContent =
    "Edit Event";

  document.getElementById("title").value =
    event.title || "";

  document.getElementById("eventDate").value =
    event.event_date || "";

  document.getElementById("eventType").value =
    event.event_type || "Other";

  document.getElementById("location").value =
    event.location || "";

  document.getElementById("description").value =
    event.description || "";

  document.getElementById("isPublished").checked =
    event.is_published === true;

  document.getElementById("eventModal").style.display =
    "block";
}


/* =========================================================
   CLOSE MODAL
   ========================================================= */

function closeModal(){
  document.getElementById("eventModal").style.display =
    "none";
}


/* =========================================================
   SAVE EVENT
   ========================================================= */

document.getElementById("eventForm").addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    const payload = {

      title:
        document.getElementById("title").value.trim(),

      event_date:
        document.getElementById("eventDate").value,

      event_type:
        document.getElementById("eventType").value,

      location:
        document.getElementById("location").value.trim() || null,

      description:
        document.getElementById("description").value.trim() || null,

      is_published:
        document.getElementById("isPublished").checked

    };

    try{

      if(editingId){

        const { error } =
          await supabaseClient
            .from("events")
            .update(payload)
            .eq("id", editingId);

        if(error) throw error;

        showMessage(
          "Event successfully updated.",
          "success"
        );

      }else{

        payload.created_by = currentUser.id;

        const { error } =
          await supabaseClient
            .from("events")
            .insert(payload);

        if(error) throw error;

        showMessage(
          "New event successfully added.",
          "success"
        );
      }

      closeModal();

      await loadEvents();

    }catch(error){

      console.error(error);

      showMessage(
        error.message || "Unable to save event."
      );
    }

  }
);


/* =========================================================
   PUBLISH / UNPUBLISH
   ========================================================= */

async function togglePublish(id, currentStatus){

  try{

    const { error } =
      await supabaseClient
        .from("events")
        .update({
          is_published: !currentStatus
        })
        .eq("id", id);

    if(error) throw error;

    showMessage(
      currentStatus
        ? "Event unpublished."
        : "Event published.",
      "success"
    );

    await loadEvents();

  }catch(error){

    console.error(error);

    showMessage(
      error.message || "Unable to change event status."
    );
  }
}


/* =========================================================
   DELETE
   ========================================================= */

async function deleteEvent(id){

  const event =
    events.find(e => e.id === id);

  if(!event) return;

  const yes =
    confirm(
      "Delete this event?\n\n" +
      event.title
    );

  if(!yes) return;

  try{

    const { error } =
      await supabaseClient
        .from("events")
        .delete()
        .eq("id", id);

    if(error) throw error;

    showMessage(
      "Event deleted successfully.",
      "success"
    );

    await loadEvents();

  }catch(error){

    console.error(error);

    showMessage(
      error.message || "Unable to delete event."
    );
  }
}


/* =========================================================
   BACK TO DASHBOARD
   ========================================================= */

async function goBackDashboard(){

  const {
    data:{ session }
  } = await supabaseClient.auth.getSession();

  if(!session){
    window.location.href = "auth.html";
    return;
  }

  const {
    data:roleData,
    error
  } = await supabaseClient
    .from("user_roles")
    .select("role")
    .eq("user_id", session.user.id)
    .maybeSingle();

  if(error || !roleData){
    window.location.href = "auth.html";
    return;
  }

  if(roleData.role === "super_admin"){
    window.location.href = "super-admin.html";
    return;
  }

  if(roleData.role === "admin"){
    window.location.href = "admin.html";
    return;
  }

  window.location.href = "profile.html";
}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout(){

  await supabaseClient.auth.signOut();

  window.location.href = "auth.html";
}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   MODAL OUTSIDE CLICK
   ========================================================= */

window.addEventListener("click", function(e){

  const modal =
    document.getElementById("eventModal");

  if(e.target === modal){
    closeModal();
  }

});


/* =========================================================
   START
   ========================================================= */

checkAdmin();

</script>

</body>
</html>
