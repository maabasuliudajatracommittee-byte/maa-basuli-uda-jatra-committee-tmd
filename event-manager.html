<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Event Manager | Maa Basuli Uda Jatra Committee</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6fb;
      color: #222;
    }

    header {
      background: linear-gradient(90deg, #8f2f0d, #c85a08);
      color: white;
      padding: 26px 20px;
    }

    .header-inner {
      max-width: 1250px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
    }

    .brand p {
      margin: 5px 0 0;
      opacity: .9;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button,
    .btn {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-light {
      background: white;
      color: #8f2f0d;
    }

    .btn-primary {
      background: #a83c0b;
      color: white;
    }

    .btn-success {
      background: #198754;
      color: white;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
    }

    main {
      max-width: 1250px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .message {
      display: none;
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .message.error {
      display: block;
      background: #ffe1e1;
      color: #a40000;
    }

    .message.success {
      display: block;
      background: #dff7e7;
      color: #126b35;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .top-row h2 {
      margin: 0;
      color: #8f2f0d;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 5px 18px rgba(0,0,0,.07);
    }

    .stat-number {
      font-size: 32px;
      font-weight: 700;
      color: #9d3a0c;
    }

    .stat-label {
      color: #637083;
      margin-top: 5px;
    }

    .filters {
      background: white;
      padding: 18px;
      border-radius: 14px;
      display: grid;
      grid-template-columns: 1fr 220px 220px;
      gap: 12px;
      margin-bottom: 25px;
      box-shadow: 0 5px 18px rgba(0,0,0,.06);
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #d7dce4;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #b34b12;
    }

    .events-container {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,.06);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 13px 12px;
      border-bottom: 1px solid #eceff3;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #fff5eb;
      color: #8f2f0d;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge-published {
      background: #dff7e7;
      color: #126b35;
    }

    .badge-unpublished {
      background: #ffe3e3;
      color: #a00000;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .actions button {
      padding: 7px 10px;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #687386;
    }

    .loading {
      text-align: center;
      padding: 50px 20px;
      color: #687386;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .modal h3 {
      margin-top: 0;
      color: #8f2f0d;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .required {
      color: red;
    }

    @media(max-width: 800px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">
      <h1>Event Manager</h1>
      <p>Maa Basuli Uda Jatra Committee</p>
    </div>

    <div class="header-buttons">
      <button class="btn-light" onclick="goDashboard()">
        ← Back to Dashboard
      </button>

      <button class="btn-light" onclick="logout()">
        Logout
      </button>
    </div>

  </div>
</header>

<main>

  <div id="message" class="message"></div>

  <div class="top-row">
    <h2>Manage Events & Programmes</h2>

    <button class="btn-primary" onclick="openAddModal()">
      + Add New Event
    </button>
  </div>

  <section class="stats">

    <div class="stat-card">
      <div class="stat-number" id="totalEvents">0</div>
      <div class="stat-label">Total Events</div>
    </div>

    <div class="stat-card">
      <div class="stat-number" id="publishedEvents">0</div>
      <div class="stat-label">Published</div>
    </div>

    <div class="stat-card">
      <div class="stat-number" id="unpublishedEvents">0</div>
      <div class="stat-label">Unpublished</div>
    </div>

  </section>

  <section class="filters">

    <input
      type="text"
      id="searchInput"
      placeholder="Search event..."
      oninput="renderEvents()"
    >

    <select id="typeFilter" onchange="renderEvents()">
      <option value="">All Types</option>
      <option value="Jatra">Jatra</option>
      <option value="Programme">Programme</option>
      <option value="Cultural">Cultural</option>
      <option value="Meeting">Meeting</option>
      <option value="Committee">Committee</option>
      <option value="Other">Other</option>
    </select>

    <select id="statusFilter" onchange="renderEvents()">
      <option value="">All Status</option>
      <option value="published">Published</option>
      <option value="unpublished">Unpublished</option>
    </select>

  </section>

  <section class="events-container">

    <div id="loading" class="loading">
      Loading events...
    </div>

    <div id="empty" class="empty" style="display:none;">
      No events found.
    </div>

    <div id="tableWrapper" style="display:none;">

      <table>

        <thead>
          <tr>
            <th>Title</th>
            <th>Date</th>
            <th>Type</th>
            <th>Location</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="eventsTableBody"></tbody>

      </table>

    </div>

  </section>

</main>


<!-- ADD / EDIT MODAL -->

<div class="modal-overlay" id="eventModal">

  <div class="modal">

    <h3 id="modalTitle">Add New Event</h3>

    <input type="hidden" id="eventId">

    <div class="form-group">
      <label>
        Event / Programme Title
        <span class="required">*</span>
      </label>

      <input
        type="text"
        id="eventTitle"
        placeholder="Example: Maa Basuli Uda Jatra"
      >
    </div>


    <div class="form-group">
      <label>
        Event Date
        <span class="required">*</span>
      </label>

      <input
        type="date"
        id="eventDate"
      >
    </div>


    <div class="form-group">
      <label>
        Event Type
        <span class="required">*</span>
      </label>

      <select id="eventType">

        <option value="Jatra">Jatra</option>
        <option value="Programme">Programme</option>
        <option value="Cultural">Cultural</option>
        <option value="Meeting">Meeting</option>
        <option value="Committee">Committee</option>
        <option value="Other">Other</option>

      </select>
    </div>


    <div class="form-group">
      <label>Location</label>

      <input
        type="text"
        id="eventLocation"
        placeholder="Example: Thakurmunda"
      >
    </div>


    <div class="form-group">
      <label>Description</label>

      <textarea
        id="eventDescription"
        placeholder="Event details..."
      ></textarea>

    </div>


    <div class="form-group">

      <label>
        <input
          type="checkbox"
          id="eventPublished"
          checked
          style="width:auto;margin-right:7px;"
        >

        Publish on public website
      </label>

    </div>


    <div class="form-actions">

      <button
        class="btn-secondary"
        onclick="closeModal()"
      >
        Cancel
      </button>

      <button
        class="btn-primary"
        onclick="saveEvent()"
        id="saveButton"
      >
        Save Event
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
  "https://ynymqntcawobcfccoekb.supabase.co";

/*
 IMPORTANT:
 Use the SAME working Publishable Key used in auth.html.

 This is the exact key:
*/
const SUPABASE_KEY =
  "sb_publishable_VyaVcI_yPlsg0aTfd5ZpUq_t--2_Nov";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;
let allEvents = [];


/* =========================================================
   PAGE START
   ========================================================= */

document.addEventListener("DOMContentLoaded", async () => {

  await checkAdminAccess();

});


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text, type = "error") {

  const box = document.getElementById("message");

  box.className = "message " + type;
  box.textContent = text;
  box.style.display = "block";

}


function hideMessage() {

  const box = document.getElementById("message");

  box.style.display = "none";

}


/* =========================================================
   CHECK ADMIN ACCESS
   ========================================================= */

async function checkAdminAccess() {

  hideMessage();

  try {

    const {
      data: sessionData,
      error: sessionError
    } = await supabaseClient.auth.getSession();

    if (sessionError) {
      throw sessionError;
    }

    const session = sessionData.session;

    if (!session) {

      window.location.href = "auth.html";

      return;
    }

    currentUser = session.user;


    const {
      data: roleData,
      error: roleError
    } = await supabaseClient
      .from("user_roles")
      .select("role")
      .eq("user_id", currentUser.id)
      .maybeSingle();


    if (roleError) {
      throw roleError;
    }


    if (
      !roleData ||
      !["admin", "super_admin"].includes(roleData.role)
    ) {

      showMessage(
        "Access denied. Only Admin or Super Admin can manage events."
      );

      setTimeout(() => {
        window.location.href = "profile.html";
      }, 2500);

      return;
    }


    await loadEvents();

  } catch (error) {

    console.error("Role check error:", error);

    showMessage(
      "Role check failed: " +
      (error.message || "Unknown error")
    );

  }

}


/* =========================================================
   LOAD EVENTS
   ========================================================= */

async function loadEvents() {

  document.getElementById("loading").style.display = "block";
  document.getElementById("tableWrapper").style.display = "none";
  document.getElementById("empty").style.display = "none";

  try {

    const {
      data,
      error
    } = await supabaseClient
      .from("events")
      .select("*")
      .order("event_date", { ascending: false });


    if (error) {
      throw error;
    }


    allEvents = data || [];

    updateStats();

    renderEvents();

  } catch (error) {

    console.error("Load events error:", error);

    showMessage(
      "Events load karibare problem hela: " +
      (error.message || "Unknown error")
    );

  } finally {

    document.getElementById("loading").style.display = "none";

  }

}


/* =========================================================
   UPDATE STATS
   ========================================================= */

function updateStats() {

  const total = allEvents.length;

  const published =
    allEvents.filter(e => e.is_published === true).length;

  const unpublished =
    allEvents.filter(e => e.is_published === false).length;


  document.getElementById("totalEvents").textContent = total;

  document.getElementById("publishedEvents").textContent =
    published;

  document.getElementById("unpublishedEvents").textContent =
    unpublished;

}


/* =========================================================
   RENDER EVENTS
   ========================================================= */

function renderEvents() {

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  const type =
    document.getElementById("typeFilter").value;


  const status =
    document.getElementById("statusFilter").value;


  let filtered = allEvents.filter(event => {

    const searchable =
      [
        event.title,
        event.description,
        event.location,
        event.event_type
      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();


    const searchMatch =
      !search || searchable.includes(search);


    const typeMatch =
      !type || event.event_type === type;


    const statusMatch =
      !status ||
      (
        status === "published" &&
        event.is_published === true
      ) ||
      (
        status === "unpublished" &&
        event.is_published === false
      );


    return searchMatch &&
           typeMatch &&
           statusMatch;

  });


  const tbody =
    document.getElementById("eventsTableBody");


  tbody.innerHTML = "";


  if (filtered.length === 0) {

    document.getElementById("tableWrapper").style.display =
      "none";

    document.getElementById("empty").style.display =
      "block";

    return;
  }


  document.getElementById("tableWrapper").style.display =
    "block";

  document.getElementById("empty").style.display =
    "none";


  filtered.forEach(event => {

    const tr = document.createElement("tr");


    const title = escapeHtml(
      event.title || ""
    );

    const date = event.event_date
      ? formatDate(event.event_date)
      : "-";

    const type = escapeHtml(
      event.event_type || "Other"
    );

    const location = escapeHtml(
      event.location || "-"
    );


    const statusBadge =
      event.is_published
        ? `<span class="badge badge-published">Published</span>`
        : `<span class="badge badge-unpublished">Unpublished</span>`;


    const publishButton =
      event.is_published
        ? `<button class="btn-secondary"
             onclick="togglePublish('${event.id}', false)">
             Unpublish
           </button>`
        : `<button class="btn-success"
             onclick="togglePublish('${event.id}', true)">
             Publish
           </button>`;


    tr.innerHTML = `

      <td>
        <strong>${title}</strong>
      </td>

      <td>${date}</td>

      <td>${type}</td>

      <td>${location}</td>

      <td>${statusBadge}</td>

      <td>

        <div class="actions">

          <button
            class="btn-primary"
            onclick="editEvent('${event.id}')">
            Edit
          </button>

          ${publishButton}

          <button
            class="btn-danger"
            onclick="deleteEvent('${event.id}')">
            Delete
          </button>

        </div>

      </td>

    `;


    tbody.appendChild(tr);

  });

}


/* =========================================================
   ADD EVENT
   ========================================================= */

function openAddModal() {

  document.getElementById("modalTitle").textContent =
    "Add New Event";

  document.getElementById("eventId").value = "";

  document.getElementById("eventTitle").value = "";

  document.getElementById("eventDate").value = "";

  document.getElementById("eventType").value =
    "Jatra";

  document.getElementById("eventLocation").value = "";

  document.getElementById("eventDescription").value = "";

  document.getElementById("eventPublished").checked = true;

  document.getElementById("eventModal").style.display =
    "block";

}


/* =========================================================
   EDIT EVENT
   ========================================================= */

function editEvent(id) {

  const event =
    allEvents.find(e => e.id === id);

  if (!event) {

    alert("Event not found.");

    return;
  }


  document.getElementById("modalTitle").textContent =
    "Edit Event";


  document.getElementById("eventId").value =
    event.id;


  document.getElementById("eventTitle").value =
    event.title || "";


  document.getElementById("eventDate").value =
    event.event_date || "";


  document.getElementById("eventType").value =
    event.event_type || "Other";


  document.getElementById("eventLocation").value =
    event.location || "";


  document.getElementById("eventDescription").value =
    event.description || "";


  document.getElementById("eventPublished").checked =
    event.is_published === true;


  document.getElementById("eventModal").style.display =
    "block";

}


/* =========================================================
   CLOSE MODAL
   ========================================================= */

function closeModal() {

  document.getElementById("eventModal").style.display =
    "none";

}


/* =========================================================
   SAVE EVENT
   ========================================================= */

async function saveEvent() {

  hideMessage();


  const id =
    document.getElementById("eventId").value;


  const title =
    document.getElementById("eventTitle").value.trim();


  const eventDate =
    document.getElementById("eventDate").value;


  const eventType =
    document.getElementById("eventType").value;


  const location =
    document.getElementById("eventLocation").value.trim();


  const description =
    document.getElementById("eventDescription").value.trim();


  const isPublished =
    document.getElementById("eventPublished").checked;


  if (!title) {

    alert("Event title enter karantu.");

    return;
  }


  if (!eventDate) {

    alert("Event date select karantu.");

    return;
  }


  const saveButton =
    document.getElementById("saveButton");


  saveButton.disabled = true;

  saveButton.textContent = "Saving...";


  try {

    if (id) {

      const {
        error
      } = await supabaseClient
        .from("events")
        .update({
          title: title,
          event_date: eventDate,
          event_type: eventType,
          location: location || null,
          description: description || null,
          is_published: isPublished
        })
        .eq("id", id);


      if (error) {
        throw error;
      }


      showMessage(
        "Event successfully updated.",
        "success"
      );

    } else {

      const {
        error
      } = await supabaseClient
        .from("events")
        .insert({
          title: title,
          event_date: eventDate,
          event_type: eventType,
          location: location || null,
          description: description || null,
          is_published: isPublished,
          created_by: currentUser.id
        });


      if (error) {
        throw error;
      }


      showMessage(
        "Event successfully added.",
        "success"
      );

    }


    closeModal();

    await loadEvents();


  } catch (error) {

    console.error("Save event error:", error);

    showMessage(
      "Event save karibare problem hela: " +
      (error.message || "Unknown error")
    );

  } finally {

    saveButton.disabled = false;

    saveButton.textContent = "Save Event";

  }

}


/* =========================================================
   PUBLISH / UNPUBLISH
   ========================================================= */

async function togglePublish(id, publish) {

  const action =
    publish ? "publish" : "unpublish";


  if (
    !confirm(
      `Ei event ku ${action} karibaku sure achhanti?`
    )
  ) {
    return;
  }


  try {

    const {
      error
    } = await supabaseClient
      .from("events")
      .update({
        is_published: publish
      })
      .eq("id", id);


    if (error) {
      throw error;
    }


    showMessage(
      publish
        ? "Event published successfully."
        : "Event unpublished successfully.",
      "success"
    );


    await loadEvents();


  } catch (error) {

    console.error("Publish error:", error);

    showMessage(
      "Status update problem hela: " +
      (error.message || "Unknown error")
    );

  }

}


/* =========================================================
   DELETE EVENT
   ========================================================= */

async function deleteEvent(id) {

  const event =
    allEvents.find(e => e.id === id);


  if (!event) {
    return;
  }


  if (
    !confirm(
      `Delete "${event.title}" permanently?`
    )
  ) {
    return;
  }


  try {

    const {
      error
    } = await supabaseClient
      .from("events")
      .delete()
      .eq("id", id);


    if (error) {
      throw error;
    }


    showMessage(
      "Event deleted successfully.",
      "success"
    );


    await loadEvents();


  } catch (error) {

    console.error("Delete error:", error);

    showMessage(
      "Event delete karibare problem hela: " +
      (error.message || "Unknown error")
    );

  }

}


/* =========================================================
   FORMAT DATE
   ========================================================= */

function formatDate(dateString) {

  if (!dateString) {
    return "-";
  }


  const parts =
    dateString.split("-");


  if (parts.length !== 3) {
    return dateString;
  }


  return `${parts[2]}-${parts[1]}-${parts[0]}`;

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   DASHBOARD
   ========================================================= */

function goDashboard() {

  window.location.href = "admin.html";

}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout() {

  try {

    await supabaseClient.auth.signOut();

  } catch (error) {

    console.error(error);

  }

  window.location.href = "auth.html";

}


/* =========================================================
   CLOSE MODAL WHEN CLICK OUTSIDE
   ========================================================= */

window.addEventListener("click", function(event) {

  const modal =
    document.getElementById("eventModal");

  if (event.target === modal) {

    closeModal();

  }

});


</script>

</body>
</html>
