<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Event Manager | Maa Basuli Uda Jatra Committee</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6fa;
  color:#222;
}

.header{
  background:linear-gradient(135deg,#8b2f0f,#c45b0b);
  color:white;
  padding:22px 20px;
}

.header-inner{
  max-width:1240px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.header h1{
  margin:0;
  font-size:28px;
}

.header p{
  margin:6px 0 0;
  opacity:.9;
}

.header-buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  border-radius:8px;
  padding:11px 17px;
  cursor:pointer;
  font-size:14px;
  font-weight:bold;
}

.btn-primary{
  background:#9d390e;
  color:white;
}

.btn-primary:hover{
  background:#7e2d0b;
}

.btn-light{
  background:white;
  color:#7e2d0b;
}

.btn-danger{
  background:#dc2626;
  color:white;
}

.btn-success{
  background:#16803c;
  color:white;
}

.btn-secondary{
  background:#64748b;
  color:white;
}

.container{
  max-width:1240px;
  margin:30px auto;
  padding:0 20px;
}

.error-box{
  background:#fee2e2;
  color:#991b1b;
  border:1px solid #fecaca;
  border-radius:10px;
  padding:15px;
  margin-bottom:20px;
  display:none;
}

.success-box{
  background:#dcfce7;
  color:#166534;
  border:1px solid #bbf7d0;
  border-radius:10px;
  padding:15px;
  margin-bottom:20px;
  display:none;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-bottom:25px;
}

.stat{
  background:white;
  border-radius:14px;
  padding:22px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.stat-number{
  font-size:30px;
  font-weight:bold;
  color:#9d390e;
}

.stat-label{
  margin-top:5px;
  color:#64748b;
}

.toolbar{
  background:white;
  padding:18px;
  border-radius:14px;
  display:grid;
  grid-template-columns:1fr 200px 200px;
  gap:12px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:14px;
  background:white;
}

textarea{
  min-height:130px;
  resize:vertical;
}

.events-box{
  background:white;
  border-radius:14px;
  padding:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th,
td{
  padding:13px 10px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
  vertical-align:top;
}

th{
  background:#fff7ed;
  color:#7e2d0b;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.badge-published{
  background:#dcfce7;
  color:#166534;
}

.badge-unpublished{
  background:#fee2e2;
  color:#991b1b;
}

.action-buttons{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.small-btn{
  padding:7px 10px;
  border:0;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
  font-weight:bold;
}

.loading{
  text-align:center;
  padding:35px;
  color:#64748b;
}

.empty{
  text-align:center;
  padding:35px;
  color:#64748b;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.modal-content{
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow-y:auto;
  background:white;
  border-radius:15px;
  padding:25px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-header h2{
  margin:0;
  color:#8b2f0f;
}

.close{
  border:0;
  background:#eee;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
  font-size:20px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
  color:#374151;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.checkbox-row{
  display:flex;
  align-items:center;
  gap:10px;
}

.checkbox-row input{
  width:auto;
}

.modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

@media(max-width:800px){

  .header-inner{
    flex-direction:column;
    align-items:flex-start;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .toolbar{
    grid-template-columns:1fr;
  }

  .form-row{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<header class="header">

  <div class="header-inner">

    <div>
      <h1>Event Manager</h1>
      <p>Maa Basuli Uda Jatra Committee</p>
    </div>

    <div class="header-buttons">

      <button
        class="btn btn-light"
        onclick="goDashboard()">
        ← Back to Dashboard
      </button>

      <button
        class="btn btn-light"
        onclick="logout()">
        Logout
      </button>

    </div>

  </div>

</header>


<main class="container">

  <div
    id="errorBox"
    class="error-box">
  </div>

  <div
    id="successBox"
    class="success-box">
  </div>


  <section class="stats">

    <div class="stat">
      <div
        id="totalEvents"
        class="stat-number">
        0
      </div>

      <div class="stat-label">
        Total Events
      </div>
    </div>


    <div class="stat">
      <div
        id="publishedEvents"
        class="stat-number">
        0
      </div>

      <div class="stat-label">
        Published
      </div>
    </div>


    <div class="stat">
      <div
        id="unpublishedEvents"
        class="stat-number">
        0
      </div>

      <div class="stat-label">
        Unpublished
      </div>
    </div>

  </section>


  <section class="toolbar">

    <input
      id="searchInput"
      type="text"
      placeholder="Search event...">

    <select id="typeFilter">

      <option value="">
        All Types
      </option>

      <option value="Jatra">
        Jatra
      </option>

      <option value="Programme">
        Programme
      </option>

      <option value="Cultural">
        Cultural
      </option>

      <option value="Meeting">
        Meeting
      </option>

      <option value="Committee">
        Committee
      </option>

      <option value="Other">
        Other
      </option>

    </select>


    <select id="statusFilter">

      <option value="">
        All Status
      </option>

      <option value="published">
        Published
      </option>

      <option value="unpublished">
        Unpublished
      </option>

    </select>

  </section>


  <section class="events-box">

    <div
      id="loading"
      class="loading">
      Loading events...
    </div>

    <div
      id="empty"
      class="empty"
      style="display:none;">
      No events found.
    </div>

    <div id="tableWrapper" style="display:none;">

      <table>

        <thead>

          <tr>

            <th>
              Event
            </th>

            <th>
              Date
            </th>

            <th>
              Type
            </th>

            <th>
              Location
            </th>

            <th>
              Status
            </th>

            <th>
              Actions
            </th>

          </tr>

        </thead>

        <tbody id="eventsTableBody">
        </tbody>

      </table>

    </div>

  </section>

</main>


<!-- ADD / EDIT MODAL -->

<div
  id="eventModal"
  class="modal">

  <div class="modal-content">

    <div class="modal-header">

      <h2 id="modalTitle">
        Add New Event
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <form id="eventForm">

      <input
        type="hidden"
        id="eventId">


      <div class="form-group">

        <label>
          Event Title *
        </label>

        <input
          id="eventTitle"
          type="text"
          required
          placeholder="Enter event title">

      </div>


      <div class="form-row">

        <div class="form-group">

          <label>
            Event Date *
          </label>

          <input
            id="eventDate"
            type="date"
            required>

        </div>


        <div class="form-group">

          <label>
            Event Type *
          </label>

          <select
            id="eventType"
            required>

            <option value="Jatra">
              Jatra
            </option>

            <option value="Programme">
              Programme
            </option>

            <option value="Cultural">
              Cultural
            </option>

            <option value="Meeting">
              Meeting
            </option>

            <option value="Committee">
              Committee
            </option>

            <option value="Other">
              Other
            </option>

          </select>

        </div>

      </div>


      <div class="form-group">

        <label>
          Location
        </label>

        <input
          id="eventLocation"
          type="text"
          placeholder="Event location">

      </div>


      <div class="form-group">

        <label>
          Description
        </label>

        <textarea
          id="eventDescription"
          placeholder="Enter event details"></textarea>

      </div>


      <div class="form-group">

        <label class="checkbox-row">

          <input
            id="eventPublished"
            type="checkbox"
            checked>

          <span>
            Publish this event on public website
          </span>

        </label>

      </div>


      <div class="modal-footer">

        <button
          type="button"
          class="btn btn-secondary"
          onclick="closeModal()">
          Cancel
        </button>

        <button
          type="submit"
          class="btn btn-primary"
          id="saveButton">
          Save Event
        </button>

      </div>

    </form>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://ynymqntcawobcfccoekb.supabase.co";

/*
 IMPORTANT:
 Use the SAME publishable key that is working in auth.html.
*/

const SUPABASE_KEY =
  "sb_publishable_VyaVcI_yPlsg0aTfd5ZpUq_t--2_Nov";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let currentUser = null;

let currentRole = null;

let allEvents = [];

let editingEventId = null;


/* =========================================================
   ELEMENTS
   ========================================================= */

const errorBox =
  document.getElementById("errorBox");

const successBox =
  document.getElementById("successBox");

const loading =
  document.getElementById("loading");

const empty =
  document.getElementById("empty");

const tableWrapper =
  document.getElementById("tableWrapper");

const eventsTableBody =
  document.getElementById("eventsTableBody");


/* =========================================================
   ERROR / SUCCESS
   ========================================================= */

function showError(message){

  errorBox.textContent =
    message || "Something went wrong.";

  errorBox.style.display =
    "block";

  successBox.style.display =
    "none";
}


function showSuccess(message){

  successBox.textContent =
    message || "Operation successful.";

  successBox.style.display =
    "block";

  errorBox.style.display =
    "none";

}


function clearMessages(){

  errorBox.style.display =
    "none";

  successBox.style.display =
    "none";

}


/* =========================================================
   ROLE CHECK
   ========================================================= */

async function checkAccess(){

  clearMessages();

  try{

    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if(sessionError){

      throw sessionError;

    }


    currentUser =
      sessionData.session?.user || null;


    if(!currentUser){

      window.location.href =
        "auth.html";

      return false;

    }


    /*
      IMPORTANT:
      Do NOT directly query user_roles here.

      We use the secure RPC:
      get_my_role()
    */

    const {
      data: roleData,
      error: roleError
    } =
      await supabaseClient.rpc(
        "get_my_role"
      );


    if(roleError){

      throw roleError;

    }


    currentRole =
      roleData || "member";


    console.log(
      "Logged in user:",
      currentUser.email
    );

    console.log(
      "Current role:",
      currentRole
    );


    if(
      currentRole !== "admin" &&
      currentRole !== "super_admin"
    ){

      showError(
        "Admin access required."
      );

      setTimeout(() => {

        window.location.href =
          "profile.html";

      }, 1500);

      return false;

    }


    return true;

  }

  catch(error){

    console.error(
      "ROLE CHECK ERROR:",
      error
    );

    showError(
      "Role check failed: " +
      (
        error?.message ||
        "Unknown error"
      )
    );

    return false;

  }

}


/* =========================================================
   LOAD EVENTS
   ========================================================= */

async function loadEvents(){

  loading.style.display =
    "block";

  empty.style.display =
    "none";

  tableWrapper.style.display =
    "none";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("events")
      .select("*")
      .order(
        "event_date",
        {
          ascending:false
        }
      );


  if(error){

    console.error(
      "LOAD EVENTS ERROR:",
      error
    );

    loading.style.display =
      "none";

    showError(
      "Events load karibare problem hela: " +
      error.message
    );

    return;

  }


  allEvents =
    data || [];


  loading.style.display =
    "none";


  updateStats();

  renderEvents();

}


/* =========================================================
   UPDATE STATS
   ========================================================= */

function updateStats(){

  const total =
    allEvents.length;


  const published =
    allEvents.filter(
      event =>
        event.is_published === true
    ).length;


  const unpublished =
    allEvents.filter(
      event =>
        event.is_published !== true
    ).length;


  document.getElementById(
    "totalEvents"
  ).textContent =
    total;


  document.getElementById(
    "publishedEvents"
  ).textContent =
    published;


  document.getElementById(
    "unpublishedEvents"
  ).textContent =
    unpublished;

}


/* =========================================================
   FILTER EVENTS
   ========================================================= */

function getFilteredEvents(){

  const search =
    document.getElementById(
      "searchInput"
    ).value
    .trim()
    .toLowerCase();


  const type =
    document.getElementById(
      "typeFilter"
    ).value;


  const status =
    document.getElementById(
      "statusFilter"
    ).value;


  return allEvents.filter(event => {

    const title =
      String(
        event.title || ""
      ).toLowerCase();


    const description =
      String(
        event.description || ""
      ).toLowerCase();


    const location =
      String(
        event.location || ""
      ).toLowerCase();


    const matchesSearch =
      !search ||
      title.includes(search) ||
      description.includes(search) ||
      location.includes(search);


    const matchesType =
      !type ||
      event.event_type === type;


    const matchesStatus =
      !status ||
      (
        status === "published"
        && event.is_published === true
      )
      ||
      (
        status === "unpublished"
        && event.is_published !== true
      );


    return (
      matchesSearch &&
      matchesType &&
      matchesStatus
    );

  });

}


/* =========================================================
   RENDER EVENTS
   ========================================================= */

function renderEvents(){

  const events =
    getFilteredEvents();


  eventsTableBody.innerHTML =
    "";


  if(events.length === 0){

    empty.style.display =
      "block";

    tableWrapper.style.display =
      "none";

    return;

  }


  empty.style.display =
    "none";

  tableWrapper.style.display =
    "block";


  events.forEach(event => {

    const tr =
      document.createElement("tr");


    const title =
      escapeHtml(
        event.title || ""
      );


    const location =
      escapeHtml(
        event.location || "-"
      );


    const type =
      escapeHtml(
        event.event_type || "Other"
      );


    const date =
      event.event_date
        ? formatDate(
            event.event_date
          )
        : "-";


    const status =
      event.is_published
        ? `
          <span class="badge badge-published">
            Published
          </span>
        `
        : `
          <span class="badge badge-unpublished">
            Unpublished
          </span>
        `;


    tr.innerHTML = `

      <td>

        <strong>
          ${title}
        </strong>

        ${
          event.description
          ?
          `
          <div style="
            margin-top:5px;
            color:#64748b;
            font-size:12px;
          ">
            ${escapeHtml(
              event.description
                .substring(0,120)
            )}
            ${
              event.description.length > 120
              ? "..."
              : ""
            }
          </div>
          `
          : ""
        }

      </td>


      <td>
        ${date}
      </td>


      <td>
        ${type}
      </td>


      <td>
        ${location}
      </td>


      <td>
        ${status}
      </td>


      <td>

        <div class="action-buttons">

          <button
            class="small-btn btn-primary"
            onclick="editEvent('${event.id}')">
            Edit
          </button>


          <button
            class="small-btn ${
              event.is_published
              ? "btn-secondary"
              : "btn-success"
            }"
            onclick="togglePublish(
              '${event.id}',
              ${event.is_published}
            )">

            ${
              event.is_published
              ? "Unpublish"
              : "Publish"
            }

          </button>


          <button
            class="small-btn btn-danger"
            onclick="deleteEvent('${event.id}')">
            Delete
          </button>

        </div>

      </td>

    `;


    eventsTableBody.appendChild(tr);

  });

}


/* =========================================================
   OPEN ADD MODAL
   ========================================================= */

function openAddModal(){

  editingEventId =
    null;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Add New Event";


  document.getElementById(
    "eventForm"
  ).reset();


  document.getElementById(
    "eventPublished"
  ).checked =
    true;


  document.getElementById(
    "eventType"
  ).value =
    "Jatra";


  document.getElementById(
    "saveButton"
  ).textContent =
    "Save Event";


  document.getElementById(
    "eventModal"
  ).style.display =
    "flex";

}


/* =========================================================
   EDIT EVENT
   ========================================================= */

function editEvent(id){

  const event =
    allEvents.find(
      item => item.id === id
    );


  if(!event){

    showError(
      "Event not found."
    );

    return;

  }


  editingEventId =
    id;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Edit Event";


  document.getElementById(
    "eventId"
  ).value =
    event.id;


  document.getElementById(
    "eventTitle"
  ).value =
    event.title || "";


  document.getElementById(
    "eventDate"
  ).value =
    event.event_date || "";


  document.getElementById(
    "eventType"
  ).value =
    event.event_type || "Other";


  document.getElementById(
    "eventLocation"
  ).value =
    event.location || "";


  document.getElementById(
    "eventDescription"
  ).value =
    event.description || "";


  document.getElementById(
    "eventPublished"
  ).checked =
    event.is_published === true;


  document.getElementById(
    "saveButton"
  ).textContent =
    "Update Event";


  document.getElementById(
    "eventModal"
  ).style.display =
    "flex";

}


/* =========================================================
   CLOSE MODAL
   ========================================================= */

function closeModal(){

  document.getElementById(
    "eventModal"
  ).style.display =
    "none";

}


/* =========================================================
   SAVE EVENT
   ========================================================= */

document.getElementById(
  "eventForm"
).addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    clearMessages();


    const title =
      document.getElementById(
        "eventTitle"
      ).value.trim();


    const eventDate =
      document.getElementById(
        "eventDate"
      ).value;


    const eventType =
      document.getElementById(
        "eventType"
      ).value;


    const location =
      document.getElementById(
        "eventLocation"
      ).value.trim();


    const description =
      document.getElementById(
        "eventDescription"
      ).value.trim();


    const isPublished =
      document.getElementById(
        "eventPublished"
      ).checked;


    if(!title){

      showError(
        "Event title required."
      );

      return;

    }


    if(!eventDate){

      showError(
        "Event date required."
      );

      return;

    }


    const saveButton =
      document.getElementById(
        "saveButton"
      );


    saveButton.disabled =
      true;


    saveButton.textContent =
      editingEventId
      ? "Updating..."
      : "Saving...";


    try{

      if(editingEventId){

        /* UPDATE */

        const {
          error
        } =
          await supabaseClient
            .from("events")
            .update({

              title:
                title,

              event_date:
                eventDate,

              event_type:
                eventType,

              location:
                location || null,

              description:
                description || null,

              is_published:
                isPublished,

              updated_at:
                new Date().toISOString()

            })
            .eq(
              "id",
              editingEventId
            );


        if(error){

          throw error;

        }


        showSuccess(
          "Event updated successfully."
        );

      }
      else{

        /* INSERT */

        const {
          error
        } =
          await supabaseClient
            .from("events")
            .insert({

              title:
                title,

              event_date:
                eventDate,

              event_type:
                eventType,

              location:
                location || null,

              description:
                description || null,

              is_published:
                isPublished,

              created_by:
                currentUser.id

            });


        if(error){

          throw error;

        }


        showSuccess(
          "Event created successfully."
        );

      }


      closeModal();

      await loadEvents();


    }
    catch(error){

      console.error(
        "SAVE EVENT ERROR:",
        error
      );


      showError(
        "Event save failed: " +
        (
          error?.message ||
          "Unknown error"
        )
      );

    }
    finally{

      saveButton.disabled =
        false;

      saveButton.textContent =
        editingEventId
        ? "Update Event"
        : "Save Event";

    }

  }
);


/* =========================================================
   PUBLISH / UNPUBLISH
   ========================================================= */

async function togglePublish(
  id,
  currentStatus
){

  clearMessages();


  const newStatus =
    !currentStatus;


  const {
    error
  } =
    await supabaseClient
      .from("events")
      .update({

        is_published:
          newStatus,

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        id
      );


  if(error){

    console.error(
      "PUBLISH ERROR:",
      error
    );

    showError(
      "Status update failed: " +
      error.message
    );

    return;

  }


  showSuccess(
    newStatus
      ? "Event published."
      : "Event unpublished."
  );


  await loadEvents();

}


/* =========================================================
   DELETE EVENT
   ========================================================= */

async function deleteEvent(id){

  const event =
    allEvents.find(
      item => item.id === id
    );


  if(!event){

    return;

  }


  const confirmed =
    confirm(
      "Delete this event?\n\n" +
      event.title
    );


  if(!confirmed){

    return;

  }


  clearMessages();


  const {
    error
  } =
    await supabaseClient
      .from("events")
      .delete()
      .eq(
        "id",
        id
      );


  if(error){

    console.error(
      "DELETE EVENT ERROR:",
      error
    );

    showError(
      "Delete failed: " +
      error.message
    );

    return;

  }


  showSuccess(
    "Event deleted successfully."
  );


  await loadEvents();

}


/* =========================================================
   DATE FORMAT
   ========================================================= */

function formatDate(dateString){

  if(!dateString){

    return "-";

  }


  const date =
    new Date(
      dateString + "T00:00:00"
    );


  return date.toLocaleDateString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHtml(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}
