<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Event Manager | Maa Basuli Uda Jatra Committee</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#f5f7fb;
      color:#243047;
    }

    .header{
      background:linear-gradient(90deg,#8f2f0b,#d65d05);
      color:white;
      padding:25px 20px;
    }

    .header-inner{
      max-width:1200px;
      margin:auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
    }

    .header h1{
      font-size:28px;
      margin-bottom:5px;
    }

    .header p{
      font-size:16px;
      opacity:.95;
    }

    .header-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    button,
    .btn{
      border:0;
      border-radius:8px;
      padding:11px 18px;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
    }

    .btn-light{
      background:white;
      color:#8f2f0b;
    }

    .btn-primary{
      background:#9d3510;
      color:white;
    }

    .btn-success{
      background:#198754;
      color:white;
    }

    .btn-danger{
      background:#dc3545;
      color:white;
    }

    .btn-warning{
      background:#f0ad00;
      color:white;
    }

    .container{
      max-width:1200px;
      margin:30px auto;
      padding:0 20px;
    }

    .message{
      padding:15px 18px;
      border-radius:10px;
      margin-bottom:20px;
      display:none;
    }

    .message.error{
      display:block;
      background:#ffe1e1;
      color:#a40000;
      border:1px solid #ffb5b5;
    }

    .message.success{
      display:block;
      background:#ddf8e7;
      color:#116b36;
      border:1px solid #a9e8c0;
    }

    .top-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
      gap:15px;
      flex-wrap:wrap;
    }

    .top-row h2{
      color:#8f2f0b;
      font-size:26px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
      margin-bottom:25px;
    }

    .stat{
      background:white;
      padding:25px;
      border-radius:14px;
      box-shadow:0 4px 15px rgba(0,0,0,.07);
    }

    .stat-number{
      font-size:32px;
      font-weight:700;
      color:#9d3510;
      margin-bottom:5px;
    }

    .stat-label{
      color:#657089;
    }

    .filters{
      background:white;
      padding:20px;
      border-radius:14px;
      box-shadow:0 4px 15px rgba(0,0,0,.07);
      display:grid;
      grid-template-columns:2fr 1fr 1fr;
      gap:12px;
      margin-bottom:25px;
    }

    input,
    select,
    textarea{
      width:100%;
      padding:12px 14px;
      border:1px solid #d8dee9;
      border-radius:8px;
      font-size:15px;
      outline:none;
    }

    input:focus,
    select:focus,
    textarea:focus{
      border-color:#b84c16;
    }

    .events-area{
      background:white;
      border-radius:14px;
      box-shadow:0 4px 15px rgba(0,0,0,.07);
      overflow:hidden;
    }

    .loading{
      text-align:center;
      padding:45px;
      color:#64748b;
      font-size:17px;
    }

    .event-list{
      display:grid;
      gap:0;
    }

    .event-item{
      padding:22px;
      border-bottom:1px solid #e8ebf0;
    }

    .event-item:last-child{
      border-bottom:0;
    }

    .event-head{
      display:flex;
      justify-content:space-between;
      gap:20px;
      align-items:flex-start;
    }

    .event-title{
      font-size:21px;
      font-weight:700;
      color:#8f2f0b;
      margin-bottom:8px;
    }

    .event-meta{
      color:#657089;
      font-size:14px;
      line-height:1.7;
    }

    .event-description{
      margin-top:12px;
      color:#4a5568;
      line-height:1.6;
      white-space:pre-wrap;
    }

    .event-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:15px;
    }

    .badge{
      display:inline-block;
      padding:5px 10px;
      border-radius:20px;
      font-size:12px;
      font-weight:700;
      margin-left:5px;
    }

    .badge-published{
      background:#dff7e7;
      color:#137333;
    }

    .badge-unpublished{
      background:#ffe4e4;
      color:#a61b1b;
    }

    .modal{
      display:none;
      position:fixed;
      z-index:1000;
      inset:0;
      background:rgba(0,0,0,.55);
      padding:20px;
      overflow:auto;
    }

    .modal.show{
      display:block;
    }

    .modal-box{
      background:white;
      max-width:700px;
      margin:40px auto;
      border-radius:15px;
      padding:25px;
    }

    .modal-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }

    .modal-header h3{
      color:#8f2f0b;
      font-size:24px;
    }

    .close{
      background:#eee;
      color:#333;
      border-radius:50%;
      width:38px;
      height:38px;
      padding:0;
      font-size:20px;
    }

    .form-group{
      margin-bottom:16px;
    }

    .form-group label{
      display:block;
      margin-bottom:7px;
      font-weight:600;
      color:#374151;
    }

    textarea{
      min-height:130px;
      resize:vertical;
    }

    .form-actions{
      display:flex;
      justify-content:flex-end;
      gap:10px;
      margin-top:20px;
      flex-wrap:wrap;
    }

    .empty{
      padding:50px 20px;
      text-align:center;
      color:#6b7280;
    }

    @media(max-width:800px){
      .stats{
        grid-template-columns:1fr;
      }

      .filters{
        grid-template-columns:1fr;
      }

      .event-head{
        flex-direction:column;
      }

      .header-inner{
        flex-direction:column;
        align-items:flex-start;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <div>
      <h1>Event Manager</h1>
      <p>Maa Basuli Uda Jatra Committee</p>
    </div>

    <div class="header-actions">
      <button class="btn btn-light" onclick="goDashboard()">
        ← Back to Dashboard
      </button>

      <button class="btn btn-light" onclick="logout()">
        Logout
      </button>
    </div>
  </div>
</header>

<main class="container">

  <div id="message" class="message"></div>

  <div class="top-row">
    <h2>Manage Events & Programmes</h2>

    <button class="btn btn-primary" onclick="openAddModal()">
      + Add New Event
    </button>
  </div>

  <section class="stats">
    <div class="stat">
      <div class="stat-number" id="totalEvents">0</div>
      <div class="stat-label">Total Events</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="publishedEvents">0</div>
      <div class="stat-label">Published</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="unpublishedEvents">0</div>
      <div class="stat-label">Unpublished</div>
    </div>
  </section>

  <section class="filters">

    <input
      type="text"
      id="searchInput"
      placeholder="Search event..."
      oninput="renderEvents()"
    >

    <select id="typeFilter" onchange="renderEvents()">
      <option value="">All Types</option>
      <option value="Jatra">Jatra</option>
      <option value="Programme">Programme</option>
      <option value="Cultural">Cultural</option>
      <option value="Meeting">Meeting</option>
      <option value="Committee">Committee</option>
      <option value="Other">Other</option>
    </select>

    <select id="statusFilter" onchange="renderEvents()">
      <option value="">All Status</option>
      <option value="published">Published</option>
      <option value="unpublished">Unpublished</option>
    </select>

  </section>

  <section class="events-area">

    <div id="loading" class="loading">
      Loading events...
    </div>

    <div id="eventList" class="event-list"></div>

  </section>

</main>

<!-- ADD / EDIT MODAL -->

<div id="eventModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h3 id="modalTitle">
        Add New Event
      </h3>

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>

    <form id="eventForm">

      <input
        type="hidden"
        id="eventId"
      >

      <div class="form-group">

        <label>
          Event / Programme Title *
        </label>

        <input
          type="text"
          id="eventTitle"
          required
          placeholder="Example: Maa Basuli Uda Jatra"
        >

      </div>

      <div class="form-group">

        <label>
          Event Date *
        </label>

        <input
          type="date"
          id="eventDate"
          required
        >

      </div>

      <div class="form-group">

        <label>
          Event Type *
        </label>

        <select
          id="eventType"
          required
        >
          <option value="Jatra">Jatra</option>
          <option value="Programme">Programme</option>
          <option value="Cultural">Cultural</option>
          <option value="Meeting">Meeting</option>
          <option value="Committee">Committee</option>
          <option value="Other">Other</option>
        </select>

      </div>

      <div class="form-group">

        <label>
          Location
        </label>

        <input
          type="text"
          id="eventLocation"
          placeholder="Thakurmunda, Mayurbhanj, Odisha"
        >

      </div>

      <div class="form-group">

        <label>
          Description
        </label>

        <textarea
          id="eventDescription"
          placeholder="Event details..."
        ></textarea>

      </div>

      <div class="form-group">

        <label>
          Status
        </label>

        <select id="eventPublished">

          <option value="true">
            Published
          </option>

          <option value="false">
            Unpublished
          </option>

        </select>

      </div>

      <div class="form-actions">

        <button
          type="button"
          class="btn"
          onclick="closeModal()"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="btn btn-primary"
        >
          Save Event
        </button>

      </div>

    </form>

  </div>

</div>


<script>

  /* =========================================================
     SUPABASE CONFIG
     USE THE SAME WORKING PUBLISHABLE KEY AS auth.html
     ========================================================= */

  const SUPABASE_URL =
    "https://ynymqntcawobcfccoekb.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_VyaVcI_yPlsg0aTfd5ZpUq_t--2_Nov";


  const { createClient } =
    supabase;

  const db =
    createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let currentUser = null;
  let currentRole = null;
  let events = [];


  /* =========================================================
     HELPERS
     ========================================================= */

  function showMessage(text, type = "error") {

    const box =
      document.getElementById("message");

    box.textContent = text;

    box.className =
      "message " + type;

  }


  function clearMessage() {

    const box =
      document.getElementById("message");

    box.textContent = "";

    box.className =
      "message";

  }


  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function formatDate(dateString) {

    if (!dateString) {
      return "-";
    }

    const date =
      new Date(dateString + "T00:00:00");

    return date.toLocaleDateString(
      "en-IN",
      {
        day: "2-digit",
        month: "long",
        year: "numeric"
      }
    );
  }


  /* =========================================================
     AUTH + ROLE CHECK
     ========================================================= */

  async function checkAccess() {

    clearMessage();

    const {
      data: sessionData,
      error: sessionError
    } = await db.auth.getSession();

    if (sessionError) {
      showMessage(
        "Session error: " +
        sessionError.message
      );
      return false;
    }

    const session =
      sessionData.session;

    if (!session) {

      window.location.href =
        "auth.html";

      return false;
    }

    currentUser =
      session.user;


    const {
      data: roleData,
      error: roleError
    } = await db
      .from("user_roles")
      .select("role")
      .eq("user_id", currentUser.id)
      .maybeSingle();


    if (roleError) {

      showMessage(
        "Role check failed: " +
        roleError.message
      );

      return false;
    }


    currentRole =
      roleData?.role || "member";


    if (
      currentRole !== "admin" &&
      currentRole !== "super_admin"
    ) {

      showMessage(
        "Access denied. Only Admin or Super Admin can manage events."
      );

      setTimeout(() => {

        window.location.href =
          "profile.html";

      }, 1800);

      return false;
    }


    return true;
  }


  /* =========================================================
     LOAD EVENTS
     ========================================================= */

  async function loadEvents() {

    const loading =
      document.getElementById("loading");

    loading.style.display =
      "block";

    document.getElementById(
      "eventList"
    ).innerHTML = "";


    const {
      data,
      error
    } = await db
      .from("events")
      .select("*")
      .order("event_date", {
        ascending: false
      });


    loading.style.display =
      "none";


    if (error) {

      showMessage(
        "Events load failed: " +
        error.message
      );

      return;
    }


    events =
      data || [];

    updateStats();

    renderEvents();
  }


  /* =========================================================
     STATS
     ========================================================= */

  function updateStats() {

    const total =
      events.length;

    const published =
      events.filter(
        e => e.is_published === true
      ).length;

    const unpublished =
      events.filter(
        e => e.is_published === false
      ).length;


    document.getElementById(
      "totalEvents"
    ).textContent = total;

    document.getElementById(
      "publishedEvents"
    ).textContent = published;

    document.getElementById(
      "unpublishedEvents"
    ).textContent = unpublished;
  }


  /* =========================================================
     RENDER
     ========================================================= */

  function renderEvents() {

    const list =
      document.getElementById(
        "eventList"
      );


    const search =
      document.getElementById(
        "searchInput"
      ).value
      .trim()
      .toLowerCase();


    const type =
      document.getElementById(
        "typeFilter"
      ).value;


    const status =
      document.getElementById(
        "statusFilter"
      ).value;


    const filtered =
      events.filter(event => {

        const searchText = (

          (event.title || "") +
          " " +
          (event.description || "") +
          " " +
          (event.location || "") +
          " " +
          (event.event_type || "")

        ).toLowerCase();


        if (
          search &&
          !searchText.includes(search)
        ) {
          return false;
        }


        if (
          type &&
          event.event_type !== type
        ) {
          return false;
        }


        if (
          status === "published" &&
          event.is_published !== true
        ) {
          return false;
        }


        if (
          status === "unpublished" &&
          event.is_published !== false
        ) {
          return false;
        }


        return true;

      });


    if (filtered.length === 0) {

      list.innerHTML =
        `<div class="empty">
          No events found.
        </div>`;

      return;
    }


    list.innerHTML =
      filtered.map(event => {

        const badge =
          event.is_published
          ? `<span class="badge badge-published">
               Published
             </span>`
          : `<span class="badge badge-unpublished">
               Unpublished
             </span>`;


        return `

          <div class="event-item">

            <div class="event-head">

              <div>

                <div class="event-title">
                  ${escapeHtml(event.title)}
                  ${badge}
                </div>

                <div class="event-meta">

                  📅 ${formatDate(event.event_date)}

                  &nbsp; | &nbsp;

                  📌 ${escapeHtml(event.event_type || "Other")}

                  ${
                    event.location
                    ? `&nbsp; | &nbsp; 📍 ${escapeHtml(event.location)}`
                    : ""
                  }

                </div>

              </div>

            </div>


            ${
              event.description
              ? `
                <div class="event-description">
                  ${escapeHtml(event.description)}
                </div>
              `
              : ""
            }


            <div class="event-actions">

              <button
                class="btn btn-primary"
                onclick="editEvent('${event.id}')"
              >
                Edit
              </button>


              <button
                class="btn ${
                  event.is_published
                  ? "btn-warning"
                  : "btn-success"
                }"
                onclick="togglePublish('${event.id}')"
              >
                ${
                  event.is_published
                  ? "Unpublish"
                  : "Publish"
                }
              </button>


              <button
                class="btn btn-danger"
                onclick="deleteEvent('${event.id}')"
              >
                Delete
              </button>

            </div>

          </div>

        `;

      }).join("");
  }


  /* =========================================================
     ADD EVENT
     ========================================================= */

  function openAddModal() {

    document.getElementById(
      "modalTitle"
    ).textContent =
      "Add New Event";


    document.getElementById(
      "eventId"
    ).value = "";


    document.getElementById(
      "eventForm"
    ).reset();


    document.getElementById(
      "eventPublished"
    ).value = "true";


    document.getElementById(
      "eventModal"
    ).classList.add("show");
  }


  /* =========================================================
     EDIT EVENT
     ========================================================= */

  function editEvent(id) {

    const event =
      events.find(
        e => e.id === id
      );


    if (!event) {
      return;
    }


    document.getElementById(
      "modalTitle"
    ).textContent =
      "Edit Event";


    document.getElementById(
      "eventId"
    ).value =
      event.id;


    document.getElementById(
      "eventTitle"
    ).value =
      event.title || "";


    document.getElementById(
      "eventDate"
    ).value =
      event.event_date || "";


    document.getElementById(
      "eventType"
    ).value =
      event.event_type || "Other";


    document.getElementById(
      "eventLocation"
    ).value =
      event.location || "";


    document.getElementById(
      "eventDescription"
    ).value =
      event.description || "";


    document.getElementById(
      "eventPublished"
    ).value =
      event.is_published
      ? "true"
      : "false";


    document.getElementById(
      "eventModal"
    ).classList.add("show");
  }


  /* =========================================================
     CLOSE MODAL
     ========================================================= */

  function closeModal() {

    document.getElementById(
      "eventModal"
    ).classList.remove("show");
  }


  /* =========================================================
     SAVE EVENT
     ========================================================= */

  document.getElementById(
    "eventForm"
  ).addEventListener(
    "submit",
    async function(e) {

      e.preventDefault();

      clearMessage();


      const id =
        document.getElementById(
          "eventId"
        ).value;


      const payload = {

        title:
          document.getElementById(
            "eventTitle"
          ).value.trim(),

        event_date:
          document.getElementById(
            "eventDate"
          ).value,

        event_type:
          document.getElementById(
            "eventType"
          ).value,

        location:
          document.getElementById(
            "eventLocation"
          ).value.trim() || null,

        description:
          document.getElementById(
            "eventDescription"
          ).value.trim() || null,

        is_published:
          document.getElementById(
            "eventPublished"
          ).value === "true"

      };


      if (!payload.title) {

        showMessage(
          "Event title is required."
        );

        return;
      }


      if (!payload.event_date) {

        showMessage(
          "Event date is required."
        );

        return;
      }


      let result;


      if (id) {

        result =
          await db
            .from("events")
            .update(payload)
            .eq("id", id);

      } else {

        payload.created_by =
          currentUser.id;


        result =
          await db
            .from("events")
            .insert(payload);

      }


      if (result.error) {

        showMessage(
          "Save failed: " +
          result.error.message
        );

        return;
      }


      closeModal();

      showMessage(
        id
        ? "Event updated successfully."
        : "Event created successfully.",
        "success"
      );


      await loadEvents();

    }
  );


  /* =========================================================
     PUBLISH / UNPUBLISH
     ========================================================= */

  async function togglePublish(id) {

    const event =
      events.find(
        e => e.id === id
      );


    if (!event) {
      return;
    }


    const newStatus =
      !event.is_published;


    const {
      error
    } = await db
      .from("events")
      .update({
        is_published: newStatus
      })
      .eq("id", id);


    if (error) {

      showMessage(
        "Status update failed: " +
        error.message
      );

      return;
    }


    showMessage(
      newStatus
      ? "Event published successfully."
      : "Event unpublished successfully.",
      "success"
    );


    await loadEvents();
  }


  /* =========================================================
     DELETE
     ========================================================= */

  async function deleteEvent(id) {

    const event =
      events.find(
        e => e.id === id
      );


    if (!event) {
      return;
    }


    const confirmed =
      confirm(
        "Delete this event?\n\n" +
        event.title
      );


    if (!confirmed) {
      return;
    }


    const {
      error
    } = await db
      .from("events")
      .delete()
      .eq("id", id);


    if (error) {

      showMessage(
        "Delete failed: " +
        error.message
      );

      return;
    }


    showMessage(
      "Event deleted successfully.",
      "success"
    );


    await loadEvents();
  }


  /* =========================================================
     NAVIGATION
     ========================================================= */

  function goDashboard() {

    window.location.href =
      "admin.html";
  }


  async function logout() {

    await db.auth.signOut();

    window.location.href =
      "auth.html";
  }


  /* =========================================================
     INITIALIZE
     ========================================================= */

  async function init() {

    const allowed =
      await checkAccess();


    if (!allowed) {
      return;
    }


    await loadEvents();
  }


  init();

</script>

</body>
</html>
