<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Event Manager | Maa Basuli Uda Jatra Committee</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#1f2937;
}

.header{
  background:linear-gradient(135deg,#7c2d12,#b45309);
  color:white;
  padding:22px 20px;
}

.header-inner{
  width:min(1250px,94%);
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.header h1{
  font-size:25px;
  margin-bottom:5px;
}

.header p{
  font-size:14px;
  opacity:.9;
}

.back-btn{
  background:white;
  color:#7c2d12;
  text-decoration:none;
  padding:11px 17px;
  border-radius:8px;
  font-weight:bold;
}

.container{
  width:min(1250px,94%);
  margin:30px auto 60px;
}

.top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.top-row h2{
  color:#7c2d12;
  font-size:28px;
}

.add-btn{
  border:none;
  background:#9a3412;
  color:white;
  padding:13px 20px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  font-size:14px;
}

.add-btn:hover{
  background:#7c2d12;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-bottom:22px;
}

.stat{
  background:white;
  padding:22px;
  border-radius:12px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.stat strong{
  display:block;
  color:#9a3412;
  font-size:30px;
  margin-bottom:5px;
}

.stat span{
  color:#6b7280;
}

.filters{
  background:white;
  padding:18px;
  border-radius:12px;
  display:grid;
  grid-template-columns:1fr 200px 180px;
  gap:12px;
  margin-bottom:20px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

input,
select,
textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:8px;
  padding:12px;
  font-size:14px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#b45309;
}

textarea{
  resize:vertical;
  min-height:110px;
}

.events-box{
  background:white;
  border-radius:12px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
  overflow:hidden;
}

.loading,
.empty{
  text-align:center;
  padding:40px;
  color:#6b7280;
}

.error-box{
  background:#fee2e2;
  color:#991b1b;
  padding:16px;
  border-radius:10px;
  margin-bottom:20px;
  word-break:break-word;
}

.event-item{
  padding:20px;
  border-bottom:1px solid #e5e7eb;
}

.event-item:last-child{
  border-bottom:none;
}

.event-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
}

.event-title{
  color:#7c2d12;
  font-size:19px;
  font-weight:bold;
  margin-bottom:7px;
}

.event-meta{
  color:#6b7280;
  font-size:13px;
  line-height:1.7;
}

.badge{
  padding:5px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
  white-space:nowrap;
}

.badge-published{
  background:#dcfce7;
  color:#166534;
}

.badge-unpublished{
  background:#fee2e2;
  color:#991b1b;
}

.type-badge{
  background:#ffedd5;
  color:#9a3412;
  margin-left:5px;
}

.description{
  color:#4b5563;
  line-height:1.6;
  margin-top:10px;
  white-space:pre-wrap;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}

.action-btn{
  border:none;
  padding:8px 12px;
  border-radius:7px;
  cursor:pointer;
  font-size:12px;
  font-weight:bold;
}

.edit-btn{
  background:#dbeafe;
  color:#1d4ed8;
}

.publish-btn{
  background:#dcfce7;
  color:#166534;
}

.unpublish-btn{
  background:#fef3c7;
  color:#92400e;
}

.delete-btn{
  background:#fee2e2;
  color:#991b1b;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:1000;
  padding:20px;
  overflow:auto;
}

.modal.show{
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal-box{
  width:min(650px,100%);
  background:white;
  border-radius:14px;
  padding:25px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-header h3{
  color:#7c2d12;
  font-size:22px;
}

.close-btn{
  border:none;
  background:#f3f4f6;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
  font-size:20px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:bold;
  color:#374151;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.check-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:5px;
}

.check-row input{
  width:auto;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

.cancel-btn{
  border:none;
  background:#e5e7eb;
  color:#374151;
  padding:11px 18px;
  border-radius:8px;
  cursor:pointer;
}

.save-btn{
  border:none;
  background:#9a3412;
  color:white;
  padding:11px 20px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.save-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  display:none;
}

.message.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

@media(max-width:800px){

  .header-inner,
  .top-row{
    flex-direction:column;
    align-items:flex-start;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .event-head{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="header-inner">

    <div>
      <h1>Event Manager</h1>
      <p>Maa Basuli Uda Jatra Committee</p>
    </div>

    <a href="admin.html" class="back-btn">
      ← Back to Dashboard
    </a>

  </div>

</header>


<main class="container">

  <div class="top-row">

    <h2>Manage Events & Programmes</h2>

    <button
      class="add-btn"
      onclick="openAddModal()"
    >
      + Add New Event
    </button>

  </div>


  <div id="errorBox"></div>


  <section class="stats">

    <div class="stat">
      <strong id="totalCount">0</strong>
      <span>Total Events</span>
    </div>

    <div class="stat">
      <strong id="publishedCount">0</strong>
      <span>Published</span>
    </div>

    <div class="stat">
      <strong id="unpublishedCount">0</strong>
      <span>Unpublished</span>
    </div>

  </section>


  <section class="filters">

    <input
      type="search"
      id="searchInput"
      placeholder="Search event..."
    >

    <select id="typeFilter">

      <option value="all">
        All Types
      </option>

      <option value="Jatra">
        Jatra
      </option>

      <option value="Programme">
        Programme
      </option>

      <option value="Cultural">
        Cultural
      </option>

      <option value="Meeting">
        Meeting
      </option>

      <option value="Committee">
        Committee
      </option>

      <option value="Other">
        Other
      </option>

    </select>


    <select id="statusFilter">

      <option value="all">
        All Status
      </option>

      <option value="published">
        Published
      </option>

      <option value="unpublished">
        Unpublished
      </option>

    </select>

  </section>


  <section class="events-box">

    <div
      id="eventList"
      class="loading"
    >
      Loading events...
    </div>

  </section>

</main>


<!-- MODAL -->

<div
  id="eventModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h3 id="modalTitle">
        Add New Event
      </h3>

      <button
        class="close-btn"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    <div
      id="formMessage"
      class="message"
    ></div>


    <form id="eventForm">

      <input
        type="hidden"
        id="eventId"
      >


      <div class="form-group">

        <label>
          Event Title *
        </label>

        <input
          type="text"
          id="title"
          required
          placeholder="Enter event title"
        >

      </div>


      <div class="form-grid">

        <div class="form-group">

          <label>
            Event Date *
          </label>

          <input
            type="date"
            id="eventDate"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Event Type *
          </label>

          <select
            id="eventType"
            required
          >

            <option value="Jatra">
              Jatra
            </option>

            <option value="Programme">
              Programme
            </option>

            <option value="Cultural">
              Cultural
            </option>

            <option value="Meeting">
              Meeting
            </option>

            <option value="Committee">
              Committee
            </option>

            <option value="Other">
              Other
            </option>

          </select>

        </div>

      </div>


      <div class="form-group">

        <label>
          Location
        </label>

        <input
          type="text"
          id="location"
          placeholder="e.g. Maa Basuli Temple, Thakurmunda"
        >

      </div>


      <div class="form-group">

        <label>
          Description
        </label>

        <textarea
          id="description"
          placeholder="Enter event details..."
        ></textarea>

      </div>


      <div class="check-row">

        <input
          type="checkbox"
          id="isPublished"
          checked
        >

        <label for="isPublished">
          Publish this event on public website
        </label>

      </div>


      <div class="form-actions">

        <button
          type="button"
          class="cancel-btn"
          onclick="closeModal()"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="save-btn"
          id="saveBtn"
        >
          Save Event
        </button>

      </div>

    </form>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
   EXACT SAME WORKING KEY AS AUTH.HTML
===================================================== */

const SUPABASE_URL =
  "https://ynymqntcawobcfccoekb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_VyaVcI_yPlsg0aTfd5ZpUQ_t--2_Nov";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let currentUser = null;
let currentRole = null;
let allEvents = [];


/* =====================================================
   ERROR DISPLAY
===================================================== */

function showError(message){

  document.getElementById(
    "errorBox"
  ).innerHTML = `

    <div class="error-box">
      ${escapeHtml(message)}
    </div>

  `;

}


function clearError(){

  document.getElementById(
    "errorBox"
  ).innerHTML = "";

}


/* =====================================================
   CHECK LOGIN + ROLE
===================================================== */

async function checkAccess(){

  clearError();

  try{

    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if(sessionError){

      throw sessionError;

    }


    currentUser =
      sessionData.session?.user || null;


    if(!currentUser){

      window.location.href =
        "auth.html";

      return false;

    }


    const {
      data: roleData,
      error: roleError
    } =
      await supabaseClient
        .from("user_roles")
        .select("role")
        .eq(
          "user_id",
          currentUser.id
        )
        .maybeSingle();


    if(roleError){

      throw roleError;

    }


    currentRole =
      roleData?.role || "member";


    if(
      currentRole !== "admin" &&
      currentRole !== "super_admin"
    ){

      alert(
        "Role check failed. Admin access required."
      );

      window.location.href =
        "profile.html";

      return false;

    }


    return true;

  }

  catch(error){

    console.error(
      "ROLE CHECK ERROR:",
      error
    );


    showError(
      "Role check failed: " +
      (
        error.message ||
        "Unknown error"
      )
    );


    return false;

  }

}


/* =====================================================
   LOAD EVENTS
===================================================== */

async function loadEvents(){

  const list =
    document.getElementById(
      "eventList"
    );


  list.innerHTML =
    '<div class="loading">Loading events...</div>';


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("events")
        .select(
          "id,title,event_date,event_type,location,description,is_published,created_by,created_at,updated_at"
        )
        .order(
          "event_date",
          {
            ascending:false
          }
        );


    if(error){

      throw error;

    }


    allEvents =
      data || [];


    updateStats();

    renderEvents();

  }

  catch(error){

    console.error(
      "LOAD EVENTS ERROR:",
      error
    );


    list.innerHTML =
      '<div class="empty">Events load karibare problem hela.</div>';


    showError(
      "Events load failed: " +
      (
        error.message ||
        "Unknown error"
      )
    );

  }

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

  const total =
    allEvents.length;


  const published =
    allEvents.filter(
      event => event.is_published
    ).length;


  const unpublished =
    allEvents.filter(
      event => !event.is_published
    ).length;


  document.getElementById(
    "totalCount"
  ).textContent = total;


  document.getElementById(
    "publishedCount"
  ).textContent = published;


  document.getElementById(
    "unpublishedCount"
  ).textContent = unpublished;

}


/* =====================================================
   RENDER EVENTS
===================================================== */

function renderEvents(){

  const list =
    document.getElementById(
      "eventList"
    );


  const search =
    document.getElementById(
      "searchInput"
    ).value
      .trim()
      .toLowerCase();


  const type =
    document.getElementById(
      "typeFilter"
    ).value;


  const status =
    document.getElementById(
      "statusFilter"
    ).value;


  const filtered =
    allEvents.filter(event => {

      const text = (

        (event.title || "") +
        " " +
        (event.description || "") +
        " " +
        (event.location || "") +
        " " +
        (event.event_type || "")

      ).toLowerCase();


      const searchMatch =
        !search ||
        text.includes(search);


      const typeMatch =
        type === "all" ||
        event.event_type === type;


      let statusMatch = true;


      if(status === "published"){

        statusMatch =
          event.is_published === true;

      }


      if(status === "unpublished"){

        statusMatch =
          event.is_published === false;

      }


      return (
        searchMatch &&
        typeMatch &&
        statusMatch
      );

    });


  if(!filtered.length){

    list.innerHTML = `

      <div class="empty">

        No events found.

      </div>

    `;

    return;

  }


  list.innerHTML =

    filtered.map(event => {

      const date =
        event.event_date
          ? new Date(
              event.event_date +
              "T00:00:00"
            ).toLocaleDateString(
              "en-IN",
              {
                day:"2-digit",
                month:"short",
                year:"numeric"
              }
            )
          : "Date not set";


      return `

        <div class="event-item">

          <div class="event-head">

            <div>

              <div class="event-title">

                ${escapeHtml(
                  event.title
                )}

              </div>

              <div class="event-meta">

                📅 ${date}

                <br>

                📍 ${
                  escapeHtml(
                    event.location ||
                    "Location not set"
                  )
                }

              </div>

            </div>


            <div>

              <span class="badge ${
                event.is_published
                  ? "badge-published"
                  : "badge-unpublished"
              }">

                ${
                  event.is_published
                    ? "Published"
                    : "Unpublished"
                }

              </span>


              <span class="badge type-badge">

                ${
                  escapeHtml(
                    event.event_type ||
                    "Other"
                  )
                }

              </span>

            </div>

          </div>


          ${
            event.description

              ? `

                <div class="description">

                  ${escapeHtml(
                    event.description
                  )}

                </div>

              `

              : ""

          }


          <div class="actions">

            <button
              class="action-btn edit-btn"
              onclick="editEvent('${event.id}')"
            >
              ✏️ Edit
            </button>


            <button
              class="action-btn ${
                event.is_published
                  ? "unpublish-btn"
                  : "publish-btn"
              }"
              onclick="togglePublish(
                '${event.id}',
                ${event.is_published}
              )"
            >

              ${
                event.is_published
                  ? "Unpublish"
                  : "Publish"
              }

            </button>


            <button
              class="action-btn delete-btn"
              onclick="deleteEvent('${event.id}')"
            >
              🗑️ Delete
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =====================================================
   OPEN ADD
===================================================== */

function openAddModal(){

  document.getElementById(
    "modalTitle"
  ).textContent =
    "Add New Event";


  document.getElementById(
    "eventForm"
  ).reset();


  document.getElementById(
    "eventId"
  ).value = "";


  document.getElementById(
    "isPublished"
  ).checked = true;


  document.getElementById(
    "formMessage"
  ).className =
    "message";


  document.getElementById(
    "eventModal"
  ).classList.add(
    "show"
  );

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal(){

  document.getElementById(
    "eventModal"
  ).classList.remove(
    "show"
  );

}


/* =====================================================
   EDIT EVENT
===================================================== */

function editEvent(id){

  const event =
    allEvents.find(
      item => item.id === id
    );


  if(!event){

    alert(
      "Event not found."
    );

    return;

  }


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Edit Event";


  document.getElementById(
    "eventId"
  ).value =
    event.id;


  document.getElementById(
    "title"
  ).value =
    event.title || "";


  document.getElementById(
    "eventDate"
  ).value =
    event.event_date || "";


  document.getElementById(
    "eventType"
  ).value =
    event.event_type || "Other";


  document.getElementById(
    "location"
  ).value =
    event.location || "";


  document.getElementById(
    "description"
  ).value =
    event.description || "";


  document.getElementById(
    "isPublished"
  ).checked =
    event.is_published === true;


  document.getElementById(
    "formMessage"
  ).className =
    "message";


  document.getElementById(
    "eventModal"
  ).classList.add(
    "show"
  );

}


/* =====================================================
   SAVE EVENT
===================================================== */

document
  .getElementById(
    "eventForm"
  )
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();

      clearError();


      const saveBtn =
        document.getElementById(
          "saveBtn"
        );


      saveBtn.disabled = true;

      saveBtn.textContent =
        "Saving...";


      const id =
        document.getElementById(
          "eventId"
        ).value;


      const payload = {

        title:
          document.getElementById(
            "title"
          ).value.trim(),

        event_date:
          document.getElementById(
            "eventDate"
          ).value,

        event_type:
          document.getElementById(
            "eventType"
          ).value,

        location:
          document.getElementById(
            "location"
          ).value.trim() || null,

        description:
          document.getElementById(
            "description"
          ).value.trim() || null,

        is_published:
          document.getElementById(
            "isPublished"
          ).checked

      };


      try{

        if(!payload.title){

          throw new Error(
            "Event title is required."
          );

        }


        if(!payload.event_date){

          throw new Error(
            "Event date is required."
          );

        }


        let result;


        /* UPDATE */

        if(id){

          result =
            await supabaseClient
              .from("events")
              .update(payload)
              .eq(
                "id",
                id
              );

        }

        /* INSERT */

        else{

          payload.created_by =
            currentUser.id;


          result =
            await supabaseClient
              .from("events")
              .insert(
                payload
              );

        }


        if(result.error){

          throw result.error;

        }


        closeModal();

        await loadEvents();


        alert(
          id
            ? "Event updated successfully."
            : "Event added successfully."
        );

      }

      catch(error){

        console.error(
          "SAVE EVENT ERROR:",
          error
        );


        const message =
          document.getElementById(
            "formMessage"
          );


        message.className =
          "message error";


        message.textContent =
          error.message ||
          "Event save failed.";

      }

      finally{

        saveBtn.disabled =
          false;

        saveBtn.textContent =
          "Save Event";

      }

    }
  );


/* =====================================================
   PUBLISH / UNPUBLISH
===================================================== */

async function togglePublish(
  id,
  currentStatus
){

  const action =
    currentStatus
      ? "unpublish"
      : "publish";


  const confirmed =
    confirm(
      `Are you sure you want to ${action} this event?`
    );


  if(!confirmed){

    return;

  }


  try{

    const {
      error
    } =
      await supabaseClient
        .from("events")
        .update({
          is_published:
            !currentStatus
        })
        .eq(
          "id",
          id
        );


    if(error){

      throw error;

    }


    await loadEvents();


  }

  catch(error){

    console.error(
      "PUBLISH ERROR:",
      error
    );


    showError(
      "Publish status update failed: " +
      (
        error.message ||
        "Unknown error"
      )
    );

  }

}


/* =====================================================
   DELETE EVENT
===================================================== */

async function deleteEvent(id){

  const confirmed =
    confirm(
      "Are you sure you want to permanently delete this event?"
    );


  if(!confirmed){

    return;

  }


  try{

    const {
      error
    } =
      await supabaseClient
        .from("events")
        .delete()
        .eq(
          "id",
          id
        );


    if(error){

      throw error;

    }


    await loadEvents();


    alert(
      "Event deleted successfully."
    );

  }

  catch(error){

    console.error(
      "DELETE EVENT ERROR:",
      error
    );


    showError(
      "Event delete failed: " +
      (
        error.message ||
        "Unknown error"
      )
    );

  }

}

/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}
