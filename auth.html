<!DOCTYPE html>
<html lang="or">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Member Login | Maa Basuli Uda Jatra Committee</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,"Noto Sans Oriya",sans-serif;
      min-height:100vh;
      background:linear-gradient(135deg,#6f0909,#b51b0b);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .box{
      width:100%;
      max-width:480px;
      background:white;
      border-radius:18px;
      padding:30px;
      box-shadow:0 10px 35px rgba(0,0,0,.25);
    }

    .logo{
      text-align:center;
      font-size:48px;
      margin-bottom:8px;
    }

    h1{
      text-align:center;
      color:#8d0d0d;
      font-size:25px;
    }

    .subtitle{
      text-align:center;
      color:#666;
      margin:8px 0 25px;
      font-size:14px;
    }

    .tabs{
      display:flex;
      margin-bottom:25px;
      border-bottom:2px solid #eee;
    }

    .tab{
      flex:1;
      padding:12px;
      border:0;
      background:white;
      font-weight:bold;
      cursor:pointer;
      color:#777;
    }

    .tab.active{
      color:#8d0d0d;
      border-bottom:3px solid #8d0d0d;
    }

    .form{
      display:none;
    }

    .form.active{
      display:block;
    }

    label{
      display:block;
      margin:13px 0 6px;
      font-weight:bold;
      color:#333;
    }

    input{
      width:100%;
      padding:13px;
      border:1px solid #ccc;
      border-radius:7px;
      font-size:15px;
      outline:none;
    }

    input:focus{
      border-color:#a51010;
    }

    .main-btn{
      width:100%;
      margin-top:22px;
      padding:13px;
      border:0;
      border-radius:7px;
      background:#9e1010;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .main-btn:hover{
      background:#760909;
    }

    .link-btn{
      border:0;
      background:none;
      color:#9e1010;
      cursor:pointer;
      margin-top:15px;
      width:100%;
      font-size:14px;
    }

    .message{
      display:none;
      padding:12px;
      border-radius:7px;
      margin-top:15px;
      font-size:14px;
    }

    .success{
      display:block;
      background:#e8f7ed;
      color:#176b35;
    }

    .error{
      display:block;
      background:#fdeaea;
      color:#9b111e;
    }

    .back{
      display:block;
      text-align:center;
      margin-top:22px;
      color:#8d0d0d;
      text-decoration:none;
      font-weight:bold;
    }

    .small{
      text-align:center;
      color:#777;
      font-size:12px;
      margin-top:20px;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">🛕</div>

  <h1>ମା' ବାସୁଳୀ ଉଦା ଯାତ୍ରା</h1>

  <p class="subtitle">
    Member Account
  </p>


  <!-- TABS -->

  <div class="tabs">

    <button class="tab active" id="loginTab">
      🔐 Login
    </button>

    <button class="tab" id="signupTab">
      👤 Signup
    </button>

  </div>


  <!-- LOGIN -->

  <div class="form active" id="loginForm">

    <label>Email</label>

    <input
      type="email"
      id="loginEmail"
      placeholder="Enter your email"
      autocomplete="email"
    >

    <label>Password</label>

    <input
      type="password"
      id="loginPassword"
      placeholder="Enter your password"
      autocomplete="current-password"
    >

    <button class="main-btn" id="loginBtn">
      Login
    </button>

    <button class="link-btn" id="forgotBtn">
      Forgot Password?
    </button>

  </div>


  <!-- SIGNUP -->

  <div class="form" id="signupForm">

    <label>Full Name</label>

    <input
      type="text"
      id="signupName"
      placeholder="Enter your full name"
      autocomplete="name"
    >

    <label>Email</label>

    <input
      type="email"
      id="signupEmail"
      placeholder="Enter your email"
      autocomplete="email"
    >

    <label>Password</label>

    <input
      type="password"
      id="signupPassword"
      placeholder="Minimum 6 characters"
      autocomplete="new-password"
    >

    <label>Confirm Password</label>

    <input
      type="password"
      id="signupConfirm"
      placeholder="Re-enter password"
      autocomplete="new-password"
    >

    <button class="main-btn" id="signupBtn">
      Create Member Account
    </button>

  </div>


  <div id="message" class="message"></div>


  <a class="back" href="index.html">
    ← Back to Website
  </a>

  <p class="small">
    Maa Basuli Uda Jatra Committee<br>
    Thakurmunda, Mayurbhanj, Odisha
  </p>

</div>


<script>

/* =====================================================
   SUPABASE CONFIGURATION
   ===================================================== */

const SUPABASE_URL = "https://supabase.com/dashboard/project/ynymqntcawobcfccoekb/settings/api-keys";

const SUPABASE_ANON_KEY = "sb_publishable_VyaVcI_yPlsg0aTfd5ZpUQ_t--2_Nov";


const { createClient } = supabase;

const supabaseClient = createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =====================================================
   ELEMENTS
   ===================================================== */

const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");

const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");

const message = document.getElementById("message");


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(text, type){

  message.textContent = text;

  message.className = "message " + type;

}


/* =====================================================
   TABS
   ===================================================== */

loginTab.addEventListener("click", () => {

  loginTab.classList.add("active");
  signupTab.classList.remove("active");

  loginForm.classList.add("active");
  signupForm.classList.remove("active");

  message.className = "message";

});


signupTab.addEventListener("click", () => {

  signupTab.classList.add("active");
  loginTab.classList.remove("active");

  signupForm.classList.add("active");
  loginForm.classList.remove("active");

  message.className = "message";

});


/* =====================================================
   SIGNUP
   ===================================================== */

document.getElementById("signupBtn").addEventListener("click", async () => {

  const name =
    document.getElementById("signupName").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  const confirmPassword =
    document.getElementById("signupConfirm").value;


  if(!name || !email || !password || !confirmPassword){

    showMessage(
      "Please fill all required fields.",
      "error"
    );

    return;
  }


  if(password.length < 6){

    showMessage(
      "Password must be at least 6 characters.",
      "error"
    );

    return;
  }


  if(password !== confirmPassword){

    showMessage(
      "Password and Confirm Password do not match.",
      "error"
    );

    return;
  }


  showMessage(
    "Creating your account...",
    "success"
  );


  const { data, error } =
    await supabaseClient.auth.signUp({

      email: email,

      password: password,

      options: {
        data: {
          full_name: name
        }
      }

    });


  if(error){

    showMessage(
      error.message,
      "error"
    );

    return;
  }


  if(data.user){

    if(data.session){

      showMessage(
        "Account created successfully. Please complete your profile.",
        "success"
      );

      setTimeout(() => {
        window.location.href = "profile.html";
      }, 1500);

    }else{

      showMessage(
        "Account created. Please check your email and confirm your account before login.",
        "success"
      );

    }

  }

});


/* =====================================================
   LOGIN
   ===================================================== */

document.getElementById("loginBtn").addEventListener("click", async () => {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;


  if(!email || !password){

    showMessage(
      "Please enter email and password.",
      "error"
    );

    return;
  }


  showMessage(
    "Logging in...",
    "success"
  );


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if(error){

    showMessage(
      error.message,
      "error"
    );

    return;
  }


  if(data.user){

    showMessage(
      "Login successful. Opening your profile...",
      "success"
    );


    setTimeout(() => {

      window.location.href = "profile.html";

    }, 1000);

  }

});


/* =====================================================
   FORGOT PASSWORD
   ===================================================== */

document.getElementById("forgotBtn").addEventListener("click", async () => {

  const email =
    document.getElementById("loginEmail").value.trim();


  if(!email){

    showMessage(
      "First enter your email address.",
      "error"
    );

    return;
  }


  const { error } =
    await supabaseClient.auth.resetPasswordForEmail(
      email,
      {
        redirectTo:
          window.location.origin +
          window.location.pathname
      }
    );


  if(error){

    showMessage(
      error.message,
      "error"
    );

    return;
  }


  showMessage(
    "Password reset link has been sent to your email.",
    "success"
  );

});

</script>

</body>
</html>
