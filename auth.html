<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Maa Basuli Uda Jatra Committee</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#f5f6f8;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:450px;
  background:white;
  border-radius:18px;
  padding:30px;
  box-shadow:0 8px 30px rgba(0,0,0,.10);
}

.logo{
  text-align:center;
  margin-bottom:25px;
}

.logo h1{
  color:#7b1e1e;
  font-size:23px;
}

.logo p{
  color:#777;
  font-size:13px;
  margin-top:6px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:20px;
}

.tab{
  padding:11px;
  border:1px solid #ddd;
  border-radius:8px;
  background:#f5f5f5;
  cursor:pointer;
  font-weight:bold;
}

.tab.active{
  background:#7b1e1e;
  color:white;
  border-color:#7b1e1e;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #d5d5d5;
  border-radius:9px;
  font-size:14px;
  margin-bottom:15px;
}

input:focus{
  outline:none;
  border-color:#7b1e1e;
}

.btn{
  width:100%;
  padding:13px;
  border:none;
  border-radius:9px;
  background:#7b1e1e;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.link{
  text-align:center;
  margin-top:15px;
}

.link button{
  border:none;
  background:none;
  color:#7b1e1e;
  font-weight:bold;
  cursor:pointer;
}

.message{
  display:none;
  padding:12px;
  border-radius:9px;
  margin-bottom:15px;
  font-size:13px;
  line-height:1.5;
  font-weight:bold;
}

.success{
  display:block;
  background:#e8f7ed;
  color:#176b35;
}

.error{
  display:block;
  background:#fdeaea;
  color:#a51d1d;
}

.signup-only{
  display:none;
}

.home{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#7b1e1e;
  text-decoration:none;
  font-size:13px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">
    <h1>ମା' ବାସୁଳୀ ଉଡା ଯାତ୍ରା କମିଟି</h1>
    <p>Maa Basuli Uda Jatra Committee, Thakurmunda</p>
  </div>


  <div class="tabs">

    <button
      type="button"
      id="memberTab"
      class="tab active">
      Member Login
    </button>

    <button
      type="button"
      id="adminTab"
      class="tab">
      Super Admin
    </button>

  </div>


  <div
    id="message"
    class="message">
  </div>


  <form id="loginForm">

    <label>Email</label>

    <input
      id="email"
      type="email"
      placeholder="Enter email"
      required
    >


    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Enter password"
      required
    >


    <button
      id="loginButton"
      class="btn"
      type="submit">
      Member Login
    </button>

  </form>


  <div
    id="signupArea"
    class="signup-only">

    <div class="link">
      New Member?
      <button
        type="button"
        id="signupButton">
        Create Account
      </button>
    </div>

  </div>


  <div class="link">

    <button
      type="button"
      id="forgotButton">
      Forgot Password?
    </button>

  </div>


  <a
    href="index.html"
    class="home">
    ← Back to Website
  </a>

</div>


<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://ynymqntcawobcfccoekb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_VyaVcI_yPlsg0aTfd5ZpUQ_t--2_Nov";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   VARIABLES
   ===================================================== */

let loginMode = "member";


/* =====================================================
   ELEMENTS
   ===================================================== */

const memberTab =
  document.getElementById("memberTab");

const adminTab =
  document.getElementById("adminTab");

const loginButton =
  document.getElementById("loginButton");

const signupArea =
  document.getElementById("signupArea");

const messageBox =
  document.getElementById("message");

const loginForm =
  document.getElementById("loginForm");


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(text,type){

  messageBox.className =
    "message " + type;

  messageBox.textContent =
    text;

  messageBox.style.display =
    "block";
}


function clearMessage(){

  messageBox.className =
    "message";

  messageBox.textContent =
    "";

  messageBox.style.display =
    "none";
}


/* =====================================================
   MEMBER MODE
   ===================================================== */

memberTab.addEventListener(
  "click",
  function(){

    loginMode = "member";

    memberTab.classList.add("active");
    adminTab.classList.remove("active");

    loginButton.textContent =
      "Member Login";

    signupArea.style.display =
      "block";

    clearMessage();
  }
);


/* =====================================================
   SUPER ADMIN MODE
   ===================================================== */

adminTab.addEventListener(
  "click",
  function(){

    loginMode = "admin";

    adminTab.classList.add("active");
    memberTab.classList.remove("active");

    loginButton.textContent =
      "Super Admin Login";

    signupArea.style.display =
      "none";

    clearMessage();
  }
);


/* =====================================================
   GET USER ROLE
   ===================================================== */

async function getUserRole(userId){

  const result =
    await supabaseClient
      .from("user_roles")
      .select("role")
      .eq(
        "user_id",
        userId
      )
      .maybeSingle();


  if(result.error){

    throw result.error;
  }


  return result.data?.role ||
    "member";
}


/* =====================================================
   LOGIN
   ===================================================== */

loginForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    clearMessage();

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;


    loginButton.disabled =
      true;

    loginButton.textContent =
      "Logging in...";


    try{

      const result =
        await supabaseClient
          .auth
          .signInWithPassword({
            email:email,
            password:password
          });


      if(result.error){

        throw result.error;
      }


      const user =
        result.data.user;


      if(!user){

        throw new Error(
          "Login session create heiparilani."
        );
      }


      const role =
        await getUserRole(
          user.id
        );


      /*
        SUPER ADMIN
      */

      if(role === "super_admin"){

        window.location.replace(
          "super-admin.html"
        );

        return;
      }


      /*
        ADMIN
      */

      if(role === "admin"){

        window.location.replace(
          "admin.html"
        );

        return;
      }


      /*
        MEMBER
      */

      window.location.replace(
        "profile.html"
      );


    }catch(error){

      console.error(
        "LOGIN ERROR:",
        error
      );


      let text =
        error.message ||
        "Login failed.";


      if(
        text.toLowerCase()
          .includes("invalid login")
      ){

        text =
          "Email ba password wrong achhi.";
      }


      showMessage(
        "❌ " + text,
        "error"
      );


    }finally{

      loginButton.disabled =
        false;

      loginButton.textContent =
        loginMode === "admin"
          ? "Super Admin Login"
          : "Member Login";
    }

  }
);


/* =====================================================
   SIGNUP
   ===================================================== */

document.getElementById(
  "signupButton"
).addEventListener(
  "click",
  function(){

    window.location.href =
      "signup.html";

  }
);


/* =====================================================
   FORGOT PASSWORD
   ===================================================== */

document.getElementById(
  "forgotButton"
).addEventListener(
  "click",
  async function(){

    const email =
      document
        .getElementById("email")
        .value
        .trim();


    if(!email){

      showMessage(
        "Prathame email address enter karantu.",
        "error"
      );

      return;
    }


    try{

      const result =
        await supabaseClient
          .auth
          .resetPasswordForEmail(
            email,
            {
              redirectTo:
                window.location.origin +
                window.location.pathname
                  .replace(
                    "auth.html",
                    "reset-password.html"
                  )
            }
          );


      if(result.error){

        throw result.error;
      }


      showMessage(
        "✅ Password reset link email ku patha jaichi.",
        "success"
      );


    }catch(error){

      showMessage(
        "❌ " +
        (
          error.message ||
          "Password reset failed."
        ),
        "error"
      );
    }

  }
);


/* =====================================================
   EXISTING SESSION CHECK
   ===================================================== */

async function checkExistingSession(){

  try{

    const result =
      await supabaseClient
        .auth
        .getSession();


    if(result.error){

      return;
    }


    const session =
      result.data.session;


    if(!session){

      return;
    }


    const role =
      await getUserRole(
        session.user.id
      );


    if(role === "super_admin"){

      window.location.replace(
        "super-admin.html"
      );

      return;
    }


    if(role === "admin"){

      window.location.replace(
        "admin.html"
      );

      return;
    }


    window.location.replace(
      "profile.html"
    );


  }catch(error){

    console.error(
      "SESSION CHECK ERROR:",
      error
    );
  }
}


/* =====================================================
   START
   ===================================================== */

checkExistingSession();

</script>

</body>
</html>
