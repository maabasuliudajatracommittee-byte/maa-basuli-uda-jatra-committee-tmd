<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login / Signup - Maa Basuli Uda Jatra Committee</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(135deg,#fff7ed,#fef3c7,#ffffff);
      min-height:100vh;
      color:#1f2937;
    }

    .top{
      background:#7c2d12;
      color:white;
      padding:16px 20px;
      text-align:center;
    }

    .top h1{
      font-size:24px;
      margin-bottom:5px;
    }

    .top p{
      font-size:14px;
      opacity:.9;
    }

    .container{
      width:min(460px,92%);
      margin:40px auto;
    }

    .card{
      background:white;
      border-radius:18px;
      padding:28px;
      box-shadow:0 10px 35px rgba(0,0,0,.12);
    }

    .tabs{
      display:flex;
      gap:8px;
      margin-bottom:24px;
    }

    .tab{
      flex:1;
      padding:12px;
      border:0;
      border-radius:10px;
      cursor:pointer;
      background:#f3f4f6;
      font-weight:bold;
    }

    .tab.active{
      background:#9a3412;
      color:white;
    }

    h2{
      text-align:center;
      margin-bottom:20px;
      color:#7c2d12;
    }

    label{
      display:block;
      margin:14px 0 6px;
      font-weight:bold;
      font-size:14px;
    }

    input{
      width:100%;
      padding:13px;
      border:1px solid #d1d5db;
      border-radius:9px;
      font-size:15px;
      outline:none;
    }

    input:focus{
      border-color:#9a3412;
      box-shadow:0 0 0 3px rgba(154,52,18,.1);
    }

    .main-btn{
      width:100%;
      margin-top:20px;
      padding:14px;
      border:0;
      border-radius:10px;
      background:#9a3412;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .main-btn:hover{
      background:#7c2d12;
    }

    .forgot{
      display:block;
      text-align:right;
      margin-top:10px;
      color:#9a3412;
      cursor:pointer;
      font-size:14px;
    }

    .message{
      margin-top:16px;
      padding:12px;
      border-radius:8px;
      display:none;
      font-size:14px;
      line-height:1.5;
    }

    .success{
      background:#dcfce7;
      color:#166534;
    }

    .error{
      background:#fee2e2;
      color:#991b1b;
    }

    .info{
      background:#dbeafe;
      color:#1e40af;
    }

    .hidden{
      display:none;
    }

    .back{
      text-align:center;
      margin-top:20px;
    }

    .back a{
      color:#9a3412;
      text-decoration:none;
      font-weight:bold;
    }

    .note{
      margin-top:18px;
      padding:12px;
      background:#fff7ed;
      border-left:4px solid #ea580c;
      font-size:13px;
      line-height:1.5;
      border-radius:6px;
    }
  </style>
</head>

<body>

<div class="top">
  <h1>ମା' ବାସୁଳୀ ଉଡ଼ା ଯାତ୍ରା କମିଟି</h1>
  <p>Maa Basuli Uda Jatra Committee, Thakurmunda</p>
</div>

<div class="container">

  <div class="card">

    <div class="tabs">
      <button class="tab active" id="loginTab" onclick="showLogin()">
        Login
      </button>

      <button class="tab" id="signupTab" onclick="showSignup()">
        Signup
      </button>
    </div>

    <!-- LOGIN -->
    <div id="loginBox">

      <h2>Member Login</h2>

      <label>Email or Mobile Number</label>
      <input
        type="text"
        id="loginEmail"
        placeholder="Enter email or mobile number"
        autocomplete="username"
      >

      <label>Password</label>
      <input
        type="password"
        id="loginPassword"
        placeholder="Enter your password"
        autocomplete="current-password"
      >

      <span class="forgot" onclick="forgotPassword()">
        Forgot Password?
      </span>

      <button class="main-btn" onclick="loginUser()">
        Login
      </button>

    </div>


    <!-- SIGNUP -->
    <div id="signupBox" class="hidden">

      <h2>Create Member Account</h2>

      <label>Mobile Number</label>
      <input
        type="tel"
        id="signupMobile"
        placeholder="Enter 10-digit mobile number"
        inputmode="numeric"
        maxlength="10"
        autocomplete="tel"
      >

      <label>Email</label>
      <input
        type="email"
        id="signupEmail"
        placeholder="Enter email"
        autocomplete="email"
      >

      <label>Password</label>
      <input
        type="password"
        id="signupPassword"
        placeholder="Create password"
        autocomplete="new-password"
      >

      <label>Confirm Password</label>
      <input
        type="password"
        id="signupConfirm"
        placeholder="Confirm password"
        autocomplete="new-password"
      >

      <button class="main-btn" onclick="signupUser()">
        Create Account
      </button>

      <div class="note">
        Signup pare apanka account <b>Super Admin approval</b> pain pending rahiba.
        Approval pare automatic Member ID generate heba.
      </div>

    </div>

    <div id="message" class="message"></div>

    <div class="back">
      <a href="index.html">← Back to Website</a>
    </div>

  </div>

</div>


<script>

  const SUPABASE_URL =
    "https://ynymqntcawobcfccoekb.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_VyaVcI_yPlsg0aTfd5ZpUQ_t--2_Nov";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================
     MESSAGE
  ========================= */

  function showMessage(text, type="info"){
    const box = document.getElementById("message");

    box.textContent = text;
    box.className = "message " + type;
    box.style.display = "block";
  }


  function hideMessage(){
    const box = document.getElementById("message");
    box.style.display = "none";
  }


  /* =========================
     TABS
  ========================= */

  function showLogin(){

    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("signupBox").classList.add("hidden");

    document.getElementById("loginTab").classList.add("active");
    document.getElementById("signupTab").classList.remove("active");

    hideMessage();
  }


  function showSignup(){

    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("signupBox").classList.remove("hidden");

    document.getElementById("loginTab").classList.remove("active");
    document.getElementById("signupTab").classList.add("active");

    hideMessage();
  }


  /* =========================
     ROLE REDIRECT
  ========================= */

  async function redirectByRole(){

    const {
      data: { user },
      error: sessionError
    } = await supabaseClient.auth.getUser();

    if(sessionError || !user){
      showMessage(
        "Login session milila nahi. Punithare login karantu.",
        "error"
      );
      return;
    }


    const {
      data: roleData,
      error: roleError
    } = await supabaseClient
      .from("user_roles")
      .select("role")
      .eq("user_id", user.id)
      .maybeSingle();


    if(roleError){

      console.error(roleError);

      showMessage(
        "User role check karibare problem hela. Punithare try karantu.",
        "error"
      );

      return;
    }


    const role = roleData?.role || "member";


    /* SUPER ADMIN */
    if(role === "super_admin"){

      window.location.replace("super-admin.html");
      return;
    }


    /* ADMIN */
    if(role === "admin"){

      window.location.replace("admin.html");
      return;
    }


    /* MEMBER */

    window.location.replace("profile.html");
  }


  /* =========================
     LOGIN
  ========================= */

  async function loginUser(){

    hideMessage();

    const identifier =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;


    if(!identifier || !password){

      showMessage(
        "Email/Mobile ebam Password duita fill karantu.",
        "error"
      );

      return;
    }


    showMessage("Login heuchhi...", "info");


    let loginEmail = identifier;

    if(!identifier.includes("@")){
      const mobile = identifier.replace(/\D/g, "");

      if(!/^\d{10}$/.test(mobile)){
        showMessage(
          "Valid 10-digit mobile number enter karantu.",
          "error"
        );
        return;
      }

      const {
        data: profileRow,
        error: profileError
      } = await supabaseClient
        .from("member_profiles")
        .select("email")
        .eq("mobile", mobile)
        .maybeSingle();

      if(profileError || !profileRow?.email){
        showMessage(
          "Ehi mobile number ra account milila nahi.",
          "error"
        );
        return;
      }

      loginEmail = profileRow.email;
    }

    const {
      data,
      error
    } = await supabaseClient.auth.signInWithPassword({
      email: loginEmail,
      password: password
    });


    if(error){

      console.error(error);

      showMessage(
        "Login failed: " + error.message,
        "error"
      );

      return;
    }


    if(!data.session){

      showMessage(
        "Login session create hela nahi. Punithare try karantu.",
        "error"
      );

      return;
    }


    showMessage(
      "Login successful. Dashboard ku neijauchhi...",
      "success"
    );


    setTimeout(() => {
      redirectByRole();
    }, 500);
  }


  /* =========================
     SIGNUP
  ========================= */

  async function signupUser(){

    hideMessage();

    const mobile =
      document.getElementById("signupMobile").value.trim();

    const email =
      document.getElementById("signupEmail").value.trim();

    const password =
      document.getElementById("signupPassword").value;

    const confirmPassword =
      document.getElementById("signupConfirm").value;

    if(!mobile || !email || !password || !confirmPassword){

      showMessage(
        "Mobile, Email ebam Password fields fill karantu.",
        "error"
      );

      return;
    }

    if(!/^\d{10}$/.test(mobile)){

      showMessage(
        "Valid 10-digit mobile number enter karantu.",
        "error"
      );

      return;
    }

    if(password.length < 6){

      showMessage(
        "Password minimum 6 characters heba darkar.",
        "error"
      );

      return;
    }

    if(password !== confirmPassword){

      showMessage(
        "Password ebam Confirm Password same nuhe.",
        "error"
      );

      return;
    }

    showMessage(
      "Account create heuchhi...",
      "info"
    );

    const {
      data,
      error
    } = await supabaseClient.auth.signUp({

      email: email,

      password: password,

      options: {
        data: {
          mobile: mobile
        }
      }

    });

    if(error){

      console.error(error);

      showMessage(
        "Signup failed: " + error.message,
        "error"
      );

      return;
    }

    /*
      Signup success.
      Database trigger automatically creates:
      1. member_profiles
      2. user_roles

      Member ID remains NULL until Admin/Super Admin approval.
    */

    if(data.user){

      const { error: profileError } = await supabaseClient
        .from("member_profiles")
        .update({
          mobile: mobile,
          approval_status: "pending",
          member_status: "inactive",
          member_id: null
        })
        .eq("id", data.user.id);

      if(profileError){
        console.error(profileError);
        showMessage(
          "Account create hela, kintu mobile save heiparila nahi. Admin ku contact karantu.",
          "error"
        );
        return;
      }
    }

    showMessage(
      "✅ Signup Successfully! Apananka account Super Admin/Admin approval pain pending achhi. Ebe Login tab ku jai Email ba Mobile Number ebam Password dei login karantu.",
      "success"
    );

    document.getElementById("signupPassword").value = "";
    document.getElementById("signupConfirm").value = "";
    document.getElementById("signupMobile").value = "";

    /*
      Signup pare automatic login/redirect karajiba nahi.
      User nijara ichhare Login tab ku jibe.
    */
  }


  /* =========================
     FORGOT PASSWORD
  ========================= */

  async function forgotPassword(){

    const email =
      document.getElementById("loginEmail").value.trim();


    if(!email){

      showMessage(
        "Password reset pain first email address enter karantu.",
        "error"
      );

      return;
    }


    showMessage(
      "Password reset email pathauchhi...",
      "info"
    );


    const redirectUrl =
      window.location.origin +
      window.location.pathname.replace(
        "auth.html",
        "reset-password.html"
      );


    const {
      error
    } = await supabaseClient.auth.resetPasswordForEmail(
      email,
      {
        redirectTo: redirectUrl
      }
    );


    if(error){

      console.error(error);

      showMessage(
        "Password reset failed: " + error.message,
        "error"
      );

      return;
    }


    showMessage(
      "✅ Password reset link apanka email ku patha jaichi.",
      "success"
    );

  }


  /* =========================
     ALREADY LOGGED IN
  ========================= */

  async function checkExistingSession(){

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();


    if(session){

      showMessage(
        "Apana already login achhanti. Dashboard ku neijauchhi...",
        "info"
      );

      setTimeout(() => {
        redirectByRole();
      }, 700);

    }

  }


  checkExistingSession();

</script>

</body>
</html>
