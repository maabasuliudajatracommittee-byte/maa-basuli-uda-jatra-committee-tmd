<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Audit Logs - Maa Basuli Uda Jatra Committee</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#222;
}

header{
  background:#7b1e1e;
  color:#fff;
  padding:16px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
}

header h1{
  margin:0;
  font-size:21px;
}

header p{
  margin:5px 0 0;
  font-size:13px;
  opacity:.9;
}

.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:7px;
  padding:9px 13px;
  cursor:pointer;
  font-weight:600;
}

.btn-light{
  background:#fff;
  color:#7b1e1e;
}

.btn-primary{
  background:#7b1e1e;
  color:#fff;
}

.btn-secondary{
  background:#6c757d;
  color:#fff;
}

.btn-danger{
  background:#dc3545;
  color:#fff;
}

.container{
  max-width:1450px;
  margin:22px auto;
  padding:0 16px;
}

.message{
  display:none;
  padding:12px 15px;
  border-radius:8px;
  margin-bottom:15px;
  font-weight:600;
}

.message.success{
  display:block;
  background:#d1e7dd;
  color:#0f5132;
}

.message.error{
  display:block;
  background:#f8d7da;
  color:#842029;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:14px;
  margin-bottom:20px;
}

.stat-card{
  background:#fff;
  border-radius:10px;
  padding:18px;
  box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.stat-card h3{
  margin:0 0 8px;
  font-size:14px;
  color:#666;
}

.stat-card strong{
  font-size:26px;
  color:#7b1e1e;
}

.card{
  background:#fff;
  border-radius:10px;
  padding:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.07);
  margin-bottom:20px;
}

.card h2{
  margin:0 0 16px;
  color:#7b1e1e;
  font-size:20px;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.toolbar input,
.toolbar select{
  padding:10px 11px;
  border:1px solid #ccd2da;
  border-radius:7px;
  font-size:14px;
  outline:none;
}

.toolbar input{
  min-width:280px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1250px;
}

th,
td{
  border-bottom:1px solid #e5e7eb;
  padding:11px 9px;
  text-align:left;
  vertical-align:top;
  font-size:13px;
}

th{
  background:#f1f3f5;
  color:#333;
  white-space:nowrap;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}

.badge-action{
  background:#e7f1ff;
  color:#084298;
}

.badge-module{
  background:#fff3cd;
  color:#664d03;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}

.loading{
  text-align:center;
  padding:30px;
  color:#666;
}

.info-box{
  background:#f8f9fa;
  border-left:4px solid #7b1e1e;
  padding:12px 15px;
  margin-bottom:15px;
  color:#555;
  font-size:13px;
  line-height:1.6;
}

@media(max-width:700px){

  .toolbar input{
    min-width:100%;
  }

  header{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<header>

  <div>
    <h1>Audit Logs</h1>
    <p>Maa Basuli Uda Jatra Committee</p>
  </div>

  <div class="top-actions">

    <button
      class="btn-light"
      onclick="goDashboard()">
      Dashboard
    </button>

    <button
      class="btn-light"
      onclick="loadLogs()">
      Refresh
    </button>

    <button
      class="btn-light"
      onclick="logout()">
      Logout
    </button>

  </div>

</header>


<div class="container">

  <div id="messageBox" class="message"></div>


  <div class="stats">

    <div class="stat-card">
      <h3>Total Audit Logs</h3>
      <strong id="totalCount">0</strong>
    </div>

    <div class="stat-card">
      <h3>Today</h3>
      <strong id="todayCount">0</strong>
    </div>

    <div class="stat-card">
      <h3>Modules</h3>
      <strong id="moduleCount">0</strong>
    </div>

    <div class="stat-card">
      <h3>Actions</h3>
      <strong id="actionCount">0</strong>
    </div>

  </div>


  <div class="card">

    <h2>System Audit Trail</h2>

    <div class="info-box">
      Audit Logs record important administrative activities performed
      in the Maa Basuli Uda Jatra Committee system.
    </div>


    <div class="toolbar">

      <input
        type="text"
        id="searchBox"
        placeholder="Search action, module, description..."
        oninput="renderLogs()"
      >

      <select
        id="moduleFilter"
        onchange="renderLogs()">

        <option value="">
          All Modules
        </option>

      </select>


      <select
        id="actionFilter"
        onchange="renderLogs()">

        <option value="">
          All Actions
        </option>

      </select>

    </div>


    <div id="tableContainer">

      <div class="loading">
        Loading audit logs...
      </div>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://ynymqntcawobcfccoekb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_VyaVcI_yPlsg0aTfd5ZpUQ_t--2_Nov";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let logs = [];


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  type = "success"
){

  const box =
    document.getElementById(
      "messageBox"
    );

  box.textContent = text;

  box.className =
    "message " + type;


  setTimeout(() => {

    box.className =
      "message";

    box.textContent =
      "";

  },4000);
}


/* =========================
   SESSION
========================= */

async function checkSession(){

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if(error){

    console.error(error);

    window.location.href =
      "auth.html";

    return false;
  }


  if(!data.session){

    window.location.href =
      "auth.html";

    return false;
  }


  return true;
}


/* =========================
   LOAD LOGS
========================= */

async function loadLogs(){

  const container =
    document.getElementById(
      "tableContainer"
    );


  container.innerHTML =
    '<div class="loading">Loading audit logs...</div>';


  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/audit_logs" +
        "?select=*" +
        "&order=created_at.desc",

        {

          headers:{
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY
          }

        }

      );


    if(!response.ok){

      const errorText =
        await response.text();


      console.error(
        errorText
      );


      container.innerHTML =
        '<div class="empty">Unable to load audit logs.</div>';


      showMessage(
        "Load failed: " +
        errorText,
        "error"
      );


      return;
    }


    logs =
      await response.json();


    updateStats();

    populateFilters();

    renderLogs();


  }catch(error){

    console.error(error);


    container.innerHTML =
      '<div class="empty">Connection error.</div>';


    showMessage(
      "Connection error while loading audit logs.",
      "error"
    );

  }

}


/* =========================
   STATS
========================= */

function updateStats(){

  document.getElementById(
    "totalCount"
  ).textContent =
    logs.length;


  const today =
    new Date()
      .toISOString()
      .slice(0,10);


  const todayLogs =
    logs.filter(item => {

      if(!item.created_at){
        return false;
      }

      return item.created_at
        .slice(0,10) === today;

    });


  document.getElementById(
    "todayCount"
  ).textContent =
    todayLogs.length;


  const modules =
    new Set(

      logs
        .map(item =>
          item.module
        )
        .filter(Boolean)

    );


  document.getElementById(
    "moduleCount"
  ).textContent =
    modules.size;


  const actions =
    new Set(

      logs
        .map(item =>
          item.action
        )
        .filter(Boolean)

    );


  document.getElementById(
    "actionCount"
  ).textContent =
    actions.size;

}


/* =========================
   FILTER OPTIONS
========================= */

function populateFilters(){

  const moduleFilter =
    document.getElementById(
      "moduleFilter"
    );


  const actionFilter =
    document.getElementById(
      "actionFilter"
    );


  const selectedModule =
    moduleFilter.value;


  const selectedAction =
    actionFilter.value;


  const modules =
    [
      ...new Set(

        logs
          .map(item =>
            item.module
          )
          .filter(Boolean)

      )
    ]
    .sort();


  const actions =
    [
      ...new Set(

        logs
          .map(item =>
            item.action
          )
          .filter(Boolean)

      )
    ]
    .sort();


  moduleFilter.innerHTML =
    '<option value="">All Modules</option>';


  modules.forEach(module => {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      module;

    option.textContent =
      module;

    moduleFilter.appendChild(
      option
    );

  });


  actionFilter.innerHTML =
    '<option value="">All Actions</option>';


  actions.forEach(action => {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      action;

    option.textContent =
      action;

    actionFilter.appendChild(
      option
    );

  });


  moduleFilter.value =
    selectedModule;


  actionFilter.value =
    selectedAction;

}


/* =========================
   RENDER LOGS
========================= */

function renderLogs(){

  const container =
    document.getElementById(
      "tableContainer"
    );


  const search =
    document.getElementById(
      "searchBox"
    )
    .value
    .trim()
    .toLowerCase();


  const module =
    document.getElementById(
      "moduleFilter"
    )
    .value;


  const action =
    document.getElementById(
      "actionFilter"
    )
    .value;


  const filtered =
    logs.filter(item => {


      const searchable = (

        (item.action || "") +
        " " +
        (item.module || "") +
        " " +
        (item.description || "") +
        " " +
        (item.ip_address || "") +
        " " +
        (item.user_agent || "")

      ).toLowerCase();


      const searchMatch =
        !search ||
        searchable.includes(
          search
        );


      const moduleMatch =
        !module ||
        item.module === module;


      const actionMatch =
        !action ||
        item.action === action;


      return (
        searchMatch &&
        moduleMatch &&
        actionMatch
      );

    });


  if(filtered.length === 0){

    container.innerHTML =
      '<div class="empty">No audit logs found.</div>';

    return;
  }


  let html = `

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>Date & Time</th>
            <th>Action</th>
            <th>Module</th>
            <th>User ID</th>
            <th>Record ID</th>
            <th>Description</th>
            <th>IP Address</th>
            <th>User Agent</th>

          </tr>

        </thead>

        <tbody>

  `;


  filtered.forEach(item => {


    const date =
      item.created_at
        ? new Date(
            item.created_at
          ).toLocaleString(
            "en-IN"
          )
        : "-";


    html += `

      <tr>

        <td>
          ${escapeHtml(date)}
        </td>


        <td>

          <span class="badge badge-action">
            ${escapeHtml(
              item.action || "-"
            )}
          </span>

        </td>


        <td>

          <span class="badge badge-module">
            ${escapeHtml(
              item.module || "-"
            )}
          </span>

        </td>


        <td>
          ${escapeHtml(
            item.user_id || "-"
          )}
        </td>


        <td>
          ${escapeHtml(
            item.record_id || "-"
          )}
        </td>


        <td>
          ${escapeHtml(
            item.description || "-"
          )}
        </td>


        <td>
          ${escapeHtml(
            item.ip_address || "-"
          )}
        </td>


        <td>
          ${escapeHtml(
            item.user_agent || "-"
          )}
        </td>

      </tr>

    `;

  });


  html += `

        </tbody>

      </table>

    </div>

  `;


  container.innerHTML =
    html;

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================
   DASHBOARD
========================= */

function goDashboard(){

  window.location.href =
    "super-admin.html";

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient
    .auth
    .signOut();


  window.location.href =
    "auth.html";

}


/* =========================
   START
========================= */

(async function(){

  const loggedIn =
    await checkSession();


  if(loggedIn){

    await loadLogs();

  }

})();

</script>

</body>
</html>
