<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Logs - Maa Basuli Uda Jatra Committee</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#222;
}
header{
    background:#7b1e1e;
    color:#fff;
    padding:16px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}
header h1{margin:0;font-size:21px}
header small{opacity:.9}
.top-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}
button{
    border:0;
    padding:10px 15px;
    border-radius:7px;
    cursor:pointer;
    font-weight:600;
}
.btn-light{background:#fff;color:#7b1e1e}
.btn-danger{background:#dc3545;color:#fff}
.btn-secondary{background:#6c757d;color:#fff}

.container{
    max-width:1250px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
    color:#7b1e1e;
    font-size:20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:#fff;
    padding:18px;
    border-radius:10px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.stat h3{
    margin:0 0 8px;
    font-size:14px;
    color:#666;
}

.stat strong{
    font-size:27px;
    color:#7b1e1e;
}

.filters{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    gap:10px;
    margin-bottom:18px;
}

input,select{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:14px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1100px;
}

th,td{
    padding:11px;
    border-bottom:1px solid #eee;
    text-align:left;
    vertical-align:top;
}

th{
    background:#f3f3f3;
    color:#555;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
}

.badge-blue{
    background:#cfe2ff;
    color:#084298;
}

.badge-green{
    background:#d1e7dd;
    color:#0f5132;
}

.badge-yellow{
    background:#fff3cd;
    color:#664d03;
}

.badge-red{
    background:#f8d7da;
    color:#842029;
}

.message{
    padding:12px;
    border-radius:7px;
    margin-bottom:15px;
    display:none;
}

.success{
    background:#d1e7dd;
    color:#0f5132;
}

.error{
    background:#f8d7da;
    color:#842029;
}

#loading{
    text-align:center;
    padding:20px;
    color:#777;
}

.hidden{
    display:none!important;
}

.description{
    max-width:350px;
    white-space:normal;
    word-break:break-word;
}

@media(max-width:900px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .filters{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:550px){
    .stats{
        grid-template-columns:1fr;
    }

    .filters{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:17px;
    }
}
</style>
</head>

<body>

<header>
    <div>
        <h1>📝 Audit Logs</h1>
        <small>Maa Basuli Uda Jatra Committee</small>
    </div>

    <div class="top-actions">
        <button class="btn-light" onclick="goDashboard()">Dashboard</button>
        <button class="btn-light" onclick="loadLogs()">Refresh</button>
        <button class="btn-danger" onclick="logout()">Logout</button>
    </div>
</header>

<div class="container">

    <div id="messageBox" class="message"></div>

    <div class="stats">

        <div class="stat">
            <h3>Total Logs</h3>
            <strong id="totalCount">0</strong>
        </div>

        <div class="stat">
            <h3>Today</h3>
            <strong id="todayCount">0</strong>
        </div>

        <div class="stat">
            <h3>Modules</h3>
            <strong id="moduleCount">0</strong>
        </div>

        <div class="stat">
            <h3>Actions</h3>
            <strong id="actionCount">0</strong>
        </div>

    </div>

    <div class="card">

        <h2>🔎 Audit Log Records</h2>

        <div class="filters">

            <input
                type="text"
                id="searchInput"
                placeholder="Search action, module, description..."
                oninput="renderLogs()"
            >

            <select
                id="moduleFilter"
                onchange="renderLogs()"
            >
                <option value="">All Modules</option>
            </select>

            <select
                id="actionFilter"
                onchange="renderLogs()"
            >
                <option value="">All Actions</option>
            </select>

            <input
                type="date"
                id="dateFilter"
                onchange="renderLogs()"
            >

        </div>

        <div id="loading">
            Loading audit logs...
        </div>

        <div class="table-wrap">

            <table id="logsTable" class="hidden">

                <thead>
                    <tr>
                        <th>Sl.</th>
                        <th>Date & Time</th>
                        <th>User ID</th>
                        <th>Action</th>
                        <th>Module</th>
                        <th>Record ID</th>
                        <th>Description</th>
                        <th>IP Address</th>
                        <th>User Agent</th>
                    </tr>
                </thead>

                <tbody id="logsBody"></tbody>

            </table>

        </div>

    </div>

</div>

<script>

const SUPABASE_URL =
"https://ynymqntcawobcfccoekb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VyaVcI_yPlsg0aTfd5ZpUQ_t--2_Nov";

let currentUser = null;
let logs = [];

function apiHeaders(){

    const token =
        localStorage.getItem("supabase_access_token");

    return {
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+token,
        "Content-Type":"application/json"
    };
}

async function getSessionUser(){

    const token =
        localStorage.getItem("supabase_access_token");

    if(!token){

        location.href="login.html";
        return null;
    }

    const res=await fetch(
        SUPABASE_URL+"/auth/v1/user",
        {
            headers:{
                "apikey":SUPABASE_KEY,
                "Authorization":"Bearer "+token
            }
        }
    );

    if(!res.ok){

        localStorage.removeItem(
            "supabase_access_token"
        );

        localStorage.removeItem(
            "supabase_refresh_token"
        );

        location.href="login.html";

        return null;
    }

    return await res.json();
}

function showMessage(text,type="success"){

    const box=
        document.getElementById("messageBox");

    box.textContent=text;

    box.className=
        "message "+type;

    box.style.display="block";

    setTimeout(()=>{
        box.style.display="none";
    },4000);
}

function goDashboard(){

    location.href="super-admin.html";
}

async function logout(){

    const token=
        localStorage.getItem(
            "supabase_access_token"
        );

    try{

        if(token){

            await fetch(
                SUPABASE_URL+"/auth/v1/logout",
                {
                    method:"POST",
                    headers:apiHeaders()
                }
            );

        }

    }catch(e){}

    localStorage.removeItem(
        "supabase_access_token"
    );

    localStorage.removeItem(
        "supabase_refresh_token"
    );

    location.href="login.html";
}

async function loadLogs(){

    document
        .getElementById("loading")
        .classList
        .remove("hidden");

    document
        .getElementById("logsTable")
        .classList
        .add("hidden");

    const res=await fetch(
        SUPABASE_URL+
        "/rest/v1/audit_logs"+
        "?select=*"+
        "&order=created_at.desc",
        {
            headers:apiHeaders()
        }
    );

    if(!res.ok){

        const err=await res.text();

        console.error(err);

        document.getElementById("loading").textContent=
            "Unable to load audit logs.";

        showMessage(
            "Audit logs load failed.",
            "error"
        );

        return;
    }

    logs=await res.json();

    updateStats();
    populateFilters();
    renderLogs();

    document
        .getElementById("loading")
        .classList
        .add("hidden");

    document
        .getElementById("logsTable")
        .classList
        .remove("hidden");
}

function updateStats(){

    document.getElementById("totalCount")
        .textContent=logs.length;

    const today=
        new Date()
        .toISOString()
        .slice(0,10);

    const todayLogs=
        logs.filter(log=>
            String(log.created_at||"")
            .startsWith(today)
        );

    document.getElementById("todayCount")
        .textContent=todayLogs.length;

    const modules=
        new Set(
            logs
            .map(x=>x.module)
            .filter(Boolean)
        );

    const actions=
        new Set(
            logs
            .map(x=>x.action)
            .filter(Boolean)
        );

    document.getElementById("moduleCount")
        .textContent=modules.size;

    document.getElementById("actionCount")
        .textContent=actions.size;
}

function populateFilters(){

    const moduleSelect=
        document.getElementById("moduleFilter");

    const actionSelect=
        document.getElementById("actionFilter");

    const currentModule=
        moduleSelect.value;

    const currentAction=
        actionSelect.value;

    const modules=[
        ...new Set(
            logs
            .map(x=>x.module)
            .filter(Boolean)
        )
    ].sort();

    const actions=[
        ...new Set(
            logs
            .map(x=>x.action)
            .filter(Boolean)
        )
    ].sort();

    moduleSelect.innerHTML=
        `<option value="">All Modules</option>`;

    modules.forEach(module=>{

        const option=
            document.createElement("option");

        option.value=module;
        option.textContent=module;

        moduleSelect.appendChild(option);

    });

    actionSelect.innerHTML=
        `<option value="">All Actions</option>`;

    actions.forEach(action=>{

        const option=
            document.createElement("option");

        option.value=action;
        option.textContent=action;

        actionSelect.appendChild(option);

    });

    moduleSelect.value=currentModule;
    actionSelect.value=currentAction;
}

function renderLogs(){

    const search=
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const moduleFilter=
        document
        .getElementById("moduleFilter")
        .value;

    const actionFilter=
        document
        .getElementById("actionFilter")
        .value;

    const dateFilter=
        document
        .getElementById("dateFilter")
        .value;

    const filtered=
        logs.filter(log=>{

            const text=(
                (log.action||"")+" "+
                (log.module||"")+" "+
                (log.description||"")+" "+
                (log.user_id||"")+" "+
                (log.record_id||"")+" "+
                (log.ip_address||"")+" "+
                (log.user_agent||"")
            ).toLowerCase();

            if(
                search &&
                !text.includes(search)
            ){
                return false;
            }

            if(
                moduleFilter &&
                log.module!==moduleFilter
            ){
                return false;
            }

            if(
                actionFilter &&
                log.action!==actionFilter
            ){
                return false;
            }

            if(
                dateFilter &&
                !String(log.created_at||"")
                .startsWith(dateFilter)
            ){
                return false;
            }

            return true;

        });

    const body=
        document.getElementById("logsBody");

    body.innerHTML="";

    if(filtered.length===0){

        body.innerHTML=`
            <tr>
                <td
                    colspan="9"
                    style="text-align:center;padding:25px"
                >
                    No audit logs found.
                </td>
            </tr>
        `;

        return;
    }

    filtered.forEach((log,index)=>{

        const tr=
            document.createElement("tr");

        tr.innerHTML=`

            <td>${index+1}</td>

            <td>
                ${formatDate(log.created_at)}
            </td>

            <td>
                <small>
                    ${escapeHtml(log.user_id||"-")}
                </small>
            </td>

            <td>
                <span class="badge badge-blue">
                    ${escapeHtml(log.action||"-")}
                </span>
            </td>

            <td>
                ${
                    log.module
                    ? `<span class="badge badge-green">
                        ${escapeHtml(log.module)}
                       </span>`
                    : "-"
                }
            </td>

            <td>
                <small>
                    ${escapeHtml(log.record_id||"-")}
                </small>
            </td>

            <td class="description">
                ${escapeHtml(log.description||"-")}
            </td>

            <td>
                ${escapeHtml(log.ip_address||"-")}
            </td>

            <td class="description">
                ${escapeHtml(log.user_agent||"-")}
            </td>

        `;

        body.appendChild(tr);

    });
}

function formatDate(value){

    if(!value)return "-";

    const date=new Date(value);

    return date.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

async function init(){

    currentUser=
        await getSessionUser();

    if(!currentUser)return;

    await loadLogs();
}

init();

</script>

</body>
</html>
