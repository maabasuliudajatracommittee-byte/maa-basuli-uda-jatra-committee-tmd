<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Member Profile | Maa Basuli Uda Jatra Committee</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ID Card Download Library -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      background:#f4f6f8;
      color:#1f2937;
    }

    header{
      background:#8f3215;
      color:white;
      padding:18px 20px;
      text-align:center;
    }

    header h1{
      font-size:23px;
      margin-bottom:5px;
    }

    header p{
      font-size:13px;
      opacity:.95;
    }

    .container{
      max-width:1000px;
      margin:auto;
      padding:20px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:20px;
    }

    .topbar h2{
      color:#7c2d12;
      font-size:24px;
    }

    button{
      border:0;
      border-radius:8px;
      padding:11px 16px;
      cursor:pointer;
      font-weight:bold;
    }

    .logout{
      background:#dc2626;
      color:white;
    }

    .card{
      background:white;
      border-radius:14px;
      padding:22px;
      margin-bottom:20px;
      box-shadow:0 3px 12px rgba(0,0,0,.08);
    }

    .card h3{
      color:#7c2d12;
      margin-bottom:18px;
    }

    .profile-photo-box{
      text-align:center;
      margin-bottom:20px;
    }

    .profile-photo{
      width:130px;
      height:130px;
      object-fit:cover;
      border-radius:50%;
      border:5px solid #f3e8df;
      background:#eee;
    }

    .photo-input{
      margin-top:12px;
    }

    .photo-input input{
      width:100%;
      max-width:350px;
    }

    .form-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:15px;
    }

    .field{
      display:flex;
      flex-direction:column;
    }

    .field label{
      font-weight:bold;
      font-size:13px;
      margin-bottom:7px;
    }

    .field input,
    .field select{
      padding:11px;
      border:1px solid #cbd5e1;
      border-radius:8px;
      font-size:14px;
      background:white;
    }

    .field input:disabled,
    .field select:disabled{
      background:#f1f5f9;
      color:#475569;
    }

    .save-btn{
      margin-top:18px;
      background:#8f3215;
      color:white;
      width:100%;
    }

    .message{
      padding:12px;
      border-radius:8px;
      margin-top:12px;
      display:none;
      font-size:14px;
    }

    .success{
      display:block;
      background:#dcfce7;
      color:#166534;
    }

    .error{
      display:block;
      background:#fee2e2;
      color:#991b1b;
    }

    .pending{
      display:block;
      background:#fef3c7;
      color:#92400e;
    }

    /* =========================
       DIGITAL ID CARD
    ========================= */

    .id-card-wrapper{
      display:flex;
      justify-content:center;
      margin-top:15px;
    }

    .id-card{
      width:430px;
      max-width:100%;
      min-height:270px;
      background:white;
      border:3px solid #8f3215;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 6px 18px rgba(0,0,0,.15);
    }

    .id-header{
      background:#8f3215;
      color:white;
      padding:14px;
      text-align:center;
    }

    .id-header h2{
      font-size:19px;
      margin-bottom:4px;
    }

    .id-header p{
      font-size:11px;
    }

    .id-body{
      display:flex;
      gap:15px;
      padding:18px;
      align-items:center;
    }

    .id-photo{
      width:105px;
      height:125px;
      object-fit:cover;
      border-radius:8px;
      border:2px solid #8f3215;
      background:#eee;
      flex-shrink:0;
    }

    .id-info{
      flex:1;
    }

    .id-name{
      font-size:19px;
      font-weight:bold;
      color:#7c2d12;
      margin-bottom:4px;
    }

    .id-designation{
      font-size:12px;
      font-weight:bold;
      color:#475569;
      margin-bottom:10px;
    }

    .id-row{
      display:flex;
      gap:7px;
      font-size:11px;
      margin-bottom:6px;
    }

    .id-row strong{
      min-width:72px;
    }

    .id-status{
      display:inline-block;
      padding:4px 9px;
      border-radius:20px;
      font-size:10px;
      font-weight:bold;
      margin-top:5px;
    }

    .active-status{
      background:#dcfce7;
      color:#166534;
    }

    .inactive-status{
      background:#fee2e2;
      color:#991b1b;
    }

    .id-footer{
      border-top:1px solid #e5e7eb;
      padding:8px 12px;
      text-align:center;
      font-size:9px;
      color:#64748b;
    }

    .qr-box{
      text-align:center;
      padding:0 15px 15px;
    }

    .qr-box img{
      width:105px;
      height:105px;
      border:1px solid #ddd;
      padding:4px;
      background:white;
    }

    .id-actions{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      margin-top:18px;
    }

    .download-btn{
      background:#15803d;
      color:white;
    }

    .print-btn{
      background:#1d4ed8;
      color:white;
    }

    .verify-btn{
      background:#475569;
      color:white;
    }

    .not-approved{
      text-align:center;
      padding:20px;
      background:#fff7ed;
      border-radius:10px;
      color:#9a3412;
    }

    .loading{
      text-align:center;
      padding:30px;
    }

    @media(max-width:700px){

      .form-grid{
        grid-template-columns:1fr;
      }

      .container{
        padding:12px;
      }

      .id-card{
        width:100%;
      }

      .id-body{
        gap:10px;
        padding:13px;
      }

      .id-photo{
        width:85px;
        height:105px;
      }

      .id-name{
        font-size:16px;
      }

      .id-row{
        font-size:10px;
      }

    }

    /* =========================
       PRINT
    ========================= */

    @media print{

      body{
        background:white;
      }

      header,
      .topbar,
      .profile-section,
      .id-actions,
      .not-approved,
      .message{
        display:none !important;
      }

      .container{
        padding:0;
        margin:0;
        max-width:none;
      }

      .card{
        box-shadow:none;
        padding:0;
        margin:0;
      }

      .id-card-wrapper{
        margin:0;
      }

      .id-card{
        box-shadow:none;
        width:430px;
        max-width:none;
      }

      .id-section h3{
        display:none;
      }

      @page{
        size:A4;
        margin:15mm;
      }

    }

  </style>
</head>

<body>

<header>

  <h1>ମା' ବାସୁଳୀ ଉଡ଼ା ଯାତ୍ରା କମିଟି</h1>

  <p>
    Maa Basuli Uda Jatra Committee, Thakurmunda
  </p>

</header>


<div class="container">

  <div class="topbar">

    <div>
      <h2>Member Profile</h2>
      <p id="loginEmail"></p>
    </div>

    <button
      class="logout"
      onclick="logout()">
      Logout
    </button>

  </div>


  <!-- PROFILE EDIT SECTION -->

  <div class="card profile-section">

    <h3>My Profile</h3>

    <div class="profile-photo-box">

      <img
        id="profilePhoto"
        class="profile-photo"
        src=""
        alt="Profile Photo">

      <div class="photo-input">

        <input
          type="file"
          id="photoInput"
          accept="image/*">

        <br><br>

        <button
          class="verify-btn"
          onclick="uploadPhoto()">
          Upload Profile Photo
        </button>

      </div>

    </div>


    <div class="form-grid">

      <div class="field">

        <label>Full Name</label>

        <input
          type="text"
          id="fullName">

      </div>


      <div class="field">

        <label>Email</label>

        <input
          type="email"
          id="email"
          disabled>

      </div>


      <div class="field">

        <label>Mobile Number</label>

        <input
          type="text"
          id="mobile"
          placeholder="Enter mobile number">

      </div>


      <div class="field">

        <label>Village</label>

        <input
          type="text"
          id="village"
          placeholder="Enter village">

      </div>


      <div class="field">

        <label>Address</label>

        <input
          type="text"
          id="address"
          placeholder="Enter address">

      </div>


      <div class="field">

        <label>Blood Group</label>

        <select id="bloodGroup">

          <option value="">Select Blood Group</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>

        </select>

      </div>


      <div class="field">

        <label>Member ID</label>

        <input
          type="text"
          id="memberId"
          disabled>

      </div>


      <div class="field">

        <label>Designation</label>

        <input
          type="text"
          id="designation"
          disabled>

      </div>


      <div class="field">

        <label>Member Status</label>

        <input
          type="text"
          id="memberStatus"
          disabled>

      </div>

    </div>


    <button
      class="save-btn"
      onclick="saveProfile()">
      Save Profile
    </button>

    <div
      id="profileMessage"
      class="message">
    </div>

  </div>


  <!-- DIGITAL ID CARD -->

  <div class="card id-section">

    <h3>Digital Member ID Card</h3>

    <div id="idCardArea">

      <div class="loading">
        Loading Member ID Card...
      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://ynymqntcawobcfccoekb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_VyaVcI_yPlsg0aTfd5ZpUQ_t--2_Nov";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;
let currentProfile = null;


/* =========================
   START
========================= */

document.addEventListener(
  "DOMContentLoaded",
  loadSession
);


/* =========================
   SESSION
========================= */

async function loadSession(){

  const {
    data:{
      session
    }
  } =
  await supabaseClient.auth.getSession();


  if(!session){

    window.location.href =
      "auth.html";

    return;
  }


  currentUser =
    session.user;


  document.getElementById(
    "loginEmail"
  ).textContent =
    currentUser.email || "";


  await loadProfile();

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("member_profiles")
    .select("*")
    .eq("id", currentUser.id)
    .maybeSingle();


  if(error){

    showMessage(
      "Unable to load profile: " +
      error.message,
      "error"
    );

    return;
  }


  if(!data){

    const {
      error:createError
    } =
    await supabaseClient
      .from("member_profiles")
      .insert({

        id:currentUser.id,

        full_name:
          currentUser.user_metadata
            ?.full_name || "",

        email:
          currentUser.email,

        approval_status:
          "pending",

        member_status:
          "inactive"

      });


    if(createError){

      showMessage(
        "Unable to create profile: " +
        createError.message,
        "error"
      );

      return;
    }


    await loadProfile();

    return;
  }


  currentProfile =
    data;


  fillProfile(data);

}


/* =========================
   FILL PROFILE
========================= */

function fillProfile(profile){

  document.getElementById(
    "fullName"
  ).value =
    profile.full_name || "";


  document.getElementById(
    "email"
  ).value =
    profile.email ||
    currentUser.email ||
    "";


  document.getElementById(
    "mobile"
  ).value =
    profile.mobile || "";


  document.getElementById(
    "village"
  ).value =
    profile.village || "";


  document.getElementById(
    "address"
  ).value =
    profile.address || "";


  document.getElementById(
    "bloodGroup"
  ).value =
    profile.blood_group || "";


  document.getElementById(
    "memberId"
  ).value =
    profile.member_id || "Pending Approval";


  document.getElementById(
    "designation"
  ).value =
    profile.designation || "Member";


  document.getElementById(
    "memberStatus"
  ).value =
    profile.member_status || "inactive";


  const photo =
    document.getElementById(
      "profilePhoto"
    );


  if(profile.profile_photo_url){

    photo.src =
      profile.profile_photo_url;

  }else{

    photo.src =
      "https://via.placeholder.com/130?text=Photo";

  }


  renderIdCard(profile);

}


/* =========================
   SAVE PROFILE
========================= */

async function saveProfile(){

  if(!currentUser) return;


  const fullName =
    document.getElementById(
      "fullName"
    ).value.trim();


  const mobile =
    document.getElementById(
      "mobile"
    ).value.trim();


  const village =
    document.getElementById(
      "village"
    ).value.trim();


  const address =
    document.getElementById(
      "address"
    ).value.trim();


  const bloodGroup =
    document.getElementById(
      "bloodGroup"
    ).value;


  if(!fullName){

    showMessage(
      "Full Name is required.",
      "error"
    );

    return;
  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("member_profiles")
    .update({

      full_name:
        fullName,

      mobile:
        mobile || null,

      village:
        village || null,

      address:
        address || null,

      blood_group:
        bloodGroup || null

    })
    .eq(
      "id",
      currentUser.id
    )
    .select()
    .single();


  if(error){

    showMessage(
      "Profile update failed: " +
      error.message,
      "error"
    );

    return;
  }


  currentProfile =
    data;


  fillProfile(data);


  showMessage(
    "Profile saved successfully.",
    "success"
  );

}


/* =========================
   PHOTO UPLOAD
========================= */

async function uploadPhoto(){

  const input =
    document.getElementById(
      "photoInput"
    );


  const file =
    input.files[0];


  if(!file){

    showMessage(
      "Please select a photo first.",
      "error"
    );

    return;
  }


  if(!file.type.startsWith("image/")){

    showMessage(
      "Only image files are allowed.",
      "error"
    );

    return;
  }


  if(file.size > 5 * 1024 * 1024){

    showMessage(
      "Photo must be less than 5 MB.",
      "error"
    );

    return;
  }


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const filePath =
    currentUser.id +
    "/" +
    Date.now() +
    "." +
    extension;


  const {
    error:uploadError
  } =
  await supabaseClient
    .storage
    .from("member-photos")
    .upload(
      filePath,
      file,
      {
        upsert:true
      }
    );


  if(uploadError){

    showMessage(
      "Photo upload failed: " +
      uploadError.message,
      "error"
    );

    return;
  }


  const {
    data:publicData
  } =
  supabaseClient
    .storage
    .from("member-photos")
    .getPublicUrl(filePath);


  const publicUrl =
    publicData.publicUrl;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("member_profiles")
    .update({

      profile_photo_url:
        publicUrl

    })
    .eq(
      "id",
      currentUser.id
    )
    .select()
    .single();


  if(error){

    showMessage(
      "Photo URL update failed: " +
      error.message,
      "error"
    );

    return;
  }


  currentProfile =
    data;


  fillProfile(data);


  input.value = "";


  showMessage(
    "Profile photo uploaded successfully.",
    "success"
  );

}


/* =========================
   ID CARD
========================= */

function renderIdCard(profile){

  const area =
    document.getElementById(
      "idCardArea"
    );


  if(
    !profile.member_id ||
    profile.approval_status !== "approved"
  ){

    area.innerHTML = `

      <div class="not-approved">

        <strong>Member ID Card is not active yet.</strong>

        <br><br>

        Your account is waiting for
        Super Admin approval.

      </div>

    `;

    return;
  }


  const memberUrl =
    new URL(
      "member.html",
      window.location.href
    );


  memberUrl.searchParams.set(
    "id",
    profile.member_id
  );


  const qrUrl =
    "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" +
    encodeURIComponent(
      memberUrl.toString()
    );


  const photo =
    profile.profile_photo_url
      ? profile.profile_photo_url
      : "https://via.placeholder.com/300?text=Photo";


  const statusClass =
    profile.member_status === "active"
      ? "active-status"
      : "inactive-status";


  area.innerHTML = `

    <div class="id-card-wrapper">

      <div
        class="id-card"
        id="digitalIdCard">

        <div class="id-header">

          <h2>
            Maa Basuli Uda Jatra Committee
          </h2>

          <p>
            Thakurmunda, Mayurbhanj, Odisha
          </p>

        </div>


        <div class="id-body">

          <img
            class="id-photo"
            src="${escapeAttr(photo)}"
            crossorigin="anonymous"
            alt="Member Photo">


          <div class="id-info">

            <div class="id-name">
              ${escapeHtml(profile.full_name || "")}
            </div>

            <div class="id-designation">
              ${escapeHtml(profile.designation || "Member")}
            </div>


            <div class="id-row">
              <strong>Member ID:</strong>
              <span>
                ${escapeHtml(profile.member_id)}
              </span>
            </div>


            <div class="id-row">
              <strong>Mobile:</strong>
              <span>
                ${escapeHtml(profile.mobile || "—")}
              </span>
            </div>


            <div class="id-row">
              <strong>Village:</strong>
              <span>
                ${escapeHtml(profile.village || "—")}
              </span>
            </div>


            <div class="id-row">
              <strong>Blood:</strong>
              <span>
                ${escapeHtml(profile.blood_group || "—")}
              </span>
            </div>


            <span
              class="id-status ${statusClass}">

              ${escapeHtml(
                profile.member_status || "inactive"
              )}

            </span>

          </div>

        </div>


        <div class="qr-box">

          <img
            src="${escapeAttr(qrUrl)}"
            crossorigin="anonymous"
            alt="Member QR Code">

        </div>


        <div class="id-footer">

          Scan QR to verify live member profile

        </div>

      </div>

    </div>


    <div class="id-actions">

      <button
        class="download-btn"
        onclick="downloadIdCard()">

        ⬇️ Download ID Card

      </button>


      <button
        class="print-btn"
        onclick="printIdCard()">

        🖨️ Print ID Card

      </button>


      <button
        class="verify-btn"
        onclick="openMemberProfile()">

        🔎 View Public Profile

      </button>

    </div>

  `;

}


/* =========================
   DOWNLOAD ID CARD
========================= */

async function downloadIdCard(){

  const card =
    document.getElementById(
      "digitalIdCard"
    );


  if(!card){

    alert(
      "Digital ID Card is not available."
    );

    return;
  }


  const button =
    document.querySelector(
      ".download-btn"
    );


  const oldText =
    button.textContent;


  button.disabled = true;

  button.textContent =
    "Preparing...";


  try{

    const canvas =
      await html2canvas(
        card,
        {
          scale:2,
          useCORS:true,
          allowTaint:false,
          backgroundColor:"#ffffff"
        }
      );


    const link =
      document.createElement("a");


    link.download =
      "Maa-Basuli-Member-ID-" +
      (currentProfile.member_id || "Card") +
      ".png";


    link.href =
      canvas.toDataURL(
        "image/png"
      );


    link.click();


  }catch(error){

    alert(
      "Download failed. Please use Print ID Card option."
    );

  }


  button.disabled = false;

  button.textContent =
    oldText;

}


/* =========================
   PRINT ID CARD
========================= */

function printIdCard(){

  if(!document.getElementById(
    "digitalIdCard"
  )){

    alert(
      "Digital ID Card is not available."
    );

    return;
  }


  window.print();

}


/* =========================
   OPEN PUBLIC PROFILE
========================= */

function openMemberProfile(){

  if(
    !currentProfile ||
    !currentProfile.member_id
  ){

    return;
  }


  const url =
    new URL(
      "member.html",
      window.location.href
    );


  url.searchParams.set(
    "id",
    currentProfile.member_id
  );


  window.open(
    url.toString(),
    "_blank"
  );

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  window.location.href =
    "index.html";

}


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  type
){

  const box =
    document.getElementById(
      "profileMessage"
    );


  box.textContent =
    text;


  box.className =
    "message " + type;


  setTimeout(() => {

    box.className =
      "message";

  },5000);

}


/* =========================
   SECURITY HELPERS
========================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


function escapeAttr(value){

  return escapeHtml(value);

}
